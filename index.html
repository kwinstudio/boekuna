<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workforce OS — Open Werkmodus</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#122033;--muted:#667487;--line:#dce3ea;--brand:#126d63;--nav:#0d2b2a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;margin:5px 8px 24px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cfe3df;padding:11px 12px;border-radius:10px;margin:3px 0;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;background:#ffffff0c;border:1px solid #ffffff12;border-radius:12px;padding:12px;font-size:12px}.main{min-width:0}.top{min-height:68px;background:#f8fafce8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 24px;position:sticky;top:0;z-index:5}.page{padding:24px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 6px;font-size:28px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.35fr .65fr}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px #1f293711}.pad{padding:17px}.label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.value{font-size:27px;font-weight:850;margin-top:7px}.badge{display:inline-flex;background:#eef2f6;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.ok{background:#e5f7f1;color:#11614f}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:white;border-color:var(--brand)}.danger{color:#a61b12}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px;min-width:950px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:10px;text-transform:uppercase;color:var(--muted)}input,select{border:1px solid #ccd6e0;border-radius:8px;padding:8px;background:white;color:var(--text)}td input,td select{max-width:180px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.notice{background:#fff8e7;border:1px solid #f0d9a7;padding:11px 13px;border-radius:11px;color:#694400;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){.shell{display:block}.side{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.metrics,.two{grid-template-columns:1fr 1fr}.top{position:static}.page{padding:16px}}@media(max-width:520px){.metrics,.two{grid-template-columns:1fr}}
</style>
</head><body>
<div class="shell"><aside class="side"><div class="brand">W Workforce OS</div><div class="nav" id="nav"></div><div class="sidefoot"><strong>Workforce Demo Hospitality</strong><br>Open werkmodus<br><span class="badge" id="staffBadge">100 medewerkers</span></div></aside><div class="main"><header class="top"><div><strong>Workforce Demo Hospitality</strong><div class="muted" style="font-size:12px">Geen login · wijzigingen worden in deze browser opgeslagen</div></div><div class="actions"><button class="btn" onclick="exportData()">Data exporteren</button><label class="btn">Data importeren<input id="importFile" type="file" accept=".json" hidden onchange="importData(this)"></label><button class="btn danger" onclick="resetDemo()">Demo resetten</button></div></header><main class="page" id="app"></main></div></div>
<script>
const roles=["Bediening","Bartender","Runner","Keuken","Keukenhulp","Supervisor","Host","Afwas"];
const locations=["Rotterdam Centrum","Kop van Zuid","Schiedam Haven"];
const first=["Noah","Liam","Sem","Lucas","Daan","Finn","Milan","Levi","Mees","Sam","Sophie","Emma","Julia","Mila","Tess","Sara","Liv","Nora","Lotte","Yara","Amir","Youssef","Adam","Omar","Bilal","Nour","Aya","Lina","Meryem","Jayden","Jason","Ryan","Dylan","Jamie","Bo","Fleur","Isa","Lynn","Eva","Nina","Zoe","Max","Bram","Jesse","Thijs","Thomas","Ruben","Tim","Stijn"];
const last=["de Jong","Jansen","de Vries","van Dijk","Bakker","Visser","Smit","Meijer","de Boer","Mulder","Vos","Bos","Peters","Hendriks","Dekker","Brouwer","de Wit","Dijkstra","Smits","de Graaf","El Amrani","Ait Said","Benali","Haddad","Aksoy","Yilmaz","Demir","Kaya","Ozturk","Aydin","Nguyen","Tran","Pham","Chen","Wang","Khan","Singh","Patel","Garcia","Martinez"];
const base={Bediening:14.75,Bartender:15.5,Runner:14.25,Keuken:16.25,Keukenhulp:14.5,Supervisor:19.5,Host:15,Afwas:14.25};
const sections=["Overzicht","Planning","Forecast","Uren","Team","Verlof","Rapportages","Instellingen"];let tab="Overzicht";
function dateOff(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fresh(){let employees=[];for(let i=0;i<100;i++){let role=roles[(i*3+i%5)%roles.length],name=first[i%first.length]+" "+last[(i*7)%last.length];employees.push({id:"e"+(i+1),name,email:(name.toLowerCase().replace(/[^a-z0-9]+/g,".")+"."+(i+1)+"@demo-hospitality.nl"),role,location:locations[(i*5+i)%3],hours:[12,16,20,24,28,32,36,38][(i*3)%8],wage:Math.round((base[role]+(i%7)*.22)*100)/100,status:i%23===0?"inactive":"active"})}let forecast=[];for(let i=0;i<14;i++){let amt=[12200,13600,14900,16400,18900,25800,28900][new Date(dateOff(i)+"T12:00:00").getDay()];forecast.push({date:dateOff(i),amount:amt,low:Math.round(amt*.89),high:Math.round(amt*1.12),confidence:78+i%10})}let shifts=[];for(let d=0;d<7;d++)for(let j=0;j<24;j++){let e=employees[(d*13+j*3)%employees.length];if(e.status==="inactive")continue;let start=(e.role==="Keuken"||e.role==="Keukenhulp")?14+j%3:16+j%3;shifts.push({id:"s"+d+"-"+j,employeeId:e.id,date:dateOff(d),role:e.role,location:e.location,start:String(start).padStart(2,"0")+":00",end:String(Math.min(23,start+6)).padStart(2,"0")+":00"})}let leave=[];for(let i=0;i<10;i++)leave.push({id:"l"+i,employeeId:employees[(i*9)%100].id,start:dateOff(i+2),end:dateOff(i+3),type:i%3===0?"Bijzonder verlof":"Vakantie",status:i%4===0?"Goedgekeurd":"In behandeling"});return {employees,forecast,shifts,leave,clocked:[]}}
let state;try{state=JSON.parse(localStorage.getItem("wfm-open-demo"))||fresh()}catch(e){state=fresh()}
function save(){localStorage.setItem("wfm-open-demo",JSON.stringify(state));document.getElementById("staffBadge").textContent=state.employees.length+" medewerkers"}function resetDemo(){if(!confirm("Alle demo-aanpassingen resetten?"))return;state=fresh();save();render()}function money(n){return new Intl.NumberFormat("nl-NL").format(Math.round(n))}function emp(id){return state.employees.find(x=>x.id===id)||{name:"Onbekend"}}function opts(arr,val){return arr.map(x=>'<option '+(x===val?'selected':'')+'>'+x+'</option>').join("")}function renderNav(){document.getElementById("nav").innerHTML=sections.map(s=>'<button class="'+(tab===s?'active':'')+'" onclick="tab=\''+s+'\';render()">'+s+'</button>').join("")}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="workforce-os-demo-data.json";a.click();URL.revokeObjectURL(url)}function importData(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render()}catch(e){alert("Dit JSON-bestand kon niet worden ingelezen.")}};r.readAsText(file)}
function render(){renderNav();save();let a=document.getElementById("app");if(tab==="Overzicht")overview(a);if(tab==="Team")team(a);if(tab==="Planning")planning(a);if(tab==="Forecast")forecast(a);if(tab==="Uren")hours(a);if(tab==="Verlof")leaveView(a);if(tab==="Rapportages")reports(a);if(tab==="Instellingen")settings(a)}
function overview(a){let active=state.employees.filter(e=>e.status==="active"),fs=state.forecast[0]||{amount:0,confidence:0},today=state.shifts.filter(s=>s.date===dateOff(0));let ph=today.reduce((n,s)=>n+(+s.end.slice(0,2)-+s.start.slice(0,2)),0),aw=active.reduce((n,e)=>n+e.wage,0)/(active.length||1),cost=Math.round(ph*aw*1.28),pct=fs.amount?Math.round(cost/fs.amount*1000)/10:0;a.innerHTML='<div class="title"><div><h1>Vandaag</h1><div class="muted">Volledig gevulde WFM-werkversie.</div></div><span class="badge ok">Open werkmodus</span></div><div class="grid metrics"><div class="card pad"><div class="label">Forecast omzet</div><div class="value">€ '+money(fs.amount)+'</div><div class="muted">'+fs.confidence+'% confidence</div></div><div class="card pad"><div class="label">Actieve medewerkers</div><div class="value">'+active.length+'</div><div class="muted">'+(state.employees.length-active.length)+' inactief</div></div><div class="card pad"><div class="label">Geplande uren</div><div class="value">'+ph+' u</div><div class="muted">'+today.length+' diensten</div></div><div class="card pad"><div class="label">Loonkosten %</div><div class="value">'+pct+'%</div><div class="muted">€ '+money(cost)+' indicatief</div></div></div><div class="grid two" style="margin-top:14px"><div class="card pad"><h2>Bezetting per functie</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><strong>'+active.filter(e=>e.role===r).length+'</strong></div>').join("")+'</div><div class="card pad"><h2>Locaties</h2>'+locations.map(l=>'<div class="row"><span>'+l+'</span><strong>'+active.filter(e=>e.location===l).length+'</strong></div>').join("")+'</div></div>'}
function team(a){a.innerHTML='<div class="title"><div><h1>Team <span class="badge ok">'+state.employees.length+' medewerkers</span></h1><div class="muted">Naam, functie, locatie, contracturen, loon en status zijn direct bewerkbaar.</div></div><button class="btn primary" onclick="addEmployee()">Medewerker toevoegen</button></div><div class="card table"><table><thead><tr><th>Naam</th><th>Functie</th><th>Locatie</th><th>Contract</th><th>Uurloon</th><th>Status</th></tr></thead><tbody>'+state.employees.map((e,i)=>'<tr><td><input value="'+e.name.replace(/"/g,"&quot;")+'" onchange="editEmp('+i+',\'name\',this.value)"><div class="muted">'+e.email+'</div></td><td><select onchange="editEmp('+i+',\'role\',this.value)">'+opts(roles,e.role)+'</select></td><td><select onchange="editEmp('+i+',\'location\',this.value)">'+opts(locations,e.location)+'</select></td><td><input type="number" value="'+e.hours+'" style="width:70px" onchange="editEmp('+i+',\'hours\',+this.value)"> u</td><td>€ <input type="number" step=".01" value="'+e.wage+'" style="width:78px" onchange="editEmp('+i+',\'wage\',+this.value)"></td><td><select onchange="editEmp('+i+',\'status\',this.value)">'+opts(["active","inactive"],e.status)+'</select></td></tr>').join("")+'</tbody></table></div>'}
function editEmp(i,k,v){state.employees[i][k]=v;save()}function addEmployee(){state.employees.unshift({id:"e"+Date.now(),name:"Nieuwe medewerker",email:"nieuw@demo-hospitality.nl",role:"Bediening",location:locations[0],hours:24,wage:15,status:"active"});save();team(document.getElementById("app"))}
function planning(a){a.innerHTML='<div class="title"><div><h1>Planning</h1><div class="muted">Wijzig medewerker, dag, functie, locatie en tijden.</div></div><button class="btn primary" onclick="addShift()">Dienst toevoegen</button></div><div class="card table"><table><thead><tr><th>Datum</th><th>Medewerker</th><th>Functie</th><th>Locatie</th><th>Start</th><th>Einde</th><th></th></tr></thead><tbody>'+state.shifts.slice(0,170).map((s,i)=>'<tr><td><input type="date" value="'+s.date+'" onchange="editShift('+i+',\'date\',this.value)"></td><td><select onchange="editShift('+i+',\'employeeId\',this.value)">'+state.employees.filter(e=>e.status==="active").map(e=>'<option value="'+e.id+'" '+(e.id===s.employeeId?'selected':'')+'>'+e.name+'</option>').join("")+'</select></td><td><select onchange="editShift('+i+',\'role\',this.value)">'+opts(roles,s.role)+'</select></td><td><select onchange="editShift('+i+',\'location\',this.value)">'+opts(locations,s.location)+'</select></td><td><input type="time" value="'+s.start+'" onchange="editShift('+i+',\'start\',this.value)"></td><td><input type="time" value="'+s.end+'" onchange="editShift('+i+',\'end\',this.value)"></td><td><button class="btn danger" onclick="delShift('+i+')">Verwijder</button></td></tr>').join("")+'</tbody></table></div>'}
function editShift(i,k,v){state.shifts[i][k]=v;save()}function delShift(i){state.shifts.splice(i,1);save();planning(document.getElementById("app"))}function addShift(){let e=state.employees.find(x=>x.status==="active");state.shifts.unshift({id:"s"+Date.now(),employeeId:e.id,date:dateOff(0),role:e.role,location:e.location,start:"17:00",end:"23:00"});save();planning(document.getElementById("app"))}
function forecast(a){a.innerHTML='<div class="title"><div><h1>Forecast</h1><div class="muted">Omzet, bandbreedte en confidence zijn direct aanpasbaar.</div></div></div><div class="card table"><table><thead><tr><th>Dag</th><th>Forecast</th><th>Laag</th><th>Hoog</th><th>Confidence</th></tr></thead><tbody>'+state.forecast.map((f,i)=>'<tr><td>'+f.date+'</td><td>€ <input type="number" value="'+f.amount+'" onchange="editFc('+i+',\'amount\',+this.value)"></td><td>€ <input type="number" value="'+f.low+'" onchange="editFc('+i+',\'low\',+this.value)"></td><td>€ <input type="number" value="'+f.high+'" onchange="editFc('+i+',\'high\',+this.value)"></td><td><input type="number" min="0" max="100" value="'+f.confidence+'" style="width:70px" onchange="editFc('+i+',\'confidence\',+this.value)">%</td></tr>').join("")+'</tbody></table></div>'}function editFc(i,k,v){state.forecast[i][k]=v;save()}
function hours(a){a.innerHTML='<div class="title"><div><h1>Uren</h1><div class="muted">Klok medewerkers in en uit.</div></div></div><div class="card pad"><h2>Klokterminal</h2><select id="clockEmp">'+state.employees.filter(e=>e.status==="active").map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join("")+'</select> <button class="btn primary" onclick="clockIn()">Inklokken</button> <button class="btn" onclick="clockOut()">Uitklokken</button></div><div class="card table" style="margin-top:14px"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th></tr></thead><tbody>'+state.clocked.slice().reverse().map(c=>'<tr><td>'+emp(c.employeeId).name+'</td><td>'+c.start+'</td><td>'+(c.end||"Actief")+'</td></tr>').join("")+'</tbody></table></div>'}
function clockIn(){let id=document.getElementById("clockEmp").value;state.clocked.push({employeeId:id,start:new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})});save();hours(document.getElementById("app"))}function clockOut(){for(let i=state.clocked.length-1;i>=0;i--){if(!state.clocked[i].end){state.clocked[i].end=new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});break}}save();hours(document.getElementById("app"))}
function leaveView(a){a.innerHTML='<div class="title"><div><h1>Verlof</h1><div class="muted">Periode, type en status zijn bewerkbaar.</div></div></div><div class="card table"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th><th>Type</th><th>Status</th></tr></thead><tbody>'+state.leave.map((l,i)=>'<tr><td>'+emp(l.employeeId).name+'</td><td><input type="date" value="'+l.start+'" onchange="editLv('+i+',\'start\',this.value)"></td><td><input type="date" value="'+l.end+'" onchange="editLv('+i+',\'end\',this.value)"></td><td><select onchange="editLv('+i+',\'type\',this.value)">'+opts(["Vakantie","Bijzonder verlof","Onbetaald verlof"],l.type)+'</select></td><td><select onchange="editLv('+i+',\'status\',this.value)">'+opts(["In behandeling","Goedgekeurd","Afgewezen"],l.status)+'</select></td></tr>').join("")+'</tbody></table></div>'}function editLv(i,k,v){state.leave[i][k]=v;save()}
function reports(a){let avg=state.employees.reduce((n,e)=>n+e.wage,0)/(state.employees.length||1);a.innerHTML='<div class="title"><div><h1>Rapportages</h1><div class="muted">Live berekend uit je aanpassingen.</div></div></div><div class="grid metrics"><div class="card pad"><div class="label">Gem. uurloon</div><div class="value">€ '+avg.toFixed(2)+'</div></div><div class="card pad"><div class="label">Contracturen totaal</div><div class="value">'+state.employees.reduce((n,e)=>n+e.hours,0)+' u</div></div><div class="card pad"><div class="label">Diensten 7 dagen</div><div class="value">'+state.shifts.length+'</div></div><div class="card pad"><div class="label">Verlof open</div><div class="value">'+state.leave.filter(l=>l.status==="In behandeling").length+'</div></div></div><div class="card pad" style="margin-top:14px"><h2>Personeel per functie</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><strong>'+state.employees.filter(e=>e.role===r).length+'</strong></div>').join("")+'</div>'}
function settings(a){a.innerHTML='<div class="title"><div><h1>Instellingen</h1><div class="muted">Demo-organisatie en structuur.</div></div></div><div class="grid two"><div class="card pad"><h2>Functies</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><span class="badge">'+state.employees.filter(e=>e.role===r).length+'</span></div>').join("")+'</div><div class="card pad"><h2>Locaties</h2>'+locations.map(l=>'<div class="row"><span>'+l+'</span><span class="badge">'+state.employees.filter(e=>e.location===l).length+'</span></div>').join("")+'</div></div><div class="notice" style="margin-top:14px">Dit is de open kijk- en werkversie. Wijzigingen blijven in deze browser staan en kunnen bovenaan als JSON worden geëxporteerd.</div>'}
render();
</script></body></html>
