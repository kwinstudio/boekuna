<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workforce OS — Open Werkmodus</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#122033;--muted:#667487;--line:#dce3ea;--brand:#126d63;--nav:#0d2b2a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;margin:5px 8px 24px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cfe3df;padding:11px 12px;border-radius:10px;margin:3px 0;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;background:#ffffff0c;border:1px solid #ffffff12;border-radius:12px;padding:12px;font-size:12px}.main{min-width:0}.top{min-height:68px;background:#f8fafce8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 24px;position:sticky;top:0;z-index:5}.page{padding:24px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 6px;font-size:28px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.35fr .65fr}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px #1f293711}.pad{padding:17px}.label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.value{font-size:27px;font-weight:850;margin-top:7px}.badge{display:inline-flex;background:#eef2f6;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.ok{background:#e5f7f1;color:#11614f}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:white;border-color:var(--brand)}.danger{color:#a61b12}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px;min-width:950px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:10px;text-transform:uppercase;color:var(--muted)}input,select{border:1px solid #ccd6e0;border-radius:8px;padding:8px;background:white;color:var(--text)}td input,td select{max-width:180px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.notice{background:#fff8e7;border:1px solid #f0d9a7;padding:11px 13px;border-radius:11px;color:#694400;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Visuele weekplanner */
.planner-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.week-label{min-width:230px;text-align:center;font-weight:850}
.planner-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.staff-bank{position:sticky;top:82px}.staff-search{width:100%;margin-bottom:10px}.staff-list{display:grid;gap:7px;max-height:690px;overflow:auto;padding-right:3px}
.staff-chip{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;cursor:grab}.staff-chip:active{cursor:grabbing}.staff-chip strong{display:block;font-size:12px}.staff-meta{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:var(--muted);margin-top:4px}.staff-over{color:#a61b12;font-weight:800}
.week-scroll{overflow-x:auto;padding-bottom:8px}.week-board{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:9px;min-width:1260px}
.day-col{background:#eef2f6;border:1px solid var(--line);border-radius:14px;min-height:580px;overflow:hidden}.day-col.drag-over{outline:2px solid var(--brand);outline-offset:2px}
.day-head{background:#fff;border-bottom:1px solid var(--line);padding:10px;position:sticky;top:68px;z-index:2}.day-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.day-name{font-weight:850;text-transform:capitalize}.day-date{font-size:11px;color:var(--muted);margin-top:2px}.day-kpi{font-size:10px;color:var(--muted);margin-top:7px}
.day-add{width:100%;margin-top:9px;border:1px dashed #a9b7c5;background:#f8fafc;border-radius:9px;padding:8px;font-weight:750;cursor:pointer}
.shift-stack{display:grid;gap:8px;padding:9px}.shift-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:11px;padding:9px;cursor:grab}.shift-card:active{cursor:grabbing}.shift-card.open{border-left-color:#d98118;background:#fffaf2}.shift-card.published{box-shadow:inset 0 0 0 1px #b9dfd4}
.shift-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}.shift-role{font-size:11px;font-weight:850}.shift-time{font-size:12px;font-weight:800;margin-top:3px}.shift-person{font-size:11px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.open-text{color:#a55b00;font-weight:850}
.shift-select{width:100%;margin-top:7px;font-size:11px;padding:6px}.shift-actions{display:flex;gap:5px;margin-top:7px}.shift-actions button{flex:1;padding:6px 7px;font-size:10px}
.week-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.summary-pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:11px}
.dialog{border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px #102a2a40;max-width:520px;width:calc(100% - 32px)}.dialog::backdrop{background:#102a2a66}.dialog-inner{padding:20px}.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-grid label{display:grid;gap:5px;font-size:11px;font-weight:800}.dialog-grid input,.dialog-grid select{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.drag-hint{font-size:10px;color:var(--muted);margin-top:8px}
@media(max-width:1100px){.planner-layout{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:760px){.planner-layout{grid-template-columns:1fr}.staff-bank{position:static}.staff-list{display:flex;overflow-x:auto;max-height:none}.staff-chip{min-width:180px}.day-head{top:0}.week-label{min-width:0}.dialog-grid{grid-template-columns:1fr}}

@media(max-width:900px){.shell{display:block}.side{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.metrics,.two{grid-template-columns:1fr 1fr}.top{position:static}.page{padding:16px}}@media(max-width:520px){.metrics,.two{grid-template-columns:1fr}}
</style>
</head><body>
<div class="shell"><aside class="side"><div class="brand">W Workforce OS</div><div class="nav" id="nav"></div><div class="sidefoot"><strong>Workforce Demo Hospitality</strong><br>Open werkmodus<br><span class="badge" id="staffBadge">100 medewerkers</span></div></aside><div class="main"><header class="top"><div><strong>Workforce Demo Hospitality</strong><div class="muted" style="font-size:12px">Geen login · wijzigingen worden in deze browser opgeslagen</div></div><div class="actions"><button class="btn" onclick="exportData()">Data exporteren</button><label class="btn">Data importeren<input id="importFile" type="file" accept=".json" hidden onchange="importData(this)"></label><button class="btn danger" onclick="resetDemo()">Demo resetten</button></div></header><main class="page" id="app"></main></div></div>
<script>
const roles=["Bediening","Bartender","Runner","Keuken","Keukenhulp","Supervisor","Host","Afwas"];
const locations=["Rotterdam Centrum","Kop van Zuid","Schiedam Haven"];
const first=["Noah","Liam","Sem","Lucas","Daan","Finn","Milan","Levi","Mees","Sam","Sophie","Emma","Julia","Mila","Tess","Sara","Liv","Nora","Lotte","Yara","Amir","Youssef","Adam","Omar","Bilal","Nour","Aya","Lina","Meryem","Jayden","Jason","Ryan","Dylan","Jamie","Bo","Fleur","Isa","Lynn","Eva","Nina","Zoe","Max","Bram","Jesse","Thijs","Thomas","Ruben","Tim","Stijn"];
const last=["de Jong","Jansen","de Vries","van Dijk","Bakker","Visser","Smit","Meijer","de Boer","Mulder","Vos","Bos","Peters","Hendriks","Dekker","Brouwer","de Wit","Dijkstra","Smits","de Graaf","El Amrani","Ait Said","Benali","Haddad","Aksoy","Yilmaz","Demir","Kaya","Ozturk","Aydin","Nguyen","Tran","Pham","Chen","Wang","Khan","Singh","Patel","Garcia","Martinez"];
const base={Bediening:14.75,Bartender:15.5,Runner:14.25,Keuken:16.25,Keukenhulp:14.5,Supervisor:19.5,Host:15,Afwas:14.25};
const sections=["Overzicht","Planning","Forecast","Uren","Team","Verlof","Rapportages","Instellingen"];let tab="Overzicht";
function dateOff(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fresh(){let employees=[];for(let i=0;i<100;i++){let role=roles[(i*3+i%5)%roles.length],name=first[i%first.length]+" "+last[(i*7)%last.length];employees.push({id:"e"+(i+1),name,email:(name.toLowerCase().replace(/[^a-z0-9]+/g,".")+"."+(i+1)+"@demo-hospitality.nl"),role,location:locations[(i*5+i)%3],hours:[12,16,20,24,28,32,36,38][(i*3)%8],wage:Math.round((base[role]+(i%7)*.22)*100)/100,status:i%23===0?"inactive":"active"})}let forecast=[];for(let i=0;i<14;i++){let amt=[12200,13600,14900,16400,18900,25800,28900][new Date(dateOff(i)+"T12:00:00").getDay()];forecast.push({date:dateOff(i),amount:amt,low:Math.round(amt*.89),high:Math.round(amt*1.12),confidence:78+i%10})}let shifts=[];for(let d=0;d<7;d++)for(let j=0;j<24;j++){let e=employees[(d*13+j*3)%employees.length];if(e.status==="inactive")continue;let start=(e.role==="Keuken"||e.role==="Keukenhulp")?14+j%3:16+j%3;shifts.push({id:"s"+d+"-"+j,employeeId:(j%5===0?"":e.id),date:dateOff(d),role:e.role,location:e.location,start:String(start).padStart(2,"0")+":00",end:String(Math.min(23,start+6)).padStart(2,"0")+":00",published:false})}let leave=[];for(let i=0;i<10;i++)leave.push({id:"l"+i,employeeId:employees[(i*9)%100].id,start:dateOff(i+2),end:dateOff(i+3),type:i%3===0?"Bijzonder verlof":"Vakantie",status:i%4===0?"Goedgekeurd":"In behandeling"});return {employees,forecast,shifts,leave,clocked:[]}}
let state;try{state=JSON.parse(localStorage.getItem("wfm-open-demo"))||fresh()}catch(e){state=fresh()}
function save(){localStorage.setItem("wfm-open-demo",JSON.stringify(state));document.getElementById("staffBadge").textContent=state.employees.length+" medewerkers"}function resetDemo(){if(!confirm("Alle demo-aanpassingen resetten?"))return;state=fresh();save();render()}function money(n){return new Intl.NumberFormat("nl-NL").format(Math.round(n))}function emp(id){return state.employees.find(x=>x.id===id)||{name:"Onbekend"}}function opts(arr,val){return arr.map(x=>'<option '+(x===val?'selected':'')+'>'+x+'</option>').join("")}function renderNav(){document.getElementById("nav").innerHTML=sections.map(s=>'<button class="'+(tab===s?'active':'')+'" onclick="tab=\''+s+'\';render()">'+s+'</button>').join("")}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="workforce-os-demo-data.json";a.click();URL.revokeObjectURL(url)}function importData(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render()}catch(e){alert("Dit JSON-bestand kon niet worden ingelezen.")}};r.readAsText(file)}
function render(){renderNav();save();let a=document.getElementById("app");if(tab==="Overzicht")overview(a);if(tab==="Team")team(a);if(tab==="Planning")planning(a);if(tab==="Forecast")forecast(a);if(tab==="Uren")hours(a);if(tab==="Verlof")leaveView(a);if(tab==="Rapportages")reports(a);if(tab==="Instellingen")settings(a)}
function overview(a){let active=state.employees.filter(e=>e.status==="active"),fs=state.forecast[0]||{amount:0,confidence:0},today=state.shifts.filter(s=>s.date===dateOff(0));let ph=today.reduce((n,s)=>n+(+s.end.slice(0,2)-+s.start.slice(0,2)),0),aw=active.reduce((n,e)=>n+e.wage,0)/(active.length||1),cost=Math.round(ph*aw*1.28),pct=fs.amount?Math.round(cost/fs.amount*1000)/10:0;a.innerHTML='<div class="title"><div><h1>Vandaag</h1><div class="muted">Volledig gevulde WFM-werkversie.</div></div><span class="badge ok">Open werkmodus</span></div><div class="grid metrics"><div class="card pad"><div class="label">Forecast omzet</div><div class="value">€ '+money(fs.amount)+'</div><div class="muted">'+fs.confidence+'% confidence</div></div><div class="card pad"><div class="label">Actieve medewerkers</div><div class="value">'+active.length+'</div><div class="muted">'+(state.employees.length-active.length)+' inactief</div></div><div class="card pad"><div class="label">Geplande uren</div><div class="value">'+ph+' u</div><div class="muted">'+today.length+' diensten</div></div><div class="card pad"><div class="label">Loonkosten %</div><div class="value">'+pct+'%</div><div class="muted">€ '+money(cost)+' indicatief</div></div></div><div class="grid two" style="margin-top:14px"><div class="card pad"><h2>Bezetting per functie</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><strong>'+active.filter(e=>e.role===r).length+'</strong></div>').join("")+'</div><div class="card pad"><h2>Locaties</h2>'+locations.map(l=>'<div class="row"><span>'+l+'</span><strong>'+active.filter(e=>e.location===l).length+'</strong></div>').join("")+'</div></div>'}
function team(a){a.innerHTML='<div class="title"><div><h1>Team <span class="badge ok">'+state.employees.length+' medewerkers</span></h1><div class="muted">Naam, functie, locatie, contracturen, loon en status zijn direct bewerkbaar.</div></div><button class="btn primary" onclick="addEmployee()">Medewerker toevoegen</button></div><div class="card table"><table><thead><tr><th>Naam</th><th>Functie</th><th>Locatie</th><th>Contract</th><th>Uurloon</th><th>Status</th></tr></thead><tbody>'+state.employees.map((e,i)=>'<tr><td><input value="'+e.name.replace(/"/g,"&quot;")+'" onchange="editEmp('+i+',\'name\',this.value)"><div class="muted">'+e.email+'</div></td><td><select onchange="editEmp('+i+',\'role\',this.value)">'+opts(roles,e.role)+'</select></td><td><select onchange="editEmp('+i+',\'location\',this.value)">'+opts(locations,e.location)+'</select></td><td><input type="number" value="'+e.hours+'" style="width:70px" onchange="editEmp('+i+',\'hours\',+this.value)"> u</td><td>€ <input type="number" step=".01" value="'+e.wage+'" style="width:78px" onchange="editEmp('+i+',\'wage\',+this.value)"></td><td><select onchange="editEmp('+i+',\'status\',this.value)">'+opts(["active","inactive"],e.status)+'</select></td></tr>').join("")+'</tbody></table></div>'}
function editEmp(i,k,v){state.employees[i][k]=v;save()}function addEmployee(){state.employees.unshift({id:"e"+Date.now(),name:"Nieuwe medewerker",email:"nieuw@demo-hospitality.nl",role:"Bediening",location:locations[0],hours:24,wage:15,status:"active"});save();team(document.getElementById("app"))}

function monday(dateStr){let d=new Date(dateStr+"T12:00:00");let day=d.getDay();let diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d.toISOString().slice(0,10)}
function addDays(dateStr,n){let d=new Date(dateStr+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function formatDay(dateStr){return new Date(dateStr+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})}
function formatWeekLabel(start){let end=addDays(start,6);return new Date(start+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" – "+new Date(end+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"})}
let plannerWeekStart=monday(dateOff(0));let plannerEmployeeFilter="";
function weekDates(){return Array.from({length:7},(_,i)=>addDays(plannerWeekStart,i))}
function weekShifts(){let days=weekDates();return state.shifts.filter(s=>days.includes(s.date))}
function shiftHours(s){let a=Number(s.start.slice(0,2))+Number(s.start.slice(3,5))/60,b=Number(s.end.slice(0,2))+Number(s.end.slice(3,5))/60;return Math.max(0,b-a)}
function employeeWeekHours(id){return weekShifts().filter(s=>s.employeeId===id).reduce((n,s)=>n+shiftHours(s),0)}
function dayForecast(date){let f=state.forecast.find(x=>x.date===date);return f?f.amount:0}
function roleColor(role){return ["#126d63","#526fb3","#b06a1e","#8a5ca8","#467f95","#a34d62","#678345","#725e9e"][Math.max(0,roles.indexOf(role))%8]}
function eligibleEmployees(s){return state.employees.filter(e=>e.status==="active").sort((a,b)=>{let ar=(a.role===s.role?0:1)+(a.location===s.location?0:1),br=(b.role===s.role?0:1)+(b.location===s.location?0:1);return ar-br||a.name.localeCompare(b.name)})}
function plannerShiftCard(s){
 let person=s.employeeId?emp(s.employeeId):null;
 let selected='<option value="">Open dienst</option>'+eligibleEmployees(s).map(e=>'<option value="'+e.id+'" '+(e.id===s.employeeId?'selected':'')+'>'+e.name+' · '+employeeWeekHours(e.id).toFixed(1)+'/'+e.hours+'u</option>').join("");
 return '<article class="shift-card '+(!s.employeeId?'open ':'')+(s.published?'published':'')+'" draggable="true" ondragstart="dragShift(event,\''+s.id+'\')" ondragover="event.preventDefault()" ondrop="dropOnShift(event,\''+s.id+'\')" style="border-left-color:'+roleColor(s.role)+'">'+
 '<div class="shift-top"><div><div class="shift-role">'+s.role+'</div><div class="shift-time">'+s.start+'–'+s.end+'</div></div><span class="badge">'+shiftHours(s).toFixed(1)+'u</span></div>'+
 '<div class="shift-person '+(!person?'open-text':'')+'">'+(person?person.name:'Open dienst')+'</div>'+
 '<select class="shift-select" onchange="assignShift(\''+s.id+'\',this.value)">'+selected+'</select>'+
 '<div class="shift-actions"><button class="btn" onclick="openShiftDialog(\''+s.id+'\')">Bewerk</button><button class="btn danger" onclick="deletePlannerShift(\''+s.id+'\')">Verwijder</button></div></article>'
}
function plannerStaffBank(){
 let q=plannerEmployeeFilter.toLowerCase().trim();
 let list=state.employees.filter(e=>e.status==="active"&&(!q||e.name.toLowerCase().includes(q)||e.role.toLowerCase().includes(q))).slice(0,100);
 return '<aside class="card pad staff-bank"><h2>Personeel</h2><input class="staff-search" placeholder="Zoek naam of functie…" value="'+plannerEmployeeFilter.replace(/"/g,"&quot;")+'" oninput="plannerEmployeeFilter=this.value;planning(document.getElementById(\'app\'))">'+
 '<div class="staff-list">'+list.map(e=>{let h=employeeWeekHours(e.id),over=h>e.hours;return '<div class="staff-chip" draggable="true" ondragstart="dragEmployee(event,\''+e.id+'\')"><strong>'+e.name+'</strong><div class="staff-meta"><span>'+e.role+'</span><span class="'+(over?'staff-over':'')+'">'+h.toFixed(1)+' / '+e.hours+'u</span></div></div>'}).join("")+'</div>'+
 '<div class="drag-hint">Sleep een medewerker op een open dienst. Klikken via de dropdown werkt ook.</div></aside>'
}
function planning(a){
 let days=weekDates(),shifts=weekShifts(),open=shifts.filter(s=>!s.employeeId).length,totalHours=shifts.reduce((n,s)=>n+shiftHours(s),0),cost=shifts.reduce((n,s)=>{let e=state.employees.find(x=>x.id===s.employeeId);return n+shiftHours(s)*(e?e.wage:0)*1.28},0);
 a.innerHTML='<div class="title"><div><h1>Weekplanning</h1><div class="muted">Maak eerst diensten. Sleep daarna medewerkers erop, of kies ze via de dropdown.</div></div><div class="actions"><button class="btn" onclick="copyCurrentWeek()">Week kopiëren</button><button class="btn primary" onclick="publishWeek()">Week publiceren</button></div></div>'+
 '<div class="planner-toolbar"><div class="week-nav"><button class="btn" onclick="changeWeek(-7)">← Vorige</button><button class="btn" onclick="goThisWeek()">Deze week</button><button class="btn" onclick="changeWeek(7)">Volgende →</button></div><div class="week-label">'+formatWeekLabel(plannerWeekStart)+'</div><div class="muted" style="font-size:11px">Sleep diensten naar een andere dag</div></div>'+
 '<div class="week-summary"><span class="summary-pill"><strong>'+shifts.length+'</strong> diensten</span><span class="summary-pill"><strong>'+open+'</strong> open</span><span class="summary-pill"><strong>'+totalHours.toFixed(1)+'</strong> geplande uren</span><span class="summary-pill"><strong>€ '+money(cost)+'</strong> loonkosten incl. factor</span></div>'+
 '<div class="planner-layout">'+plannerStaffBank()+'<div class="week-scroll"><div class="week-board">'+days.map(date=>{let ds=shifts.filter(s=>s.date===date).sort((x,y)=>x.start.localeCompare(y.start));let filled=ds.filter(s=>s.employeeId).length;return '<section class="day-col" ondragover="allowDayDrop(event)" ondragleave="this.classList.remove(\'drag-over\')" ondrop="dropOnDay(event,\''+date+'\')"><div class="day-head"><div class="day-head-top"><div><div class="day-name">'+formatDay(date)+'</div><div class="day-date">'+date+'</div></div><span class="badge">'+filled+'/'+ds.length+'</span></div><div class="day-kpi">'+(dayForecast(date)?'Forecast € '+money(dayForecast(date))+' · ':'')+ds.reduce((n,s)=>n+shiftHours(s),0).toFixed(1)+'u</div><button class="day-add" onclick="openShiftDialog(null,\''+date+'\')">＋ Dienst</button></div><div class="shift-stack">'+(ds.length?ds.map(plannerShiftCard).join(""):'<div class="muted" style="font-size:11px;padding:10px;text-align:center">Nog geen diensten</div>')+'</div></section>'}).join("")+'</div></div></div>'+
 '<dialog id="shiftDialog" class="dialog"><form method="dialog" class="dialog-inner" onsubmit="saveShiftDialog(event)"><h2 id="shiftDialogTitle">Dienst toevoegen</h2><input type="hidden" id="shiftId"><div class="dialog-grid"><label>Datum<input id="shiftDate" type="date" required></label><label>Functie<select id="shiftRole">'+roles.map(r=>'<option>'+r+'</option>').join("")+'</select></label><label>Start<input id="shiftStart" type="time" value="17:00" required></label><label>Einde<input id="shiftEnd" type="time" value="23:00" required></label><label>Locatie<select id="shiftLocation">'+locations.map(l=>'<option>'+l+'</option>').join("")+'</select></label><label>Medewerker<select id="shiftEmployee"><option value="">Open dienst</option>'+state.employees.filter(e=>e.status==="active").map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join("")+'</select></label></div><div class="dialog-actions"><button type="button" class="btn" onclick="document.getElementById(\'shiftDialog\').close()">Annuleren</button><button class="btn primary" value="default">Opslaan</button></div></form></dialog>';
}
function changeWeek(n){plannerWeekStart=addDays(plannerWeekStart,n);planning(document.getElementById("app"))}
function goThisWeek(){plannerWeekStart=monday(dateOff(0));planning(document.getElementById("app"))}
function openShiftDialog(id,date){let d=document.getElementById("shiftDialog"),s=id?state.shifts.find(x=>x.id===id):null;document.getElementById("shiftDialogTitle").textContent=s?"Dienst bewerken":"Dienst toevoegen";document.getElementById("shiftId").value=s?s.id:"";document.getElementById("shiftDate").value=s?s.date:(date||plannerWeekStart);document.getElementById("shiftRole").value=s?s.role:"Bediening";document.getElementById("shiftStart").value=s?s.start:"17:00";document.getElementById("shiftEnd").value=s?s.end:"23:00";document.getElementById("shiftLocation").value=s?s.location:locations[0];document.getElementById("shiftEmployee").value=s&&s.employeeId?s.employeeId:"";d.showModal()}
function saveShiftDialog(ev){ev.preventDefault();let id=document.getElementById("shiftId").value,date=document.getElementById("shiftDate").value,start=document.getElementById("shiftStart").value,end=document.getElementById("shiftEnd").value;if(!date||!start||!end||end<=start){alert("Controleer de datum en tijden.");return}let obj={id:id||("s"+Date.now()),date,role:document.getElementById("shiftRole").value,location:document.getElementById("shiftLocation").value,start,end,employeeId:document.getElementById("shiftEmployee").value,published:false};if(id){let i=state.shifts.findIndex(x=>x.id===id);state.shifts[i]={...state.shifts[i],...obj}}else state.shifts.push(obj);document.getElementById("shiftDialog").close();save();planning(document.getElementById("app"))}
function assignShift(id,employeeId){let s=state.shifts.find(x=>x.id===id);if(!s)return;s.employeeId=employeeId;s.published=false;save();planning(document.getElementById("app"))}
function deletePlannerShift(id){if(!confirm("Deze dienst verwijderen?"))return;state.shifts=state.shifts.filter(x=>x.id!==id);save();planning(document.getElementById("app"))}
function dragEmployee(ev,id){ev.dataTransfer.setData("text/plain","employee:"+id);ev.dataTransfer.effectAllowed="copy"}
function dragShift(ev,id){ev.dataTransfer.setData("text/plain","shift:"+id);ev.dataTransfer.effectAllowed="move"}
function dropOnShift(ev,shiftId){ev.preventDefault();ev.stopPropagation();let data=ev.dataTransfer.getData("text/plain");if(data.startsWith("employee:"))assignShift(shiftId,data.slice(9))}
function allowDayDrop(ev){ev.preventDefault();ev.currentTarget.classList.add("drag-over")}
function dropOnDay(ev,date){ev.preventDefault();ev.currentTarget.classList.remove("drag-over");let data=ev.dataTransfer.getData("text/plain");if(data.startsWith("shift:")){let s=state.shifts.find(x=>x.id===data.slice(6));if(s){s.date=date;s.published=false;save();planning(document.getElementById("app"))}}else if(data.startsWith("employee:")){let e=state.employees.find(x=>x.id===data.slice(9));if(e){state.shifts.push({id:"s"+Date.now(),employeeId:e.id,date,role:e.role,location:e.location,start:"17:00",end:"23:00",published:false});save();planning(document.getElementById("app"))}}}
function copyCurrentWeek(){let current=weekShifts();if(!current.length){alert("Er zijn geen diensten om te kopiëren.");return}if(!confirm("Kopieer deze hele week naar volgende week?"))return;let targetStart=addDays(plannerWeekStart,7),targetEnd=addDays(targetStart,6);state.shifts=state.shifts.filter(s=>!(s.date>=targetStart&&s.date<=targetEnd));current.forEach((s,i)=>state.shifts.push({...s,id:"s"+Date.now()+"-"+i,date:addDays(s.date,7),published:false}));plannerWeekStart=targetStart;save();planning(document.getElementById("app"))}
function publishWeek(){let current=weekShifts();if(!current.length){alert("Er zijn geen diensten om te publiceren.");return}current.forEach(s=>s.published=true);save();planning(document.getElementById("app"));alert("Week gemarkeerd als gepubliceerd in deze demo.")}
function forecast(a){a.innerHTML='<div class="title"><div><h1>Forecast</h1><div class="muted">Omzet, bandbreedte en confidence zijn direct aanpasbaar.</div></div></div><div class="card table"><table><thead><tr><th>Dag</th><th>Forecast</th><th>Laag</th><th>Hoog</th><th>Confidence</th></tr></thead><tbody>'+state.forecast.map((f,i)=>'<tr><td>'+f.date+'</td><td>€ <input type="number" value="'+f.amount+'" onchange="editFc('+i+',\'amount\',+this.value)"></td><td>€ <input type="number" value="'+f.low+'" onchange="editFc('+i+',\'low\',+this.value)"></td><td>€ <input type="number" value="'+f.high+'" onchange="editFc('+i+',\'high\',+this.value)"></td><td><input type="number" min="0" max="100" value="'+f.confidence+'" style="width:70px" onchange="editFc('+i+',\'confidence\',+this.value)">%</td></tr>').join("")+'</tbody></table></div>'}function editFc(i,k,v){state.forecast[i][k]=v;save()}
function hours(a){a.innerHTML='<div class="title"><div><h1>Uren</h1><div class="muted">Klok medewerkers in en uit.</div></div></div><div class="card pad"><h2>Klokterminal</h2><select id="clockEmp">'+state.employees.filter(e=>e.status==="active").map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join("")+'</select> <button class="btn primary" onclick="clockIn()">Inklokken</button> <button class="btn" onclick="clockOut()">Uitklokken</button></div><div class="card table" style="margin-top:14px"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th></tr></thead><tbody>'+state.clocked.slice().reverse().map(c=>'<tr><td>'+emp(c.employeeId).name+'</td><td>'+c.start+'</td><td>'+(c.end||"Actief")+'</td></tr>').join("")+'</tbody></table></div>'}
function clockIn(){let id=document.getElementById("clockEmp").value;state.clocked.push({employeeId:id,start:new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})});save();hours(document.getElementById("app"))}function clockOut(){for(let i=state.clocked.length-1;i>=0;i--){if(!state.clocked[i].end){state.clocked[i].end=new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});break}}save();hours(document.getElementById("app"))}
function leaveView(a){a.innerHTML='<div class="title"><div><h1>Verlof</h1><div class="muted">Periode, type en status zijn bewerkbaar.</div></div></div><div class="card table"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th><th>Type</th><th>Status</th></tr></thead><tbody>'+state.leave.map((l,i)=>'<tr><td>'+emp(l.employeeId).name+'</td><td><input type="date" value="'+l.start+'" onchange="editLv('+i+',\'start\',this.value)"></td><td><input type="date" value="'+l.end+'" onchange="editLv('+i+',\'end\',this.value)"></td><td><select onchange="editLv('+i+',\'type\',this.value)">'+opts(["Vakantie","Bijzonder verlof","Onbetaald verlof"],l.type)+'</select></td><td><select onchange="editLv('+i+',\'status\',this.value)">'+opts(["In behandeling","Goedgekeurd","Afgewezen"],l.status)+'</select></td></tr>').join("")+'</tbody></table></div>'}function editLv(i,k,v){state.leave[i][k]=v;save()}
function reports(a){let avg=state.employees.reduce((n,e)=>n+e.wage,0)/(state.employees.length||1);a.innerHTML='<div class="title"><div><h1>Rapportages</h1><div class="muted">Live berekend uit je aanpassingen.</div></div></div><div class="grid metrics"><div class="card pad"><div class="label">Gem. uurloon</div><div class="value">€ '+avg.toFixed(2)+'</div></div><div class="card pad"><div class="label">Contracturen totaal</div><div class="value">'+state.employees.reduce((n,e)=>n+e.hours,0)+' u</div></div><div class="card pad"><div class="label">Diensten 7 dagen</div><div class="value">'+state.shifts.length+'</div></div><div class="card pad"><div class="label">Verlof open</div><div class="value">'+state.leave.filter(l=>l.status==="In behandeling").length+'</div></div></div><div class="card pad" style="margin-top:14px"><h2>Personeel per functie</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><strong>'+state.employees.filter(e=>e.role===r).length+'</strong></div>').join("")+'</div>'}
function settings(a){a.innerHTML='<div class="title"><div><h1>Instellingen</h1><div class="muted">Demo-organisatie en structuur.</div></div></div><div class="grid two"><div class="card pad"><h2>Functies</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><span class="badge">'+state.employees.filter(e=>e.role===r).length+'</span></div>').join("")+'</div><div class="card pad"><h2>Locaties</h2>'+locations.map(l=>'<div class="row"><span>'+l+'</span><span class="badge">'+state.employees.filter(e=>e.location===l).length+'</span></div>').join("")+'</div></div><div class="notice" style="margin-top:14px">Dit is de open kijk- en werkversie. Wijzigingen blijven in deze browser staan en kunnen bovenaan als JSON worden geëxporteerd.</div>'}
render();
</script></body></html>
