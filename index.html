/* Weekrooster-overzicht + detailgrid */
.wr-page{max-width:none}.wr-titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.wr-list{background:#fff;border:1px solid var(--line);overflow:auto}.wr-list table{width:100%;border-collapse:collapse;min-width:1050px;font-size:12px}
.wr-list th{background:#f7f9fb;color:#476071;font-size:10px;text-transform:none;font-weight:800}.wr-list th,.wr-list td{padding:11px;border-bottom:1px solid #e6ebf0}
.wr-row{cursor:pointer}.wr-row:hover td{background:#f6fafb}.wr-row.selected td{background:#edf7f5}.wr-link{color:#008fbd;font-weight:750;cursor:pointer}.pub-dot{display:inline-flex;width:13px;height:13px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:900}.pub-yes{background:#62c46c}.pub-no{background:#e66055}
.roster-detail{max-width:none}.detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.detail-title{display:flex;align-items:center;gap:10px}.detail-title h1{font-size:24px;margin:0}.detail-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.icon-btn{min-width:38px;height:38px;padding:0 10px}.status-pub{background:#ecf8ed;border-color:#bfe2c4;color:#267a2d}.status-draft{background:#fff2f0;border-color:#f0c8c3;color:#a33a30}
.roster-controlbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0;background:#fff;border:1px solid var(--line);padding:9px}.roster-controlbar .left,.roster-controlbar .right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.stat-toggle{display:flex;align-items:center;gap:8px}.switch{width:34px;height:18px;border-radius:99px;background:#cfd8df;position:relative;cursor:pointer}.switch:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;left:2px;top:2px;transition:.15s}.switch.on{background:#e56772}.switch.on:after{left:18px}
.roster-mini-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.mini-stat{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:8px;font-size:11px}.mini-stat strong{margin-left:5px}
.nost-grid-wrap{overflow:auto;border:1px solid var(--line);background:#fff}.nost-grid{display:grid;grid-template-columns:190px repeat(7,minmax(150px,1fr));min-width:1240px;font-size:11px}
.nost-cell{border-right:1px solid #dce3ea;border-bottom:1px solid #dce3ea;min-height:50px;padding:5px;background:#fff}.nost-head{position:sticky;top:0;z-index:3;background:#f8fafc;min-height:48px;font-weight:800}.nost-left{position:sticky;left:0;z-index:2;background:#fff}.nost-corner{z-index:4}.day-headline{font-weight:800}.day-sub{display:flex;gap:7px;color:#607181;font-size:9px;margin-top:5px}
.group-row{grid-column:1/-1;display:grid;grid-template-columns:190px repeat(7,minmax(150px,1fr));min-width:1240px}.group-row>div{border-right:1px solid rgba(0,0,0,.05);border-bottom:1px solid var(--line);padding:6px 8px;min-height:34px}
.group-label{position:sticky;left:0;z-index:2;font-weight:850}.g-gt>div{background:#fff9e7}.g-coffee>div{background:#fff1fb}.g-fac>div{background:#eefaff}.g-main>div{background:#faf1ff}
.pos-label{font-size:10px;color:#334a59}.pos-meta{display:flex;gap:8px;color:#657988;font-size:9px;margin-top:4px}.roster-slot{min-height:62px;transition:.12s}.roster-slot.drag-over{background:#eaf7f4!important;box-shadow:inset 0 0 0 2px var(--brand)}
.roster-card{position:relative;background:#fff;border:1px solid #ccd7df;border-radius:4px;padding:5px 20px 5px 7px;margin:2px 0;min-height:42px;cursor:grab;box-shadow:0 1px 2px #1f293710}.roster-card:hover{border-color:#4b9eb8}.roster-card.open{border:1px dashed #e07487;background:#fff5f7}.roster-card .name{color:#008fc1;font-weight:800;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roster-card.open .name{color:#c2445d}.roster-card .time{font-size:9px;color:#455966;margin-top:3px}.roster-card .dots{position:absolute;right:5px;top:12px;font-weight:900}.roster-card .warn{color:#9a6800;margin-left:4px}
.section-collapse{margin-right:5px}.open-counter{background:#fff0f3;border-color:#ee9dac;color:#bb3f5b}.team-filter{min-width:150px}.roster-add-cell{width:100%;border:1px dashed transparent;background:transparent;color:#93a1ac;font-size:16px;line-height:24px;cursor:pointer}.roster-slot:hover .roster-add-cell{border-color:#cad5dd;color:#397b8f}
.roster-dialog{max-width:560px}.roster-dialog h2{margin-bottom:14px}

</head><body>
<div class="shell"><aside class="side"><div class="brand">W Workforce OS</div><div class="nav" id="nav"></div><div class="sidefoot"><strong>Workforce Demo Hospitality</strong><br>Open werkmodus<br><span class="badge" id="staffBadge">100 medewerkers</span></div></aside><div class="main"><header class="top"><div><strong>Workforce Demo Hospitality</strong><div class="muted" style="font-size:12px">Geen login · wijzigingen worden in deze browser opgeslagen</div></div><div class="actions"><button class="btn" onclick="exportData()">Data exporteren</button><label class="btn">Data importeren<input id="importFile" type="file" accept=".json" hidden onchange="importData(this)"></label><button class="btn danger" onclick="resetDemo()">Demo resetten</button></div></header><main class="page" id="app"></main></div></div>
<script>
const roles=["Bediening","Bartender","Runner","Keuken","Keukenhulp","Supervisor","Host","Afwas"];
const locations=["Rotterdam Centrum","Kop van Zuid","Schiedam Haven"];
const first=["Noah","Liam","Sem","Lucas","Daan","Finn","Milan","Levi","Mees","Sam","Sophie","Emma","Julia","Mila","Tess","Sara","Liv","Nora","Lotte","Yara","Amir","Youssef","Adam","Omar","Bilal","Nour","Aya","Lina","Meryem","Jayden","Jason","Ryan","Dylan","Jamie","Bo","Fleur","Isa","Lynn","Eva","Nina","Zoe","Max","Bram","Jesse","Thijs","Thomas","Ruben","Tim","Stijn"];
const last=["de Jong","Jansen","de Vries","van Dijk","Bakker","Visser","Smit","Meijer","de Boer","Mulder","Vos","Bos","Peters","Hendriks","Dekker","Brouwer","de Wit","Dijkstra","Smits","de Graaf","El Amrani","Ait Said","Benali","Haddad","Aksoy","Yilmaz","Demir","Kaya","Ozturk","Aydin","Nguyen","Tran","Pham","Chen","Wang","Khan","Singh","Patel","Garcia","Martinez"];
const base={Bediening:14.75,Bartender:15.5,Runner:14.25,Keuken:16.25,Keukenhulp:14.5,Supervisor:19.5,Host:15,Afwas:14.25};
const sections=["Overzicht","Planning","Forecast","Uren","Team","Verlof","Rapportages","Instellingen"];let tab="Overzicht";
function dateOff(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fresh(){let employees=[];for(let i=0;i<100;i++){let role=roles[(i*3+i%5)%roles.length],name=first[i%first.length]+" "+last[(i*7)%last.length];employees.push({id:"e"+(i+1),name,email:(name.toLowerCase().replace(/[^a-z0-9]+/g,".")+"."+(i+1)+"@demo-hospitality.nl"),role,location:locations[(i*5+i)%3],hours:[12,16,20,24,28,32,36,38][(i*3)%8],wage:Math.round((base[role]+(i%7)*.22)*100)/100,status:i%23===0?"inactive":"active"})}let forecast=[];for(let i=0;i<14;i++){let amt=[12200,13600,14900,16400,18900,25800,28900][new Date(dateOff(i)+"T12:00:00").getDay()];forecast.push({date:dateOff(i),amount:amt,low:Math.round(amt*.89),high:Math.round(amt*1.12),confidence:78+i%10})}let shifts=[];for(let d=0;d<7;d++)for(let j=0;j<24;j++){let e=employees[(d*13+j*3)%employees.length];if(e.status==="inactive")continue;let start=(e.role==="Keuken"||e.role==="Keukenhulp")?14+j%3:16+j%3;shifts.push({id:"s"+d+"-"+j,employeeId:(j%5===0?"":e.id),date:dateOff(d),role:e.role,location:e.location,start:String(start).padStart(2,"0")+":00",end:String(Math.min(23,start+6)).padStart(2,"0")+":00",published:false})}let leave=[];for(let i=0;i<10;i++)leave.push({id:"l"+i,employeeId:employees[(i*9)%100].id,start:dateOff(i+2),end:dateOff(i+3),type:i%3===0?"Bijzonder verlof":"Vakantie",status:i%4===0?"Goedgekeurd":"In behandeling"});return {employees,forecast,shifts,leave,clocked:[]}}
let state;try{state=JSON.parse(localStorage.getItem("wfm-open-demo"))||fresh()}catch(e){state=fresh()}
function save(){localStorage.setItem("wfm-open-demo",JSON.stringify(state));document.getElementById("staffBadge").textContent=state.employees.length+" medewerkers"}function resetDemo(){if(!confirm("Alle demo-aanpassingen resetten?"))return;state=fresh();save();render()}function money(n){return new Intl.NumberFormat("nl-NL").format(Math.round(n))}function emp(id){return state.employees.find(x=>x.id===id)||{name:"Onbekend"}}function opts(arr,val){return arr.map(x=>'<option '+(x===val?'selected':'')+'>'+x+'</option>').join("")}function renderNav(){document.getElementById("nav").innerHTML=sections.map(s=>'<button class="'+(tab===s?'active':'')+'" onclick="tab=\''+s+'\';render()">'+s+'</button>').join("")}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="workforce-os-demo-data.json";a.click();URL.revokeObjectURL(url)}function importData(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render()}catch(e){alert("Dit JSON-bestand kon niet worden ingelezen.")}};r.readAsText(file)}
function render(){renderNav();save();let a=document.getElementById("app");if(tab==="Overzicht")overview(a);if(tab==="Team")team(a);if(tab==="Planning")planning(a);if(tab==="Forecast")forecast(a);if(tab==="Uren")hours(a);if(tab==="Verlof")leaveView(a);if(tab==="Rapportages")reports(a);if(tab==="Instellingen")settings(a)}

function monday(dateStr){let d=new Date(dateStr+"T12:00:00");let day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d.toISOString().slice(0,10)}
function addDays(dateStr,n){let d=new Date(dateStr+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function formatDay(dateStr){return new Date(dateStr+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"short",day:"2-digit",month:"2-digit"}).replace(".","")}
function formatDateNL(dateStr){return new Date(dateStr+"T12:00:00").toLocaleDateString("nl-NL")}
function toMinutes(t){let p=String(t||"00:00").split(":");return Number(p[0])*60+Number(p[1]||0)}
function minToTime(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function shiftHours(s){return Math.max(0,(toMinutes(s.end)-toMinutes(s.start))/60)}
function isoWeekInfo(dateStr){let d=new Date(dateStr+"T12:00:00Z"),t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));let y=new Date(Date.UTC(t.getUTCFullYear(),0,1));let w=Math.ceil((((t-y)/86400000)+1)/7);return {week:w,year:t.getUTCFullYear()}}
function rosterIdFor(start){let x=isoWeekInfo(start);return x.year+"-"+String(x.week).padStart(2,"0")+"-44005"}
function rosterStationGroups(){return [
 {id:"gt",name:"Bar - Bier/Wijn/G&T Bar",cls:"g-gt",rows:[{id:"gt1",name:"05. G/T bar"},{id:"gt2",name:"06. G/T bar"}]},
 {id:"coffee",name:"Bar - Coffeebar",cls:"g-coffee",rows:[{id:"coffee1",name:"01. Coffee Bar"},{id:"coffee2",name:"02. Coffee Bar"}]},
 {id:"fac",name:"Bar - Facilitair",cls:"g-fac",rows:[{id:"fac1",name:"01. Facilitair Schoonmaak"},{id:"fac2",name:"02. Facilitair schoonmaak"}]},
 {id:"main",name:"Bar - Grote Bar",cls:"g-main",rows:[{id:"lead1",name:"01. Shiftleader"},{id:"lead2",name:"02. Shiftleader"},{id:"bar1",name:"03. Bar"},{id:"bar2",name:"04. Bar"},{id:"runner1",name:"05. Runner"}]}
]}
function stationForShift(s){
 if(s.station)return s.station;
 let role=s.role||"";
 if(role==="Supervisor")return (Number(String(s.id).replace(/\D/g,""))%2?"lead1":"lead2");
 if(role==="Runner"||role==="Afwas")return role==="Afwas"?"fac1":"fac2";
 if(role==="Host")return Number(String(s.id).replace(/\D/g,""))%2?"coffee1":"coffee2";
 if(role==="Bartender")return Number(String(s.id).replace(/\D/g,""))%3?"bar1":"gt1";
 if(role==="Bediening")return Number(String(s.id).replace(/\D/g,""))%2?"gt2":"bar2";
 if(role==="Keuken"||role==="Keukenhulp")return "runner1";
 return "bar1"
}
function roleForStation(station){
 if(station.indexOf("lead")===0)return "Supervisor";
 if(station.indexOf("fac")===0)return "Afwas";
 if(station.indexOf("coffee")===0)return "Host";
 if(station==="runner1")return "Runner";
 return "Bartender"
}
function ensureRosterState(){
 if(!state.rosters){
  let cur=monday(dateOff(0)),starts=[addDays(cur,-7),cur,addDays(cur,7),addDays(cur,14),addDays(cur,91),addDays(cur,98)];
  state.rosters=starts.map(function(s,i){let wi=isoWeekInfo(s);return {id:rosterIdFor(s),start:s,end:addDays(s,6),week:wi.week,year:wi.year,template:"Basisrooster v2",templateWeek:1,department:"Bar",published:i<3}})
 }
 if(!state.dayNotes)state.dayNotes={};
 state.shifts.forEach(function(s){if(typeof s.published==="undefined")s.published=false;if(typeof s.employeeId==="undefined")s.employeeId="";if(!s.station)s.station=stationForShift(s);if(!s.note)s.note=""});
}
let rosterScreen="list",selectedRosterId="",selectedRosterRow="",rosterFilterDepartment="all",rosterFilterDate="",showRosterStats=false,showOnlyOpen=false,teamFilter="all";
let plannerWeekStart=monday(dateOff(0));
function currentRoster(){ensureRosterState();return state.rosters.find(function(r){return r.id===selectedRosterId})||null}
function weekDates(){let r=currentRoster();let start=r?r.start:plannerWeekStart;return Array.from({length:7},function(_,i){return addDays(start,i)})}
function weekShifts(){let d=weekDates();return state.shifts.filter(function(s){return d.includes(s.date)})}
function dayForecast(date){let f=state.forecast.find(function(x){return x.date===date});return f?Number(f.amount):0}
function employeeWeekHours(id){return weekShifts().filter(function(s){return s.employeeId===id}).reduce(function(n,s){return n+shiftHours(s)},0)}
function availabilityFor(e,date){let i=parseInt(String(e.id).replace(/\D/g,""),10)||1,d=new Date(date+"T12:00:00").getDay();if((i+d*3)%11===0)return {ok:false,start:"",end:"",text:"Niet beschikbaar"};let start=((i+d)%4===0)?"16:00":((i+d)%5===0?"12:00":"10:00"),end=((i+d)%6===0)?"21:00":"23:59";return {ok:true,start:start,end:end,text:start+"–"+end}}
function isAvailableForShift(e,s){let a=availabilityFor(e,s.date);return a.ok&&toMinutes(s.start)>=toMinutes(a.start)&&toMinutes(s.end)<=toMinutes(a.end)}
function overlapsForEmployee(employeeId,shift){return weekShifts().some(function(s){return s.id!==shift.id&&s.employeeId===employeeId&&s.date===shift.date&&toMinutes(s.start)<toMinutes(shift.end)&&toMinutes(s.end)>toMinutes(shift.start)})}
function eligibleEmployee(e,s){return !!e&&e.status==="active"&&isAvailableForShift(e,s)&&!overlapsForEmployee(e.id,s)}
function shiftHasWarning(s){if(!s.employeeId)return false;let e=state.employees.find(function(x){return x.id===s.employeeId});return !eligibleEmployee(e,s)||employeeWeekHours(s.employeeId)>e.hours}

}

  g.rows.forEach(function(row){
   html+='<div class="nost-cell nost-left pos-label"><strong>'+row.name+'</strong><div class="pos-meta">▣ '+weekShifts().filter(function(s){return stationForShift(s)===row.id}).length+'　◷ '+weekShifts().filter(function(s){return stationForShift(s)===row.id}).reduce(function(n,s){return n+shiftHours(s)},0).toFixed(1)+'</div></div>';
   dates.forEach(function(d){let ss=weekShifts().filter(function(s){return s.date===d&&stationForShift(s)===row.id&&(teamFilter==="all"||s.role===teamFilter)&&(!showOnlyOpen||!s.employeeId)}).sort(function(a,b){return a.start.localeCompare(b.start)});html+='<div class="nost-cell roster-slot" ondragover="allowRosterDrop(event)" ondragleave="this.classList.remove(\'drag-over\')" ondrop="dropRosterCell(event,\''+d+'\',\''+row.id+'\')">'+ss.map(rosterCard).join("")+'<button class="roster-add-cell" title="Dienst toevoegen" onclick="openShiftDialog(null,\''+d+'\',\''+row.id+'\')">＋</button></div>'})
  })
 });
 return html+'</div></div>'
}
function shiftDialogHtml(){return '<dialog id="shiftDialog" class="dialog roster-dialog"><form class="dialog-inner" onsubmit="saveShiftDialog(event)"><h2 id="shiftDialogTitle">Dienst toevoegen</h2><input id="shiftId" type="hidden"><div class="dialog-grid"><label>Datum<input id="shiftDate" type="date" required></label><label>Werkplek<select id="shiftStation">'+rosterStationGroups().flatMap(function(g){return g.rows}).map(function(x){return '<option value="'+x.id+'">'+x.name+'</option>'}).join("")+'</select></label><label>Functie<select id="shiftRole">'+roles.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select></label><label>Medewerker<select id="shiftEmployee"></select></label><label>Start<input id="shiftStart" type="time" step="900" value="17:00" required></label><label>Einde<input id="shiftEnd" type="time" step="900" value="23:00" required></label><label style="grid-column:1/-1">Opmerking<input id="shiftNote" placeholder="Opmerking of bijzonderheid"></label></div><div class="dialog-actions"><button type="button" class="btn" onclick="document.getElementById(\'shiftDialog\').close()">Annuleren</button><button class="btn primary">Opslaan</button></div></form></dialog>'}
function openShiftDialog(id,date,station){let s=id?state.shifts.find(function(x){return x.id===id}):null,st=s?stationForShift(s):(station||"bar1"),role=s?s.role:roleForStation(st),temp={id:id||"new",date:s?s.date:date,start:s?s.start:"17:00",end:s?s.end:"23:00",role:role,location:"Rotterdam Centrum",employeeId:s?s.employeeId:""};document.getElementById("shiftDialogTitle").textContent=s?"Dienst bewerken":"Dienst toevoegen";document.getElementById("shiftId").value=s?s.id:"";document.getElementById("shiftDate").value=s?s.date:date;document.getElementById("shiftStation").value=st;document.getElementById("shiftRole").value=role;document.getElementById("shiftStart").value=s?s.start:"17:00";document.getElementById("shiftEnd").value=s?s.end:"23:00";document.getElementById("shiftNote").value=s?s.note:"";document.getElementById("shiftEmployee").innerHTML=shiftOptions(temp);document.getElementById("shiftEmployee").value=s&&s.employeeId?s.employeeId:"";document.getElementById("shiftDialog").showModal()}
function saveShiftDialog(ev){ev.preventDefault();let id=document.getElementById("shiftId").value,date=document.getElementById("shiftDate").value,start=document.getElementById("shiftStart").value,end=document.getElementById("shiftEnd").value;if(!date||toMinutes(end)<=toMinutes(start)){alert("Controleer datum en tijden.");return}let obj={id:id||("s"+Date.now()),date:date,station:document.getElementById("shiftStation").value,role:document.getElementById("shiftRole").value,location:"Rotterdam Centrum",employeeId:document.getElementById("shiftEmployee").value,start:start,end:end,note:document.getElementById("shiftNote").value.trim(),published:false};if(obj.employeeId){let e=state.employees.find(function(x){return x.id===obj.employeeId});if(!eligibleEmployee(e,obj)&&!confirm("Deze medewerker heeft een beschikbaarheids- of overlapwaarschuwing. Toch opslaan?"))return}let i=state.shifts.findIndex(function(x){return x.id===id});if(i>=0)state.shifts[i]=Object.assign({},state.shifts[i],obj);else state.shifts.push(obj);document.getElementById("shiftDialog").close();save();renderRosterDetail(document.getElementById("app"))}
function dragRosterShift(ev,id){ev.dataTransfer.setData("text/plain","shift:"+id);ev.dataTransfer.effectAllowed="move"}
function allowRosterDrop(ev){ev.preventDefault();ev.currentTarget.classList.add("drag-over")}
function dropRosterCell(ev,date,station){ev.preventDefault();ev.currentTarget.classList.remove("drag-over");let data=ev.dataTransfer.getData("text/plain");if(data.indexOf("shift:")!==0)return;let s=state.shifts.find(function(x){return x.id===data.slice(6)});if(!s)return;s.date=date;s.station=station;s.role=roleForStation(station);s.published=false;save();renderRosterDetail(document.getElementById("app"))}
function togglePublished(){let r=currentRoster();if(!r)return;r.published=!r.published;weekShifts().forEach(function(s){s.published=r.published});save();renderRosterDetail(document.getElementById("app"))}
function moveRosterWeek(dir){let r=currentRoster(),target=addDays(r.start,dir*7),next=state.rosters.find(function(x){return x.start===target});if(next)openRoster(next.id);else{alert("Voor die week bestaat nog geen rooster. Maak of kopieer eerst een weekrooster.")}}
function deleteOpenShifts(){let r=currentRoster(),opens=weekShifts().filter(function(s){return !s.employeeId});if(!opens.length){alert("Geen open diensten.");return}if(!confirm(opens.length+" open diensten verwijderen?"))return;let ids=new Set(opens.map(function(s){return s.id}));state.shifts=state.shifts.filter(function(s){return !ids.has(s.id)});save();renderRosterDetail(document.getElementById("app"))}
function autoFillOpen(){let filled=0;weekShifts().filter(function(s){return !s.employeeId}).forEach(function(s){let candidates=state.employees.filter(function(e){return eligibleEmployee(e,s)}).sort(function(a,b){return employeeWeekHours(a.id)-employeeWeekHours(b.id)||a.wage-b.wage});if(candidates.length){s.employeeId=candidates[0].id;filled++}});save();renderRosterDetail(document.getElementById("app"));alert(filled+" open diensten ingevuld.")}
function forecast(a){a.innerHTML='<div class="title"><div><h1>Forecast</h1><div class="muted">Omzet, bandbreedte en confidence zijn direct aanpasbaar.</div></div></div><div class="card table"><table><thead><tr><th>Dag</th><th>Forecast</th><th>Laag</th><th>Hoog</th><th>Confidence</th></tr></thead><tbody>'+state.forecast.map((f,i)=>'<tr><td>'+f.date+'</td><td>€ <input type="number" value="'+f.amount+'" onchange="editFc('+i+',\'amount\',+this.value)"></td><td>€ <input type="number" value="'+f.low+'" onchange="editFc('+i+',\'low\',+this.value)"></td><td>€ <input type="number" value="'+f.high+'" onchange="editFc('+i+',\'high\',+this.value)"></td><td><input type="number" min="0" max="100" value="'+f.confidence+'" style="width:70px" onchange="editFc('+i+',\'confidence\',+this.value)">%</td></tr>').join("")+'</tbody></table></div>'}function editFc(i,k,v){state.forecast[i][k]=v;save()}
function hours(a){a.innerHTML='<div class="title"><div><h1>Uren</h1><div class="muted">Klok medewerkers in en uit.</div></div></div><div class="card pad"><h2>Klokterminal</h2><select id="clockEmp">'+state.employees.filter(e=>e.status==="active").map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join("")+'</select> <button class="btn primary" onclick="clockIn()">Inklokken</button> <button class="btn" onclick="clockOut()">Uitklokken</button></div><div class="card table" style="margin-top:14px"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th></tr></thead><tbody>'+state.clocked.slice().reverse().map(c=>'<tr><td>'+emp(c.employeeId).name+'</td><td>'+c.start+'</td><td>'+(c.end||"Actief")+'</td></tr>').join("")+'</tbody></table></div>'}
function clockIn(){let id=document.getElementById("clockEmp").value;state.clocked.push({employeeId:id,start:new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})});save();hours(document.getElementById("app"))}function clockOut(){for(let i=state.clocked.length-1;i>=0;i--){if(!state.clocked[i].end){state.clocked[i].end=new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});break}}save();hours(document.getElementById("app"))}
function leaveView(a){a.innerHTML='<div class="title"><div><h1>Verlof</h1><div class="muted">Periode, type en status zijn bewerkbaar.</div></div></div><div class="card table"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th><th>Type</th><th>Status</th></tr></thead><tbody>'+state.leave.map((l,i)=>'<tr><td>'+emp(l.employeeId).name+'</td><td><input type="date" value="'+l.start+'" onchange="editLv('+i+',\'start\',this.value)"></td><td><input type="date" value="'+l.end+'" onchange="editLv('+i+',\'end\',this.value)"></td><td><select onchange="editLv('+i+',\'type\',this.value)">'+opts(["Vakantie","Bijzonder verlof","Onbetaald verlof"],l.type)+'</select></td><td><select onchange="editLv('+i+',\'status\',this.value)">'+opts(["In behandeling","Goedgekeurd","Afgewezen"],l.status)+'</select></td></tr>').join("")+'</tbody></table></div>'}function editLv(i,k,v){state.leave[i][k]=v;save()}
function reports(a){let avg=state.employees.reduce((n,e)=>n+e.wage,0)/(state.employees.length||1);a.innerHTML='<div class="title"><div><h1>Rapportages</h1><div class="muted">Live berekend uit je aanpassingen.</div></div></div><div class="grid metrics"><div class="card pad"><div class="label">Gem. uurloon</div><div class="value">€ '+avg.toFixed(2)+'</div></div><div class="card pad"><div class="label">Contracturen totaal</div><div class="value">'+state.employees.reduce((n,e)=>n+e.hours,0)+' u</div></div><div class="card pad"><div class="label">Diensten 7 dagen</div><div class="value">'+state.shifts.length+'</div></div><div class="card pad"><div class="label">Verlof open</div><div class="value">'+state.leave.filter(l=>l.status==="In behandeling").length+'</div></div></div><div class="card pad" style="margin-top:14px"><h2>Personeel per functie</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><strong>'+state.employees.filter(e=>e.role===r).length+'</strong></div>').join("")+'</div>'}
function settings(a){a.innerHTML='<div class="title"><div><h1>Instellingen</h1><div class="muted">Demo-organisatie en structuur.</div></div></div><div class="grid two"><div class="card pad"><h2>Functies</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><span class="badge">'+state.employees.filter(e=>e.role===r).length+'</span></div>').join("")+'</div><div class="card pad"><h2>Locaties</h2>'+locations.map(l=>'<div class="row"><span>'+l+'</span><span class="badge">'+state.employees.filter(e=>e.location===l).length+'</span></div>').join("")+'</div></div><div class="notice" style="margin-top:14px">Dit is de open kijk- en werkversie. Wijzigingen blijven in deze browser staan en kunnen bovenaan als JSON worden geëxporteerd.</div>'}
render();
</script></body></html>
