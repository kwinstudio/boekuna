<html lang="nl">
<head>

<title>Workforce OS — Open Werkmodus</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#122033;--muted:#667487;--line:#dce3ea;--brand:#126d63;--nav:#0d2b2a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh}.brand{font-size:18px;font-weight:800;margin:5px 8px 24px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cfe3df;padding:11px 12px;border-radius:10px;margin:3px 0;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.sidefoot{position:absolute;bottom:18px;left:14px;right:14px;background:#ffffff0c;border:1px solid #ffffff12;border-radius:12px;padding:12px;font-size:12px}.main{min-width:0}.top{min-height:68px;background:#f8fafce8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 24px;position:sticky;top:0;z-index:5}.page{padding:24px;max-width:1500px;margin:auto}.title{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 6px;font-size:28px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.35fr .65fr}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px #1f293711}.pad{padding:17px}.label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}.value{font-size:27px;font-weight:850;margin-top:7px}.badge{display:inline-flex;background:#eef2f6;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.ok{background:#e5f7f1;color:#11614f}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:750;cursor:pointer}.primary{background:var(--brand);color:white;border-color:var(--brand)}.danger{color:#a61b12}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px;min-width:950px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:10px;text-transform:uppercase;color:var(--muted)}input,select{border:1px solid #ccd6e0;border-radius:8px;padding:8px;background:white;color:var(--text)}td input,td select{max-width:180px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.notice{background:#fff8e7;border:1px solid #f0d9a7;padding:11px 13px;border-radius:11px;color:#694400;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Visuele weekplanner */
.planner-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.week-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.week-label{min-width:230px;text-align:center;font-weight:850}
.planner-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.staff-bank{position:sticky;top:82px}.staff-search{width:100%;margin-bottom:10px}.staff-list{display:grid;gap:7px;max-height:690px;overflow:auto;padding-right:3px}
.staff-chip{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;cursor:grab}.staff-chip:active{cursor:grabbing}.staff-chip strong{display:block;font-size:12px}.staff-meta{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:var(--muted);margin-top:4px}.staff-over{color:#a61b12;font-weight:800}
.week-scroll{overflow-x:auto;padding-bottom:8px}.week-board{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:9px;min-width:1260px}
.day-col{background:#eef2f6;border:1px solid var(--line);border-radius:14px;min-height:580px;overflow:hidden}.day-col.drag-over{outline:2px solid var(--brand);outline-offset:2px}
.day-head{background:#fff;border-bottom:1px solid var(--line);padding:10px;position:sticky;top:68px;z-index:2}.day-head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.day-name{font-weight:850;text-transform:capitalize}.day-date{font-size:11px;color:var(--muted);margin-top:2px}.day-kpi{font-size:10px;color:var(--muted);margin-top:7px}
.day-add{width:100%;margin-top:9px;border:1px dashed #a9b7c5;background:#f8fafc;border-radius:9px;padding:8px;font-weight:750;cursor:pointer}
.shift-stack{display:grid;gap:8px;padding:9px}.shift-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:11px;padding:9px;cursor:grab}.shift-card:active{cursor:grabbing}.shift-card.open{border-left-color:#d98118;background:#fffaf2}.shift-card.published{box-shadow:inset 0 0 0 1px #b9dfd4}
.shift-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}.shift-role{font-size:11px;font-weight:850}.shift-time{font-size:12px;font-weight:800;margin-top:3px}.shift-person{font-size:11px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.open-text{color:#a55b00;font-weight:850}
.shift-select{width:100%;margin-top:7px;font-size:11px;padding:6px}.shift-actions{display:flex;gap:5px;margin-top:7px}.shift-actions button{flex:1;padding:6px 7px;font-size:10px}
.week-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.summary-pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 10px;font-size:11px}
.dialog{border:0;border-radius:16px;padding:0;box-shadow:0 24px 80px #102a2a40;max-width:520px;width:calc(100% - 32px)}.dialog::backdrop{background:#102a2a66}.dialog-inner{padding:20px}.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-grid label{display:grid;gap:5px;font-size:11px;font-weight:800}.dialog-grid input,.dialog-grid select{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.drag-hint{font-size:10px;color:var(--muted);margin-top:8px}
@media(max-width:1100px){.planner-layout{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:760px){.planner-layout{grid-template-columns:1fr}.staff-bank{position:static}.staff-list{display:flex;overflow-x:auto;max-height:none}.staff-chip{min-width:180px}.day-head{top:0}.week-label{min-width:0}.dialog-grid{grid-template-columns:1fr}}

@media(max-width:900px){.shell{display:block}.side{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.metrics,.two{grid-template-columns:1fr 1fr}.top{position:static}.page{padding:16px}}@media(max-width:520px){.metrics,.two{grid-template-columns:1fr}}

/* Nostradamus-geïnspireerde roosterflow */
.roster-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.roster-tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:8px 11px;font-weight:750;cursor:pointer}.seg button:last-child{border-right:0}.seg button.active{background:var(--nav);color:#fff}
.roster-stats{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;margin:10px 0 14px}.roster-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.roster-stat small{display:block;color:var(--muted);font-weight:750}.roster-stat strong{display:block;margin-top:3px;font-size:18px}
.quick-panel{background:#f0f6f5;border:1px solid #cfe3df;border-radius:12px;padding:10px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.quick-panel strong{font-size:12px}.quick-panel .muted{font-size:11px}
.day-note{font-size:10px;background:#fff4d8;border:1px solid #efdda9;border-radius:7px;padding:5px 6px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.shift-card.eligible{outline:2px solid var(--brand);outline-offset:1px}.shift-card.blocked{opacity:.45}.shift-card.warning{box-shadow:inset 0 0 0 1px #e0a147}.shift-note{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shift-label{display:inline-flex;font-size:9px;font-weight:850;border-radius:99px;padding:3px 6px;margin-top:5px;background:#eef2f6}
.warn-dot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff0d9;color:#9b5500;font-size:10px;font-weight:900}
.magic{background:#f4effc;border-color:#d8c7ef;color:#67419a}.publish{background:#126d63;color:#fff;border-color:#126d63}
.staff-chip.selected{outline:2px solid var(--brand);background:#eef8f6}.staff-chip.unavailable{opacity:.55}.availability{font-size:9px;margin-top:4px}.good{color:#11614f}.bad{color:#a61b12}
.employee-week{overflow:auto}.employee-grid{display:grid;grid-template-columns:220px repeat(7,minmax(135px,1fr));min-width:1165px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.employee-grid>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;background:#fff;min-height:58px}.employee-grid .head{background:#f3f6f8;font-weight:850;min-height:auto}.employee-grid .ename{position:sticky;left:0;z-index:1}.mini-shift{display:block;border-left:3px solid var(--brand);background:#f7faf9;border-radius:7px;padding:5px 6px;margin:3px 0;font-size:10px}.mini-open{border-left-color:#d98118;background:#fffaf2}
.template-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.template-row select{min-width:180px}
.issues{display:grid;gap:6px}.issue{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:11px;background:#fff}.issue strong{min-width:95px}
@media(max-width:1100px){.roster-stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.roster-stats{grid-template-columns:1fr 1fr}.roster-head{display:block}.roster-tools{margin-top:10px}}

</style>
</head><body>
<div class="shell"><aside class="side"><div class="brand">W Workforce OS</div><div class="nav" id="nav"></div><div class="sidefoot"><strong>Workforce Demo Hospitality</strong><br>Open werkmodus<br><span class="badge" id="staffBadge">100 medewerkers</span></div></aside><div class="main"><header class="top"><div><strong>Workforce Demo Hospitality</strong><div class="muted" style="font-size:12px">Geen login · wijzigingen worden in deze browser opgeslagen</div></div><div class="actions"><button class="btn" onclick="exportData()">Data exporteren</button><label class="btn">Data importeren<input id="importFile" type="file" accept=".json" hidden onchange="importData(this)"></label><button class="btn danger" onclick="resetDemo()">Demo resetten</button></div></header><main class="page" id="app"></main></div></div>
<script>
const roles=["Bediening","Bartender","Runner","Keuken","Keukenhulp","Supervisor","Host","Afwas"];
const locations=["Rotterdam Centrum","Kop van Zuid","Schiedam Haven"];
const first=["Noah","Liam","Sem","Lucas","Daan","Finn","Milan","Levi","Mees","Sam","Sophie","Emma","Julia","Mila","Tess","Sara","Liv","Nora","Lotte","Yara","Amir","Youssef","Adam","Omar","Bilal","Nour","Aya","Lina","Meryem","Jayden","Jason","Ryan","Dylan","Jamie","Bo","Fleur","Isa","Lynn","Eva","Nina","Zoe","Max","Bram","Jesse","Thijs","Thomas","Ruben","Tim","Stijn"];
const last=["de Jong","Jansen","de Vries","van Dijk","Bakker","Visser","Smit","Meijer","de Boer","Mulder","Vos","Bos","Peters","Hendriks","Dekker","Brouwer","de Wit","Dijkstra","Smits","de Graaf","El Amrani","Ait Said","Benali","Haddad","Aksoy","Yilmaz","Demir","Kaya","Ozturk","Aydin","Nguyen","Tran","Pham","Chen","Wang","Khan","Singh","Patel","Garcia","Martinez"];
const base={Bediening:14.75,Bartender:15.5,Runner:14.25,Keuken:16.25,Keukenhulp:14.5,Supervisor:19.5,Host:15,Afwas:14.25};
const sections=["Overzicht","Planning","Forecast","Uren","Team","Verlof","Rapportages","Instellingen"];let tab="Overzicht";
function dateOff(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fresh(){let employees=[];for(let i=0;i<100;i++){let role=roles[(i*3+i%5)%roles.length],name=first[i%first.length]+" "+last[(i*7)%last.length];employees.push({id:"e"+(i+1),name,email:(name.toLowerCase().replace(/[^a-z0-9]+/g,".")+"."+(i+1)+"@demo-hospitality.nl"),role,location:locations[(i*5+i)%3],hours:[12,16,20,24,28,32,36,38][(i*3)%8],wage:Math.round((base[role]+(i%7)*.22)*100)/100,status:i%23===0?"inactive":"active"})}let forecast=[];for(let i=0;i<14;i++){let amt=[12200,13600,14900,16400,18900,25800,28900][new Date(dateOff(i)+"T12:00:00").getDay()];forecast.push({date:dateOff(i),amount:amt,low:Math.round(amt*.89),high:Math.round(amt*1.12),confidence:78+i%10})}let shifts=[];for(let d=0;d<7;d++)for(let j=0;j<24;j++){let e=employees[(d*13+j*3)%employees.length];if(e.status==="inactive")continue;let start=(e.role==="Keuken"||e.role==="Keukenhulp")?14+j%3:16+j%3;shifts.push({id:"s"+d+"-"+j,employeeId:(j%5===0?"":e.id),date:dateOff(d),role:e.role,location:e.location,start:String(start).padStart(2,"0")+":00",end:String(Math.min(23,start+6)).padStart(2,"0")+":00",published:false})}let leave=[];for(let i=0;i<10;i++)leave.push({id:"l"+i,employeeId:employees[(i*9)%100].id,start:dateOff(i+2),end:dateOff(i+3),type:i%3===0?"Bijzonder verlof":"Vakantie",status:i%4===0?"Goedgekeurd":"In behandeling"});return {employees,forecast,shifts,leave,clocked:[]}}
let state;try{state=JSON.parse(localStorage.getItem("wfm-open-demo"))||fresh()}catch(e){state=fresh()}
function save(){localStorage.setItem("wfm-open-demo",JSON.stringify(state));document.getElementById("staffBadge").textContent=state.employees.length+" medewerkers"}function resetDemo(){if(!confirm("Alle demo-aanpassingen resetten?"))return;state=fresh();save();render()}function money(n){return new Intl.NumberFormat("nl-NL").format(Math.round(n))}function emp(id){return state.employees.find(x=>x.id===id)||{name:"Onbekend"}}function opts(arr,val){return arr.map(x=>'<option '+(x===val?'selected':'')+'>'+x+'</option>').join("")}function renderNav(){document.getElementById("nav").innerHTML=sections.map(s=>'<button class="'+(tab===s?'active':'')+'" onclick="tab=\''+s+'\';render()">'+s+'</button>').join("")}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="workforce-os-demo-data.json";a.click();URL.revokeObjectURL(url)}function importData(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render()}catch(e){alert("Dit JSON-bestand kon niet worden ingelezen.")}};r.readAsText(file)}
function render(){renderNav();save();let a=document.getElementById("app");if(tab==="Overzicht")overview(a);if(tab==="Team")team(a);if(tab==="Planning")planning(a);if(tab==="Forecast")forecast(a);if(tab==="Uren")hours(a);if(tab==="Verlof")leaveView(a);if(tab==="Rapportages")reports(a);if(tab==="Instellingen")settings(a)}
function overview(a){let active=state.employees.filter(e=>e.status==="active"),fs=state.forecast[0]||{amount:0,confidence:0},today=state.shifts.filter(s=>s.date===dateOff(0));let ph=today.reduce((n,s)=>n+(+s.end.slice(0,2)-+s.start.slice(0,2)),0),aw=active.reduce((n,e)=>n+e.wage,0)/(active.length||1),cost=Math.round(ph*aw*1.28),pct=fs.amount?Math.round(cost/fs.amount*1000)/10:0;a.innerHTML='<div class="title"><div><h1>Vandaag</h1><div class="muted">Volledig gevulde WFM-werkversie.</div></div><span class="badge ok">Open werkmodus</span></div><div class="grid metrics"><div class="card pad"><div class="label">Forecast omzet</div><div class="value">€ '+money(fs.amount)+'</div><div class="muted">'+fs.confidence+'% confidence</div></div><div class="card pad"><div class="label">Actieve medewerkers</div><div class="value">'+active.length+'</div><div class="muted">'+(state.employees.length-active.length)+' inactief</div></div><div class="card pad"><div class="label">Geplande uren</div><div class="value">'+ph+' u</div><div class="muted">'+today.length+' diensten</div></div><div class="card pad"><div class="label">Loonkosten %</div><div class="value">'+pct+'%</div><div class="muted">€ '+money(cost)+' indicatief</div></div></div><div class="grid two" style="margin-top:14px"><div class="card pad"><h2>Bezetting per functie</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><strong>'+active.filter(e=>e.role===r).length+'</strong></div>').join("")+'</div><div class="card pad"><h2>Locaties</h2>'+locations.map(l=>'<div class="row"><span>'+l+'</span><strong>'+active.filter(e=>e.location===l).length+'</strong></div>').join("")+'</div></div>'}
function team(a){a.innerHTML='<div class="title"><div><h1>Team <span class="badge ok">'+state.employees.length+' medewerkers</span></h1><div class="muted">Naam, functie, locatie, contracturen, loon en status zijn direct bewerkbaar.</div></div><button class="btn primary" onclick="addEmployee()">Medewerker toevoegen</button></div><div class="card table"><table><thead><tr><th>Naam</th><th>Functie</th><th>Locatie</th><th>Contract</th><th>Uurloon</th><th>Status</th></tr></thead><tbody>'+state.employees.map((e,i)=>'<tr><td><input value="'+e.name.replace(/"/g,"&quot;")+'" onchange="editEmp('+i+',\'name\',this.value)"><div class="muted">'+e.email+'</div></td><td><select onchange="editEmp('+i+',\'role\',this.value)">'+opts(roles,e.role)+'</select></td><td><select onchange="editEmp('+i+',\'location\',this.value)">'+opts(locations,e.location)+'</select></td><td><input type="number" value="'+e.hours+'" style="width:70px" onchange="editEmp('+i+',\'hours\',+this.value)"> u</td><td>€ <input type="number" step=".01" value="'+e.wage+'" style="width:78px" onchange="editEmp('+i+',\'wage\',+this.value)"></td><td><select onchange="editEmp('+i+',\'status\',this.value)">'+opts(["active","inactive"],e.status)+'</select></td></tr>').join("")+'</tbody></table></div>'}
function editEmp(i,k,v){state.employees[i][k]=v;save()}function addEmployee(){state.employees.unshift({id:"e"+Date.now(),name:"Nieuwe medewerker",email:"nieuw@demo-hospitality.nl",role:"Bediening",location:locations[0],hours:24,wage:15,status:"active"});save();team(document.getElementById("app"))}


function monday(dateStr){let d=new Date(dateStr+"T12:00:00");let day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d.toISOString().slice(0,10)}
function addDays(dateStr,n){let d=new Date(dateStr+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function formatDay(dateStr){return new Date(dateStr+"T12:00:00").toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short"})}
function formatWeekLabel(start){let end=addDays(start,6);return new Date(start+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short"})+" – "+new Date(end+"T12:00:00").toLocaleDateString("nl-NL",{day:"numeric",month:"short",year:"numeric"})}
function toMinutes(t){let p=String(t||"00:00").split(":");return Number(p[0])*60+Number(p[1]||0)}
function minToTime(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function shiftHours(s){return Math.max(0,(toMinutes(s.end)-toMinutes(s.start))/60)}
function ensurePlannerState(){
 if(!state.dayNotes)state.dayNotes={};
 if(!state.templates)state.templates=[
  {id:"normal",name:"Normale week",factor:1},
  {id:"druk",name:"Drukke week",factor:1.25},
  {id:"rustig",name:"Rustige week",factor:.8}
 ];
 state.shifts.forEach(function(s){if(typeof s.published==="undefined")s.published=false;if(typeof s.employeeId==="undefined")s.employeeId="";if(!s.label)s.label="";if(!s.note)s.note=""});
}
let plannerWeekStart=monday(dateOff(0)),plannerEmployeeFilter="",plannerView="services",selectedEmployeeId="";
function weekDates(){return Array.from({length:7},function(_,i){return addDays(plannerWeekStart,i)})}
function weekShifts(){let d=weekDates();return state.shifts.filter(function(s){return d.includes(s.date)})}
function employeeWeekHours(id){return weekShifts().filter(function(s){return s.employeeId===id}).reduce(function(n,s){return n+shiftHours(s)},0)}
function employeeWeekShifts(id){return weekShifts().filter(function(s){return s.employeeId===id})}
function dayForecast(date){let f=state.forecast.find(function(x){return x.date===date});return f?Number(f.amount):0}
function roleColor(role){let cs=["#126d63","#526fb3","#b06a1e","#8a5ca8","#467f95","#a34d62","#678345","#725e9e"];return cs[Math.max(0,roles.indexOf(role))%cs.length]}
function employeeIndexNum(e){let n=parseInt(String(e.id).replace(/\D/g,""),10);return Number.isFinite(n)?n:1}
function availabilityFor(e,date){
 let i=employeeIndexNum(e),d=new Date(date+"T12:00:00").getDay();
 if((i+d*3)%11===0)return {ok:false,start:"",end:"",text:"Niet beschikbaar"};
 let start=((i+d)%4===0)?"16:00":((i+d)%5===0?"12:00":"10:00");
 let end=((i+d)%6===0)?"21:00":"23:59";
 return {ok:true,start:start,end:end,text:start+"–"+end}
}
function isAvailableForShift(e,s){let a=availabilityFor(e,s.date);return a.ok&&toMinutes(s.start)>=toMinutes(a.start)&&toMinutes(s.end)<=toMinutes(a.end)}
function overlapsForEmployee(employeeId,shift){
 return weekShifts().some(function(s){return s.id!==shift.id&&s.employeeId===employeeId&&s.date===shift.date&&toMinutes(s.start)<toMinutes(shift.end)&&toMinutes(s.end)>toMinutes(shift.start)})
}
function previousNextRestIssue(employeeId,shift){
 let all=state.shifts.filter(function(s){return s.employeeId===employeeId&&s.id!==shift.id}).slice().sort(function(a,b){return (a.date+a.start).localeCompare(b.date+b.start)});
 let start=new Date(shift.date+"T"+shift.start+":00"),end=new Date(shift.date+"T"+shift.end+":00");
 return all.some(function(s){let ss=new Date(s.date+"T"+s.start+":00"),ee=new Date(s.date+"T"+s.end+":00");let gapBefore=(start-ee)/36e5,gapAfter=(ss-end)/36e5;return (gapBefore>=0&&gapBefore<11)||(gapAfter>=0&&gapAfter<11)})
}
function employeeEligible(e,s){
 if(!e||e.status!=="active")return false;
 if(e.role!==s.role)return false;
 if(e.location!==s.location)return false;
 if(!isAvailableForShift(e,s))return false;
 if(overlapsForEmployee(e.id,s))return false;
 return true
}
function shiftIssues(s){
 let issues=[];if(shiftHours(s)>12)issues.push("Dienst langer dan 12 uur");
 if(s.employeeId){let e=state.employees.find(function(x){return x.id===s.employeeId});if(e){
  if(e.role!==s.role)issues.push("Functie wijkt af");
  if(e.location!==s.location)issues.push("Andere locatie");
  if(!isAvailableForShift(e,s))issues.push("Niet beschikbaar");
  if(overlapsForEmployee(e.id,s))issues.push("Overlappende dienst");
  if(previousNextRestIssue(e.id,s))issues.push("Mogelijk minder dan 11 uur rust");
  if(employeeWeekHours(e.id)>e.hours)issues.push("Boven contracturen");
 }}
 return issues
}
function weekIssues(){let out=[];weekShifts().forEach(function(s){shiftIssues(s).forEach(function(msg){out.push({shift:s,msg:msg})})});return out}
function eligibleEmployees(s){
 return state.employees.filter(function(e){return e.status==="active"}).sort(function(a,b){
  let ae=employeeEligible(a,s)?0:1,be=employeeEligible(b,s)?0:1;
  if(ae!==be)return ae-be;
  let ap=Math.abs(a.hours-employeeWeekHours(a.id)),bp=Math.abs(b.hours-employeeWeekHours(b.id));
  return ap-bp||a.name.localeCompare(b.name)
 })
}
function plannedCost(){return weekShifts().reduce(function(n,s){let e=state.employees.find(function(x){return x.id===s.employeeId});return n+shiftHours(s)*(e?e.wage:0)*1.28},0)}
function forecastTotal(){return weekDates().reduce(function(n,d){return n+dayForecast(d)},0)}
function rosterStatsHtml(){
 let shifts=weekShifts(),open=shifts.filter(function(s){return !s.employeeId}).length,hours=shifts.reduce(function(n,s){return n+shiftHours(s)},0),cost=plannedCost(),forecast=forecastTotal(),pct=forecast?cost/forecast*100:0,prod=hours?forecast/hours:0;
 return '<div class="roster-stats"><div class="roster-stat"><small>Diensten</small><strong>'+shifts.length+'</strong></div><div class="roster-stat"><small>Open diensten</small><strong>'+open+'</strong></div><div class="roster-stat"><small>Geplande uren</small><strong>'+hours.toFixed(1)+'u</strong></div><div class="roster-stat"><small>Loonkosten</small><strong>€ '+money(cost)+'</strong><small>'+pct.toFixed(1)+'% van forecast</small></div><div class="roster-stat"><small>Productiviteit</small><strong>€ '+money(prod)+'/u</strong></div></div>'
}
function staffStatus(e){
 let h=employeeWeekHours(e.id),diff=h-e.hours,a=availabilityFor(e,weekDates()[0]);
 return {hours:h,diff:diff,over:h>e.hours,under:h<e.hours,availability:a}
}

 return '<aside class="card pad staff-bank"><h2>Snel roosteren</h2><div class="muted" style="font-size:11px;margin-bottom:8px">Klik een medewerker en kies daarna een passende open dienst, of sleep.</div><input class="staff-search" placeholder="Zoek naam of functie…" value="'+plannerEmployeeFilter.replace(/"/g,"&quot;")+'" oninput="plannerEmployeeFilter=this.value;planning(document.getElementById(\'app\'))"><div class="staff-list">'+list.map(function(e){let st=staffStatus(e);return '<div class="staff-chip '+(selectedEmployeeId===e.id?'selected':'')+'" draggable="true" onclick="selectPlannerEmployee(\''+e.id+'\')" ondragstart="dragEmployee(event,\''+e.id+'\')"><strong>'+e.name+'</strong><div class="staff-meta"><span>'+e.role+'</span><span class="'+(st.over?'staff-over':'')+'">'+st.hours.toFixed(1)+' / '+e.hours+'u</span></div><div class="availability '+(st.diff>0?'bad':'good')+'">'+(st.diff>0?'+'+st.diff.toFixed(1)+'u boven contract':Math.abs(st.diff).toFixed(1)+'u te plannen')+'</div></div>'}).join("")+'</div></aside>'
}
function shiftLabelHtml(s){return s.label?'<span class="shift-label">'+s.label+'</span>':""}
function plannerShiftCard(s){
 let person=s.employeeId?emp(s.employeeId):null,issues=shiftIssues(s),eligibleSelected=selectedEmployeeId&&employeeEligible(state.employees.find(function(e){return e.id===selectedEmployeeId}),s),blockedSelected=selectedEmployeeId&&!eligibleSelected;
 let selected='<option value="">Open dienst</option>'+eligibleEmployees(s).map(function(e){let ok=employeeEligible(e,s),h=employeeWeekHours(e.id);return '<option value="'+e.id+'" '+(e.id===s.employeeId?'selected':'')+' '+(!ok?'disabled':'')+'>'+e.name+' · '+h.toFixed(1)+'/'+e.hours+'u'+(ok?'':' · niet passend')+'</option>'}).join("");
 return '<article class="shift-card '+(!s.employeeId?'open ':'')+(s.published?'published ':'')+(issues.length?'warning ':'')+(eligibleSelected?'eligible ':'')+(blockedSelected?'blocked ':'')+'" draggable="true" ondragstart="dragShift(event,\''+s.id+'\')" ondragover="event.preventDefault()" ondrop="dropOnShift(event,\''+s.id+'\')" onclick="quickAssignSelected(event,\''+s.id+'\')" style="border-left-color:'+roleColor(s.role)+'"><div class="shift-top"><div><div class="shift-role">'+s.role+'</div><div class="shift-time">'+s.start+'–'+s.end+'</div></div>'+(issues.length?'<span class="warn-dot" title="'+issues.join(" · ")+'">!</span>':'<span class="badge">'+shiftHours(s).toFixed(1)+'u</span>')+'</div><div class="shift-person '+(!person?'open-text':'')+'">'+(person?person.name:'Open dienst')+'</div>'+shiftLabelHtml(s)+(s.note?'<div class="shift-note">'+s.note+'</div>':'')+'<select class="shift-select" onclick="event.stopPropagation()" onchange="assignShift(\''+s.id+'\',this.value)">'+selected+'</select><div class="shift-actions"><button class="btn" onclick="event.stopPropagation();openShiftDialog(\''+s.id+'\')">Bewerk</button><button class="btn danger" onclick="event.stopPropagation();deletePlannerShift(\''+s.id+'\')">Verwijder</button></div></article>'
}
function dayColumn(date){
 let ds=weekShifts().filter(function(s){return s.date===date}).sort(function(a,b){return a.start.localeCompare(b.start)}),filled=ds.filter(function(s){return s.employeeId}).length,note=state.dayNotes[date]||"";
 return '<section class="day-col" ondragover="allowDayDrop(event)" ondragleave="this.classList.remove(\'drag-over\')" ondrop="dropOnDay(event,\''+date+'\')"><div class="day-head"><div class="day-head-top"><div><div class="day-name">'+formatDay(date)+'</div><div class="day-date">'+date+'</div></div><span class="badge">'+filled+'/'+ds.length+'</span></div><div class="day-kpi">'+(dayForecast(date)?'Forecast € '+money(dayForecast(date))+' · ':'')+ds.reduce(function(n,s){return n+shiftHours(s)},0).toFixed(1)+'u</div><div class="day-note" onclick="editDayNote(\''+date+'\')" title="Klik om dagopmerking te wijzigen">'+(note||'＋ Dagopmerking')+'</div><button class="day-add" onclick="openShiftDialog(null,\''+date+'\')">＋ Dienst</button></div><div class="shift-stack">'+(ds.length?ds.map(plannerShiftCard).join(""):'<div class="muted" style="font-size:11px;padding:10px;text-align:center">Nog geen diensten</div>')+'</div></section>'
}

 return html+'</div></div>'
}

 let issues=weekIssues();if(!issues.length)return '<div class="notice" style="background:#edf8f4;border-color:#cfe5dc;color:#155b4d">Geen roosterconflicten gevonden in deze demo-controle.</div>';
 return '<div class="card pad" style="margin-top:14px"><h2>Controlewaarschuwingen ('+issues.length+')</h2><div class="issues">'+issues.slice(0,20).map(function(i){return '<div class="issue"><strong>'+formatDay(i.shift.date)+' '+i.shift.start+'</strong><span>'+i.msg+' · '+i.shift.role+(i.shift.employeeId?' · '+emp(i.shift.employeeId).name:'')+'</span></div>'}).join("")+'</div></div>'

function planning(a){
 ensurePlannerState();
 a.innerHTML='<div class="roster-head"><div><h1>Weekrooster</h1><div class="muted">Nostradamus-geïnspireerde flow: basisdiensten → snel roosteren → controles → publiceren.</div></div><div class="roster-tools"><div class="seg"><button class="'+(plannerView==="services"?'active':'')+'" onclick="plannerView=\'services\';planning(document.getElementById(\'app\'))">Diensten</button><button class="'+(plannerView==="employees"?'active':'')+'" onclick="plannerView=\'employees\';planning(document.getElementById(\'app\'))">Personeel</button></div><button class="btn" onclick="copyCurrentWeek()">Week kopiëren</button><button class="btn publish" onclick="publishWeek()">Publiceren</button></div></div>'+
 '<div class="planner-toolbar"><div class="week-nav"><button class="btn" onclick="changeWeek(-7)">← Vorige</button><button class="btn" onclick="goThisWeek()">Deze week</button><button class="btn" onclick="changeWeek(7)">Volgende →</button></div><div class="week-label">'+formatWeekLabel(plannerWeekStart)+'</div>'+templateControls()+'</div>'+
 rosterStatsHtml()+
 (selectedEmployeeId?'<div class="quick-panel"><div><strong>Snel roosteren: '+emp(selectedEmployeeId).name+'</strong><div class="muted">Passende open diensten hebben een groene rand. Klik erop om toe te wijzen.</div></div><button class="btn" onclick="selectedEmployeeId=\'\';planning(document.getElementById(\'app\'))">Selectie wissen</button></div>':'')+
 (plannerView==="services"?'<div class="planner-layout">'+plannerStaffBank()+'<div class="week-scroll"><div class="week-board">'+weekDates().map(dayColumn).join("")+'</div></div></div>':employeeWeekView())+
 issuesPanel()+
 '<dialog id="shiftDialog" class="dialog"><form method="dialog" class="dialog-inner" onsubmit="saveShiftDialog(event)"><h2 id="shiftDialogTitle">Dienst toevoegen</h2><input type="hidden" id="shiftId"><div class="dialog-grid"><label>Datum<input id="shiftDate" type="date" required></label><label>Functie<select id="shiftRole">'+roles.map(function(r){return '<option>'+r+'</option>'}).join("")+'</select></label><label>Start<input id="shiftStart" type="time" step="900" value="17:00" required></label><label>Einde<input id="shiftEnd" type="time" step="900" value="23:00" required></label><label>Locatie<select id="shiftLocation">'+locations.map(function(l){return '<option>'+l+'</option>'}).join("")+'</select></label><label>Medewerker<select id="shiftEmployee"><option value="">Open dienst</option>'+state.employees.filter(function(e){return e.status==="active"}).map(function(e){return '<option value="'+e.id+'">'+e.name+'</option>'}).join("")+'</select></label><label>Label<select id="shiftLabel"><option value="">Geen label</option><option>Inwerken</option><option>Sluiten</option><option>Training</option><option>Event</option><option>Verantwoordelijke</option></select></label><label>Opmerking<input id="shiftNote" placeholder="Bijzonderheden voor deze dienst"></label></div><div class="dialog-actions"><button type="button" class="btn" onclick="document.getElementById(\'shiftDialog\').close()">Annuleren</button><button class="btn primary" value="default">Opslaan</button></div></form></dialog>'
}
function selectPlannerEmployee(id){selectedEmployeeId=(selectedEmployeeId===id?"":id);planning(document.getElementById("app"))}
function quickAssignSelected(ev,shiftId){if(!selectedEmployeeId)return;if(ev.target.closest("button,select,input"))return;let s=state.shifts.find(function(x){return x.id===shiftId}),e=state.employees.find(function(x){return x.id===selectedEmployeeId});if(!s||!e)return;if(!employeeEligible(e,s)){alert("Deze medewerker past niet op deze dienst door functie, locatie, beschikbaarheid of overlap.");return}s.employeeId=e.id;s.published=false;save();planning(document.getElementById("app"))}
function changeWeek(n){plannerWeekStart=addDays(plannerWeekStart,n);selectedEmployeeId="";planning(document.getElementById("app"))}
function goThisWeek(){plannerWeekStart=monday(dateOff(0));selectedEmployeeId="";planning(document.getElementById("app"))}
function editDayNote(date){let v=prompt("Dagopmerking",state.dayNotes[date]||"");if(v===null)return;state.dayNotes[date]=v.trim();save();planning(document.getElementById("app"))}
function openShiftDialog(id,date){ensurePlannerState();let d=document.getElementById("shiftDialog"),s=id?state.shifts.find(function(x){return x.id===id}):null;document.getElementById("shiftDialogTitle").textContent=s?"Dienst bewerken":"Dienst toevoegen";document.getElementById("shiftId").value=s?s.id:"";document.getElementById("shiftDate").value=s?s.date:(date||plannerWeekStart);document.getElementById("shiftRole").value=s?s.role:"Bediening";document.getElementById("shiftStart").value=s?s.start:"17:00";document.getElementById("shiftEnd").value=s?s.end:"23:00";document.getElementById("shiftLocation").value=s?s.location:locations[0];document.getElementById("shiftEmployee").value=s&&s.employeeId?s.employeeId:"";document.getElementById("shiftLabel").value=s?s.label:"";document.getElementById("shiftNote").value=s?s.note:"";d.showModal()}
function saveShiftDialog(ev){ev.preventDefault();let id=document.getElementById("shiftId").value,date=document.getElementById("shiftDate").value,start=document.getElementById("shiftStart").value,end=document.getElementById("shiftEnd").value;if(!date||!start||!end||toMinutes(end)<=toMinutes(start)){alert("Controleer de datum en tijden.");return}let employeeId=document.getElementById("shiftEmployee").value,obj={id:id||("s"+Date.now()),date:date,role:document.getElementById("shiftRole").value,location:document.getElementById("shiftLocation").value,start:start,end:end,employeeId:employeeId,label:document.getElementById("shiftLabel").value,note:document.getElementById("shiftNote").value.trim(),published:false};if(employeeId){let e=state.employees.find(function(x){return x.id===employeeId});if(e&&!employeeEligible(e,obj)&&!confirm("Deze medewerker heeft een mogelijke mismatch (functie, locatie, beschikbaarheid of overlap). Toch opslaan?"))return}if(id){let i=state.shifts.findIndex(function(x){return x.id===id});state.shifts[i]=Object.assign({},state.shifts[i],obj)}else state.shifts.push(obj);document.getElementById("shiftDialog").close();save();planning(document.getElementById("app"))}
function assignShift(id,employeeId){let s=state.shifts.find(function(x){return x.id===id});if(!s)return;if(employeeId){let e=state.employees.find(function(x){return x.id===employeeId});if(!employeeEligible(e,s)){alert("Deze medewerker is niet passend voor deze dienst.");planning(document.getElementById("app"));return}}s.employeeId=employeeId;s.published=false;save();planning(document.getElementById("app"))}
function deletePlannerShift(id){if(!confirm("Deze dienst verwijderen?"))return;state.shifts=state.shifts.filter(function(x){return x.id!==id});save();planning(document.getElementById("app"))}
function dragEmployee(ev,id){ev.dataTransfer.setData("text/plain","employee:"+id);ev.dataTransfer.effectAllowed="copy"}
function dragShift(ev,id){ev.dataTransfer.setData("text/plain","shift:"+id);ev.dataTransfer.effectAllowed="move"}
function dropOnShift(ev,shiftId){ev.preventDefault();ev.stopPropagation();let data=ev.dataTransfer.getData("text/plain");if(data.indexOf("employee:")===0)assignShift(shiftId,data.slice(9))}
function allowDayDrop(ev){ev.preventDefault();ev.currentTarget.classList.add("drag-over")}
function dropOnDay(ev,date){ev.preventDefault();ev.currentTarget.classList.remove("drag-over");let data=ev.dataTransfer.getData("text/plain");if(data.indexOf("shift:")===0){let s=state.shifts.find(function(x){return x.id===data.slice(6)});if(s){s.date=date;s.published=false;save();planning(document.getElementById("app"))}}else if(data.indexOf("employee:")===0){let e=state.employees.find(function(x){return x.id===data.slice(9)});if(e){state.shifts.push({id:"s"+Date.now(),employeeId:e.id,date:date,role:e.role,location:e.location,start:"17:00",end:"23:00",label:"",note:"",published:false});save();planning(document.getElementById("app"))}}}
function copyCurrentWeek(){let current=weekShifts();if(!current.length){alert("Er zijn geen diensten om te kopiëren.");return}if(!confirm("Kopieer deze hele week naar de volgende week? Bestaande diensten daar worden vervangen."))return;let targetStart=addDays(plannerWeekStart,7),targetEnd=addDays(targetStart,6);state.shifts=state.shifts.filter(function(s){return !(s.date>=targetStart&&s.date<=targetEnd)});current.forEach(function(s,i){state.shifts.push(Object.assign({},s,{id:"s"+Date.now()+"-"+i,date:addDays(s.date,7),published:false}))});plannerWeekStart=targetStart;save();planning(document.getElementById("app"))}
function publishWeek(){let current=weekShifts(),open=current.filter(function(s){return !s.employeeId}).length,issues=weekIssues().length;if(!current.length){alert("Er zijn geen diensten om te publiceren.");return}if((open||issues)&&!confirm("Er zijn "+open+" open diensten en "+issues+" waarschuwingen. Toch publiceren?"))return;current.forEach(function(s){s.published=true});save();planning(document.getElementById("app"));alert("Week gepubliceerd in deze demo.")}
function templateShift(date,role,start,end,location){return {id:"s"+Date.now()+Math.random(),employeeId:"",date:date,role:role,location:location,start:start,end:end,label:"",note:"",published:false}}
function applyTemplate(){
 let id=document.getElementById("templateSelect").value,t=state.templates.find(function(x){return x.id===id});if(!t)return;if(!confirm("Template '"+t.name+"' toepassen? De huidige week wordt opnieuw opgebouwd met open diensten."))return;
 let dates=weekDates();state.shifts=state.shifts.filter(function(s){return !dates.includes(s.date)});
 dates.forEach(function(d,idx){let weekend=idx>=4,baseCount=weekend?Math.round(14*t.factor):Math.round(9*t.factor);for(let j=0;j<baseCount;j++){let role=roles[(j+(weekend?1:0))%roles.length],start=(role==="Keuken"||role==="Keukenhulp")?(14+(j%3)):16+(j%3),end=Math.min(23,start+6);state.shifts.push(templateShift(d,role,minToTime(start*60),minToTime(end*60),locations[j%locations.length]))}});
 save();planning(document.getElementById("app"))
}
function magicFill(){
 let opens=weekShifts().filter(function(s){return !s.employeeId}).sort(function(a,b){return (a.date+a.start).localeCompare(b.date+b.start)}),filled=0;
 opens.forEach(function(s){let candidates=state.employees.filter(function(e){return employeeEligible(e,s)}).sort(function(a,b){let ar=Math.abs(a.hours-employeeWeekHours(a.id)),br=Math.abs(b.hours-employeeWeekHours(b.id));if(ar!==br)return br-ar;return employeeWeekHours(a.id)-employeeWeekHours(b.id)||a.wage-b.wage});if(candidates.length){s.employeeId=candidates[0].id;s.published=false;filled++}});
 save();planning(document.getElementById("app"));alert(filled+" open diensten automatisch ingevuld. Niet-passende diensten zijn open gebleven.")
}
function forecast(a){a.innerHTML='<div class="title"><div><h1>Forecast</h1><div class="muted">Omzet, bandbreedte en confidence zijn direct aanpasbaar.</div></div></div><div class="card table"><table><thead><tr><th>Dag</th><th>Forecast</th><th>Laag</th><th>Hoog</th><th>Confidence</th></tr></thead><tbody>'+state.forecast.map((f,i)=>'<tr><td>'+f.date+'</td><td>€ <input type="number" value="'+f.amount+'" onchange="editFc('+i+',\'amount\',+this.value)"></td><td>€ <input type="number" value="'+f.low+'" onchange="editFc('+i+',\'low\',+this.value)"></td><td>€ <input type="number" value="'+f.high+'" onchange="editFc('+i+',\'high\',+this.value)"></td><td><input type="number" min="0" max="100" value="'+f.confidence+'" style="width:70px" onchange="editFc('+i+',\'confidence\',+this.value)">%</td></tr>').join("")+'</tbody></table></div>'}function editFc(i,k,v){state.forecast[i][k]=v;save()}
function hours(a){a.innerHTML='<div class="title"><div><h1>Uren</h1><div class="muted">Klok medewerkers in en uit.</div></div></div><div class="card pad"><h2>Klokterminal</h2><select id="clockEmp">'+state.employees.filter(e=>e.status==="active").map(e=>'<option value="'+e.id+'">'+e.name+'</option>').join("")+'</select> <button class="btn primary" onclick="clockIn()">Inklokken</button> <button class="btn" onclick="clockOut()">Uitklokken</button></div><div class="card table" style="margin-top:14px"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th></tr></thead><tbody>'+state.clocked.slice().reverse().map(c=>'<tr><td>'+emp(c.employeeId).name+'</td><td>'+c.start+'</td><td>'+(c.end||"Actief")+'</td></tr>').join("")+'</tbody></table></div>'}
function clockIn(){let id=document.getElementById("clockEmp").value;state.clocked.push({employeeId:id,start:new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})});save();hours(document.getElementById("app"))}function clockOut(){for(let i=state.clocked.length-1;i>=0;i--){if(!state.clocked[i].end){state.clocked[i].end=new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});break}}save();hours(document.getElementById("app"))}
function leaveView(a){a.innerHTML='<div class="title"><div><h1>Verlof</h1><div class="muted">Periode, type en status zijn bewerkbaar.</div></div></div><div class="card table"><table><thead><tr><th>Medewerker</th><th>Start</th><th>Einde</th><th>Type</th><th>Status</th></tr></thead><tbody>'+state.leave.map((l,i)=>'<tr><td>'+emp(l.employeeId).name+'</td><td><input type="date" value="'+l.start+'" onchange="editLv('+i+',\'start\',this.value)"></td><td><input type="date" value="'+l.end+'" onchange="editLv('+i+',\'end\',this.value)"></td><td><select onchange="editLv('+i+',\'type\',this.value)">'+opts(["Vakantie","Bijzonder verlof","Onbetaald verlof"],l.type)+'</select></td><td><select onchange="editLv('+i+',\'status\',this.value)">'+opts(["In behandeling","Goedgekeurd","Afgewezen"],l.status)+'</select></td></tr>').join("")+'</tbody></table></div>'}function editLv(i,k,v){state.leave[i][k]=v;save()}
function reports(a){let avg=state.employees.reduce((n,e)=>n+e.wage,0)/(state.employees.length||1);a.innerHTML='<div class="title"><div><h1>Rapportages</h1><div class="muted">Live berekend uit je aanpassingen.</div></div></div><div class="grid metrics"><div class="card pad"><div class="label">Gem. uurloon</div><div class="value">€ '+avg.toFixed(2)+'</div></div><div class="card pad"><div class="label">Contracturen totaal</div><div class="value">'+state.employees.reduce((n,e)=>n+e.hours,0)+' u</div></div><div class="card pad"><div class="label">Diensten 7 dagen</div><div class="value">'+state.shifts.length+'</div></div><div class="card pad"><div class="label">Verlof open</div><div class="value">'+state.leave.filter(l=>l.status==="In behandeling").length+'</div></div></div><div class="card pad" style="margin-top:14px"><h2>Personeel per functie</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><strong>'+state.employees.filter(e=>e.role===r).length+'</strong></div>').join("")+'</div>'}
function settings(a){a.innerHTML='<div class="title"><div><h1>Instellingen</h1><div class="muted">Demo-organisatie en structuur.</div></div></div><div class="grid two"><div class="card pad"><h2>Functies</h2>'+roles.map(r=>'<div class="row"><span>'+r+'</span><span class="badge">'+state.employees.filter(e=>e.role===r).length+'</span></div>').join("")+'</div><div class="card pad"><h2>Locaties</h2>'+locations.map(l=>'<div class="row"><span>'+l+'</span><span class="badge">'+state.employees.filter(e=>e.location===l).length+'</span></div>').join("")+'</div></div><div class="notice" style="margin-top:14px">Dit is de open kijk- en werkversie. Wijzigingen blijven in deze browser staan en kunnen bovenaan als JSON worden geëxporteerd.</div>'}
render();
</script></body></html>
