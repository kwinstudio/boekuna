name: Boekuna user-supplied document edge regressions

on:
  pull_request:
    paths:
      - "kwinest/docprocessor/**"
      - "tests/document-user-supplied-edge-regressions.test.py"
      - ".github/workflows/boekuna-user-document-edge-regressions.yml"
  workflow_dispatch:

env:
  ORT_DISABLE_TELEMETRY: "1"

permissions:
  contents: read

jobs:
  user-document-edge-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: kwinest/docprocessor/requirements.txt
      - name: Install processor dependencies
        run: pip install --disable-pip-version-check -r kwinest/docprocessor/requirements.txt
      - name: Run anonymized user-supplied edge regressions
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path("tests/document-user-supplied-edge-regressions.test.py")
          ns["test_advance_payment_preserves_invoice_total_and_open_status"]()
          ns["test_foreign_twenty_percent_vat_is_not_silently_rewritten_to_dutch_rate"]()
          print("user-supplied document edge regressions: PASS")
          PY
