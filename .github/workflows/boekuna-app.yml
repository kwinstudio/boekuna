name: Boekuna app tests

on:
  pull_request:
    paths:
      - "kwinest/index.html"
      - "public/manifest.webmanifest"
      - "public/assets/financial-correction.js"
      - "public/assets/brand-v2.css"
      - "public/assets/boekuna-app-icon*"
      - "public/assets/boekuna-favicon.svg"
      - "public/assets/boekuna-symbol*.svg"
      - "public/assets/favicon-32.png"
      - "scripts/build-app.mjs"
      - "tests/browser-smoke.test.mjs"
      - "tests/mobile-app-layout.test.mjs"
      - "tests/document-upload-browser.test.mjs"
      - "tests/document-background-processing.test.mjs"
      - "tests/auth-progressive-onboarding.test.mjs"
      - "tests/list-controls.test.mjs"
      - "tests/invoice-status-edit.test.mjs"
      - "tests/document-verification.test.mjs"
      - "tests/cloud-sync-serialization.test.mjs"
      - "tests/tenant-isolation.test.mjs"
      - "tests/production-integrity.test.mjs"
      - "tests/invoice-delivery.test.mjs"
      - "tests/smart-financial-correction.test.mjs"
      - "tests/split-build-boundaries.test.mjs"
      - "tests/split-surfaces-browser.test.mjs"
      - "tests/split-ci-scopes.test.mjs"
      - ".github/workflows/boekuna-app.yml"

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CI scope contract
        run: node tests/split-ci-scopes.test.mjs
      - name: Split build boundaries
        run: node tests/split-build-boundaries.test.mjs
      - name: Smart financial correction
        run: node tests/smart-financial-correction.test.mjs
      - name: Install app test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Install Playwright
        run: npm install --prefix tests --no-save playwright@1.56.1
      - name: Install Chromium and WebKit
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Browser pre-launch smoke
        run: node tests/browser-smoke.test.mjs
      - name: Mobile navigation and dashboard regressions
        id: mobile_chromium
        continue-on-error: true
        run: node tests/mobile-app-layout.test.mjs
      - name: WebKit mobile navigation and dashboard regressions
        id: mobile_webkit
        continue-on-error: true
        run: BOOKUNA_BROWSER=webkit node tests/mobile-app-layout.test.mjs
      - name: Split generated surface browser smoke
        run: node tests/split-surfaces-browser.test.mjs
      - name: WebKit app smoke
        run: BOOKUNA_BROWSER=webkit node tests/browser-smoke.test.mjs
      - name: Document browser regressions
        run: node tests/document-upload-browser.test.mjs
      - name: Document background processing regressions
        run: node tests/document-background-processing.test.mjs
      - name: WebKit document review regressions
        run: BOOKUNA_BROWSER=webkit node tests/document-upload-browser.test.mjs
      - name: Auth and progressive onboarding
        run: node tests/auth-progressive-onboarding.test.mjs
      - name: Contextual list controls
        run: node tests/list-controls.test.mjs
      - name: Invoice status edit regression
        run: node tests/invoice-status-edit.test.mjs
      - name: Two-pass document verification
        run: node tests/document-verification.test.mjs
      - name: Cloud sync serialization
        run: node tests/cloud-sync-serialization.test.mjs
      - name: Tenant isolation source regression
        run: node tests/tenant-isolation.test.mjs
      - name: Production calculation regression tests
        run: node tests/production-integrity.test.mjs
      - name: Invoice PDF and email parity
        run: node tests/invoice-delivery.test.mjs
      - name: Mobile QA release gate
        if: always()
        run: |
          if [ "${{ steps.mobile_chromium.outcome }}" != "success" ] || [ "${{ steps.mobile_webkit.outcome }}" != "success" ]; then
            echo "Mobile QA failed: chromium=${{ steps.mobile_chromium.outcome }} webkit=${{ steps.mobile_webkit.outcome }}"
            exit 1
          fi
      - name: Upload app visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-app-visual
          path: |
            tests/artifacts/smart-financial-correction-*.png
            tests/artifacts/document-processing-*.png
            tests/artifacts/mobile-dashboard-*.png
          if-no-files-found: ignore
