      - "tests/lib/fake-feedback-backend.mjs"
      - "public/assets/brand-v2.css"
      - "kwinest/app-assets/product-color-polish.css"
      - "kwinest/app-assets/product-ux-polish-round-3.css"
      - "public/assets/boekuna-app-icon*"
      - "public/assets/boekuna-favicon.svg"
      - "public/assets/boekuna-symbol*.svg"
      - "public/assets/favicon-32.png"
      - "scripts/build-app.mjs"
      - "scripts/release-profile.mjs"
      - "tests/first-release-scope.test.mjs"
      - "tests/first-release-browser.test.mjs"
      - "docs/FIRST_RELEASE_FEATURES.md"
      - "tests/browser-smoke.test.mjs"
      - "tests/developer-mode.test.mjs"
      - "tests/developer-mode-browser.test.mjs"
      - "tests/tester-invite-code-browser.test.mjs"
      - "tests/app-ux-plain-language.test.mjs"
      - "tests/app-ux-keyboard.test.mjs"
      - "tests/app-ux-status.test.mjs"
      - "tests/mobile-app-layout.test.mjs"
      - "tests/mobile-polish-round-2.test.mjs"
      - "tests/premium-app-simplification.test.mjs"
      - "tests/app-wide-premium-simplification-v2.test.mjs"
      - "tests/product-ui-reference.test.mjs"
      - "tests/complete-mobile-product.test.mjs"
      - "tests/mobile-desktop-freeze.test.mjs"
      - "tests/mobile-flow-simplification.test.mjs"
      - "tests/document-upload-browser.test.mjs"
      - "tests/document-review-beginner-ux.test.mjs"
      - "tests/scan-native-picker.test.mjs"
      - "tests/document-background-processing.test.mjs"
      - "tests/auth-progressive-onboarding.test.mjs"
      - "tests/auth-signed-in-once.test.mjs"
      - "tests/invoice-rounding-history.test.mjs"
      - "tests/list-controls.test.mjs"
      - "tests/invoice-status-edit.test.mjs"
      - "tests/document-verification.test.mjs"
      - "tests/cloud-sync-serialization.test.mjs"
      - "tests/tenant-isolation.test.mjs"
      - "tests/production-integrity.test.mjs"
      - "tests/personal-insights.test.mjs"
      - "tests/personal-insights-browser.test.mjs"
      - "tests/personal-insights-performance.test.mjs"
      - "tests/personal-assistant-v1-2*.test.mjs"
      - "tests/assistant-feature-disabled.test.mjs"
      - "tests/invoice-delivery.test.mjs"
      - "tests/invoice-persistence.test.mjs"
      - "tests/invoice-native-retry.test.mjs"
      - "tests/invoice-send-simple-browser.test.mjs"
      - "tests/invoice-send-checks.test.mjs"
      - "tests/bank-csv-formats.test.mjs"
      - "tests/bank-import-reliability.test.mjs"
      - "tests/bank-import-browser.test.mjs"
      - "tests/fixtures/bank/**"
      - "public/assets/mobile-product.js"
      - "tests/credit-note-discount.test.mjs"
      - "tests/invoice-legal-content.test.mjs"
      - "supabase/functions/send-invoice/index.ts"
      - "tests/vat-return-boxes.test.mjs"
      - "tests/cashflow-recurrence.test.mjs"
      - "tests/cashflow-recurrence-browser.test.mjs"
      - "tests/planned-cash-sql-isolation.test.mjs"
      - "tests/contextual-resolution-browser.test.mjs"
      - "tests/financial-presentation.test.mjs"
      - "supabase/migrations/20261001234000_planned_cash_recurrence.sql"
      - "tests/smart-financial-correction.test.mjs"
      - "tests/split-build-boundaries.test.mjs"
      - "tests/marketing-app-non-regression.test.mjs"
      - "tests/split-surface-non-regression.test.mjs"
      - "tests/split-surfaces-browser.test.mjs"
      - "tests/split-ci-scopes.test.mjs"
      - "tests/kvk-company-lookup-browser.test.mjs"
      - "tests/kvk-company-lookup-security.test.mjs"
      - "tests/lib/kvk-browser-assets.mjs"
      - "tests/package*.json"
      - ".github/workflows/boekuna-app.yml"

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOEKUNA_RELEASE_PROFILE: full
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CI scope contract
        run: node tests/split-ci-scopes.test.mjs
      - name: Untouched surface artifact non-regression
        run: node tests/marketing-app-non-regression.test.mjs
      - name: Both surface boundaries reject real artifact drift
        run: node tests/split-surface-non-regression.test.mjs
      - name: Split build boundaries
        run: node tests/split-build-boundaries.test.mjs
      - name: Developer Mode source and production guards
        run: node tests/developer-mode.test.mjs
      - name: KVK production artifact and secret guards
        run: node tests/kvk-company-lookup-security.test.mjs
      - name: Smart financial correction
        run: node tests/smart-financial-correction.test.mjs
      - name: Personal insights deterministic engine contracts
        run: node tests/personal-insights.test.mjs
      - name: Personal insights performance and I/O boundary
        run: node tests/personal-insights-performance.test.mjs
      - name: Personal Assistant V1.2 deterministic contracts
        run: node tests/personal-assistant-v1-2.test.mjs
      - name: Temporary assistant-disabled build contract
        run: node tests/assistant-feature-disabled.test.mjs
      - name: First release scope and fail-closed contract
        run: node tests/first-release-scope.test.mjs
      - name: Install app test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Invoice persistence and finalization invariants
        run: node tests/invoice-persistence.test.mjs
      - name: Invoice send checks list missing company details
        run: node tests/invoice-send-checks.test.mjs
      - name: Dutch bank CSV formats (ING, Rabobank, ABN AMRO, Knab)
        run: node tests/bank-csv-formats.test.mjs
      - name: Bank import reliability (variants, preview, duplicates, matching)
        run: node tests/bank-import-reliability.test.mjs
      - name: Credit notes follow the original discount
        run: node tests/credit-note-discount.test.mjs
      - name: Uitloggen removes the local copy only after a confirmed cloud save
        run: node tests/logout-local-data.test.mjs
      - name: VAT return boxes and receipt-amount expenses
        run: node tests/vat-return-boxes.test.mjs
      - name: Mandatory invoice content on print/PDF and shared PDF
        run: node tests/invoice-legal-content.test.mjs
      - name: Recurrence date and forecast invariants
        run: node tests/cashflow-recurrence.test.mjs
      - name: Real local PostgreSQL migration and two-account isolation
        run: node tests/planned-cash-sql-isolation.test.mjs
      - name: Feedback RLS, privacy and tenant isolation
        run: node tests/feedback-sql-isolation.test.mjs
      - name: Install Playwright
        run: npm install --prefix tests --no-save playwright@1.56.1
      - name: Install Chromium and WebKit
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: iOS companion purchase guards on the actual native user-agent
        run: |
          node tests/ios-companion-contract.test.mjs
          node tests/ios-archive-guards.test.mjs
          node tests/ios-companion-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/ios-companion-browser.test.mjs
      - name: iOS local-first adapter (offline drafts, resend, scanner, offline administration) — Chromium + WebKit
        run: |
          node tests/ios-local-first-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/ios-local-first-browser.test.mjs
          node tests/ios-local-first-offline-ledger.test.mjs
          BOOKUNA_BROWSER=webkit node tests/ios-local-first-offline-ledger.test.mjs

      - name: Tester invite-code billing UI — Chromium + WebKit
        run: |
          node tests/tester-invite-code-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/tester-invite-code-browser.test.mjs
      - name: Pricing V2 plan chooser and subscription screen — Chromium + WebKit
        run: |
          node tests/pricing-v2-app-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/pricing-v2-app-browser.test.mjs
      - name: Beginner document review — Chromium + WebKit
        run: |
          node tests/document-review-beginner-ux.test.mjs
          BOOKUNA_BROWSER=webkit node tests/document-review-beginner-ux.test.mjs
      - name: Personal assistant production-build QA — Chromium + WebKit
        run: |
          node tests/personal-insights-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/personal-insights-browser.test.mjs
      - name: Personal Assistant V1.2 browser QA — Chromium + WebKit
        run: |
          node tests/personal-assistant-v1-2-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/personal-assistant-v1-2-browser.test.mjs
      - name: Account verwijderen (abonnement, export, fouten) — Chromium and WebKit
        run: |
          node tests/account-deletion-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/account-deletion-browser.test.mjs
      - name: Instellingen index, panels and preferences — Chromium and WebKit
        run: |
          node tests/settings-center-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/settings-center-browser.test.mjs
      - name: Exports, A4 invoice preview, periods and alerts — Chromium and WebKit
        run: |
          node tests/exports-filters-alerts-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/exports-filters-alerts-browser.test.mjs
      - name: Privacy, voorwaarden and public routes from the app host — Chromium and WebKit
        run: |
          node tests/app-legal-routes-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/app-legal-routes-browser.test.mjs
      - name: Beweging (pagina's, bedragen, vinkje, Betaald, menu van onder) — Chromium and WebKit
        run: |
          node tests/motion-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/motion-browser.test.mjs
      - name: Intro bij opstarten (max 2,5 s, traag laden, reduced motion) — Chromium and WebKit
        run: |
          node tests/boot-intro-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/boot-intro-browser.test.mjs
      - name: Thema (Automatisch, Licht, Donker) — Chromium and WebKit
        run: |
          node tests/theme-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/theme-browser.test.mjs
      - name: Spacing and layout (375–1440px, Light and Dark) — Chromium and WebKit
        run: |
          node tests/spacing-layout-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/spacing-layout-browser.test.mjs
      - name: Hulp & feedback — Chromium and WebKit
        run: |
          node tests/feedback-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/feedback-browser.test.mjs
          node tests/feedback-ocr-corrections.test.mjs
          BOOKUNA_BROWSER=webkit node tests/feedback-ocr-corrections.test.mjs
      - name: Mobile polish round 2 — Chromium and WebKit
        run: |
          node tests/mobile-polish-round-2.test.mjs
          BOOKUNA_BROWSER=webkit node tests/mobile-polish-round-2.test.mjs
      - name: Invoice native handoff retries — Chromium and WebKit
        run: |
          node tests/invoice-native-retry.test.mjs
          BOOKUNA_BROWSER=webkit node tests/invoice-native-retry.test.mjs
      - name: Invoice e-mail in one screen (phone share, desktop mail) — Chromium and WebKit
        run: |
          node tests/invoice-send-simple-browser.test.mjs
          SKIP_APP_BUILD=1 BOOKUNA_BROWSER=webkit node tests/invoice-send-simple-browser.test.mjs
      - name: Cashflow persistence — Chromium and WebKit
        run: |
          node tests/cashflow-recurrence-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/cashflow-recurrence-browser.test.mjs
      - name: Contextual resolution and safe previews — Chromium and WebKit
        run: |
          node tests/contextual-resolution-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/contextual-resolution-browser.test.mjs
      - name: Financial presentation at every required width — Chromium and WebKit
        run: |
          node tests/financial-presentation.test.mjs
          BOOKUNA_BROWSER=webkit node tests/financial-presentation.test.mjs
      - name: Bank import preview and matching — Chromium and WebKit
        run: |
          node tests/bank-import-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/bank-import-browser.test.mjs
      - name: Browser pre-launch smoke
        run: node tests/browser-smoke.test.mjs
      - name: KVK generated production flow — Chromium
        run: node tests/kvk-company-lookup-browser.test.mjs
      - name: KVK generated production flow — WebKit
        run: BOOKUNA_BROWSER=webkit node tests/kvk-company-lookup-browser.test.mjs
      - name: KVK generated isolated preview flow — Chromium
        run: KVK_BROWSER_PREVIEW=true node tests/kvk-company-lookup-browser.test.mjs
      - name: KVK generated isolated preview flow — WebKit
        run: KVK_BROWSER_PREVIEW=true BOOKUNA_BROWSER=webkit node tests/kvk-company-lookup-browser.test.mjs
      - name: Developer Mode browser smoke
        run: node tests/developer-mode-browser.test.mjs
      - name: Developer Mode browser smoke — WebKit
        run: BOOKUNA_BROWSER=webkit node tests/developer-mode-browser.test.mjs
      - name: Mobile navigation and dashboard regressions
        id: mobile_chromium
        continue-on-error: true
        run: node tests/mobile-app-layout.test.mjs
      - name: WebKit mobile navigation and dashboard regressions
        id: mobile_webkit
        continue-on-error: true
        run: BOOKUNA_BROWSER=webkit node tests/mobile-app-layout.test.mjs
      - name: Premium app simplification — Chromium
        id: premium_chromium
        continue-on-error: true
        run: node tests/premium-app-simplification.test.mjs
      - name: Premium app simplification — WebKit
        id: premium_webkit
        continue-on-error: true
        run: BOOKUNA_BROWSER=webkit node tests/premium-app-simplification.test.mjs
      - name: App-wide premium simplification v2 — Chromium
        id: premium_v2_chromium
        continue-on-error: true
        run: node tests/app-wide-premium-simplification-v2.test.mjs
      - name: App-wide premium simplification v2 — WebKit
        id: premium_v2_webkit
        continue-on-error: true
        run: BOOKUNA_BROWSER=webkit node tests/app-wide-premium-simplification-v2.test.mjs
      - name: Master product UI reference — Chromium + WebKit + Axe
        run: node tests/product-ui-reference.test.mjs
      - name: Complete mobile product and desktop freeze — Chromium + WebKit
        run: |
          node tests/complete-mobile-product.test.mjs
          BOOKUNA_BROWSER=webkit node tests/complete-mobile-product.test.mjs
          node tests/mobile-desktop-freeze.test.mjs
          BOOKUNA_BROWSER=webkit node tests/mobile-desktop-freeze.test.mjs
      - name: Mobile flow simplification — Chromium + WebKit
        run: |
          node tests/mobile-flow-simplification.test.mjs
          BOOKUNA_BROWSER=webkit node tests/mobile-flow-simplification.test.mjs
      - name: Split generated surface browser smoke
        run: node tests/split-surfaces-browser.test.mjs
      - name: WebKit app smoke
        run: BOOKUNA_BROWSER=webkit node tests/browser-smoke.test.mjs
      - name: Single native Scan picker regression
        run: node tests/scan-native-picker.test.mjs
      - name: Document browser regressions
        run: node tests/document-upload-browser.test.mjs
      - name: Document background processing regressions
        run: node tests/document-background-processing.test.mjs
      - name: WebKit document review regressions
        run: BOOKUNA_BROWSER=webkit node tests/document-upload-browser.test.mjs
      - name: Storage status and conflict-safe retry
        run: node tests/app-ux-status.test.mjs
      - name: Generated app UX and plain Dutch · Chromium
        run: node tests/app-ux-plain-language.test.mjs
      - name: Generated app UX and plain Dutch · WebKit
        run: BOOKUNA_BROWSER=webkit node tests/app-ux-plain-language.test.mjs
      - name: Generated app keyboard workflow · Chromium
        run: node tests/app-ux-keyboard.test.mjs
      - name: Generated app keyboard workflow · WebKit
        run: BOOKUNA_BROWSER=webkit node tests/app-ux-keyboard.test.mjs
      - name: Auth and progressive onboarding
        run: node tests/auth-progressive-onboarding.test.mjs
      - name: Signed-in user loads once (no data loss on tab focus)
        run: node tests/auth-signed-in-once.test.mjs
      - name: Old final invoices keep their amounts after the rounding fix
        run: node tests/invoice-rounding-history.test.mjs
      - name: Contextual list controls
        run: node tests/list-controls.test.mjs
      - name: Invoice status edit regression
        run: node tests/invoice-status-edit.test.mjs
      - name: Two-pass document verification
        run: node tests/document-verification.test.mjs
      - name: Cloud sync serialization
        run: node tests/cloud-sync-serialization.test.mjs
      - name: Tenant isolation source regression
        run: node tests/tenant-isolation.test.mjs
      - name: Production calculation regression tests
        run: node tests/production-integrity.test.mjs
      - name: Invoice PDF and email parity
        run: node tests/invoice-delivery.test.mjs
      - name: First release browser QA — Chromium + WebKit
        run: |
          node tests/first-release-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/first-release-browser.test.mjs
      - name: Mobile QA release gate
        if: always()
        run: |
          if [ "${{ steps.mobile_chromium.outcome }}" != "success" ] || [ "${{ steps.mobile_webkit.outcome }}" != "success" ]; then
            echo "Mobile QA failed: chromium=${{ steps.mobile_chromium.outcome }} webkit=${{ steps.mobile_webkit.outcome }}"
            exit 1
          fi
      - name: Premium simplification QA gate
        if: always()
        run: |
          if [ "${{ steps.premium_chromium.outcome }}" != "success" ] || [ "${{ steps.premium_webkit.outcome }}" != "success" ]; then
            echo "Premium simplification QA failed: chromium=${{ steps.premium_chromium.outcome }} webkit=${{ steps.premium_webkit.outcome }}"
            exit 1
          fi
      - name: App-wide premium simplification v2 QA gate
        if: always()
        run: |
          if [ "${{ steps.premium_v2_chromium.outcome }}" != "success" ] || [ "${{ steps.premium_v2_webkit.outcome }}" != "success" ]; then
            echo "Premium v2 QA failed: chromium=${{ steps.premium_v2_chromium.outcome }} webkit=${{ steps.premium_v2_webkit.outcome }}"
            exit 1
          fi
      - name: Upload app visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-app-visual
          path: |
            tests/artifacts/smart-financial-correction-*.png
            tests/artifacts/document-processing-*.png
            tests/artifacts/document-review-*.png
            tests/artifacts/mobile-dashboard-*.png
            tests/artifacts/premium-*.png
            tests/artifacts/premium-v2-*.png
            tests/artifacts/product-ui-reference/
            tests/artifacts/personal-insights/
            tests/artifacts/personal-assistant-v1-2/
            tests/artifacts/kvk-*.png
            tests/artifacts/mobile-flow-simplification/
            tests/artifacts/exports-filters-alerts/
          if-no-files-found: ignore

      - name: Upload app UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-ux-evidence
          path: |
            tests/artifacts/app-ux-*
            docs/ux-evidence/before-core-screens.zip
          if-no-files-found: error

      - name: Upload app polish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-polish-evidence
          path: |
            tests/artifacts/financial-presentation/
            tests/artifacts/contextual-resolution/
            tests/artifacts/invoice-missing-email-390.png
            tests/artifacts/mobile-polish-round-2/
            tests/artifacts/complete-mobile/
          if-no-files-found: error
