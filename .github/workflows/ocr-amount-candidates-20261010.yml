name: BOEKUNA OCR Amount Candidate Diagnostics
on:
  push:
    branches:
      - "test/ocr-logo-realistic-regression-20261010"
    paths:
      - ".github/workflows/ocr-amount-candidates-20261010.yml"
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install original engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kwinest/docprocessor/requirements.txt
      - name: Generate synthetic OCR evidence diagnostics
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python tests/ocr-amount-candidate-diagnostics-20261010.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-ocr-amount-candidate-diagnostics
          path: artifacts/ocr-amount-candidate-diagnostics.json
          if-no-files-found: warn
