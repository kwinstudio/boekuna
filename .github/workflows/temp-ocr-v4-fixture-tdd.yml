name: TEMP OCR V4 fixture TDD

on:
  pull_request:
    paths:
      - "tests/test_document_processor_regression.py"
      - "kwinest/docprocessor/**"
      - ".github/workflows/temp-ocr-v4-fixture-tdd.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kwinest/docprocessor/requirements.txt
      - name: Install processor dependencies
        run: pip install -r kwinest/docprocessor/requirements.txt
      - name: Real supplied-pattern regressions
        run: python -m unittest tests/test_document_processor_regression.py
