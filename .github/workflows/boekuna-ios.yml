name: Boekuna iOS packaging

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/boekuna-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate plist files
        run: |
          plutil -lint ios/Boekuna/Info.plist
          plutil -lint ios/ExportOptions-TestFlight.plist
          plutil -lint ios/ExportOptions-IPA.plist

      - name: Verify bundle and version settings
        run: |
          SETTINGS="$(xcodebuild -project ios/Boekuna.xcodeproj -scheme Boekuna -configuration Release -showBuildSettings CODE_SIGNING_ALLOWED=NO)"
          printf '%s\n' "$SETTINGS" | grep -F "PRODUCT_BUNDLE_IDENTIFIER = nl.boekuna.app"
          printf '%s\n' "$SETTINGS" | grep -F "MARKETING_VERSION = 1.0.0"
          printf '%s\n' "$SETTINGS" | grep -F "CURRENT_PROJECT_VERSION = 1"

      - name: Build Debug for iOS Simulator without signing
        run: |
          xcodebuild \
            -project ios/Boekuna.xcodeproj \
            -scheme Boekuna \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release for iOS Simulator without signing
        run: |
          xcodebuild \
            -project ios/Boekuna.xcodeproj \
            -scheme Boekuna \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
