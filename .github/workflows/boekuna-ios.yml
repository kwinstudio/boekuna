name: Boekuna iOS packaging

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/boekuna-ios.yml"
      - "public/assets/boekuna-app-icon-1024.png"
      - "kwinest/index.html"
      - "tests/ios-*.test.mjs"
      - "scripts/build-app.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify packaging and native policy, build both simulator configs and device SDK
        run: ./ios/scripts/preflight.sh

      - name: Verify bundle and version settings
        run: |
          SETTINGS="$(xcodebuild -project ios/Boekuna.xcodeproj -scheme Boekuna -configuration Release -showBuildSettings CODE_SIGNING_ALLOWED=NO)"
          printf '%s\n' "$SETTINGS" | grep -F "PRODUCT_BUNDLE_IDENTIFIER = nl.boekuna.app"
          printf '%s\n' "$SETTINGS" | grep -F "MARKETING_VERSION = 1.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify companion user-agent and guarded billing endpoints
        run: |
          node tests/ios-companion-contract.test.mjs
          node tests/ios-archive-guards.test.mjs
