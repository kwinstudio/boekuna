name: Boekuna document edge regressions

on:
  pull_request:
    paths:
      - "kwinest/docprocessor/**"
      - "tests/document-advance-payment-regression.test.py"
      - ".github/workflows/boekuna-document-edge-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-document-edge-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: kwinest/docprocessor/requirements.txt
      - name: Install processor dependencies
        run: pip install --disable-pip-version-check -r kwinest/docprocessor/requirements.txt
      - name: Advance payment and outstanding balance regression
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path("tests/document-advance-payment-regression.test.py")
          ns["test_advance_payment_does_not_replace_invoice_total_or_mark_invoice_paid"]()
          print("advance payment regression: PASS")
          PY
