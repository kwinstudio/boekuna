name: BOEKUNA Logo Receipt OCR Investigation
on:
  push:
    branches:
      - "test/ocr-logo-realistic-regression-20261010"
    paths:
      - "tests/ocr-logo-realistic-regression-20261010.py"
      - ".github/workflows/ocr-logo-realistic-regression-20261010.yml"
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify DejaVu fonts
        run: test -e /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
      - name: Install original OCR deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kwinest/docprocessor/requirements.txt
      - name: Run 10 receipt x 2 formats on deployed OCR code
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: python tests/ocr-logo-realistic-regression-20261010.py
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-ocr-logo-realistic-report
          path: artifacts/ocr-logo-regression.json
          if-no-files-found: warn
