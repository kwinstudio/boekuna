name: Boekuna marketing tests

on:
  pull_request:
    paths:
      - "public/index.html"
      - "public/404.html"
      - "public/*/index.html"
      - "public/robots.txt"
      - "public/sitemap.xml"
      - "public/assets/baseline.css"
      - "public/assets/favicon.svg"
      - "public/assets/site/**"
      - "scripts/build-marketing.mjs"
      - "vercel.json"
      - "tests/marketing-pages.test.mjs"
      - "tests/pricing-v2-website.test.mjs"
      - "supabase/functions/_shared/pricing.mjs"
      - "docs/marketing/pricing-v2-copy.json"
      - "tests/marketing-onepage-browser.test.mjs"
      - "tests/marketing-premium-browser.test.mjs"
      - "tests/marketing-performance.test.mjs"
      - "tests/marketing-navigation.test.mjs"
      - "tests/marketing-product-proof.test.mjs"
      - "tests/marketing-editorial-responsive.test.mjs"
      - "tests/marketing-app-non-regression.test.mjs"
      - "tests/helpers/marketing-site.mjs"
      - "tests/split-build-boundaries.test.mjs"
      - "tests/split-characterization.test.mjs"
      - "tests/split-surfaces-browser.test.mjs"
      - "tests/source-safety.test.mjs"
      - "tests/split-ci-scopes.test.mjs"
      - ".github/workflows/boekuna-marketing.yml"

permissions:
  contents: read

jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CI scope contract
        run: node tests/split-ci-scopes.test.mjs
      - name: Install browser test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Install Playwright + Axe
        run: npm install --prefix tests --no-save playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium and WebKit
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Build clean marketing artifact
        run: node scripts/build-marketing.mjs
      - name: Untouched app artifact non-regression
        run: node tests/marketing-app-non-regression.test.mjs
      - name: Clean-slate static / route / legal QA
        run: node tests/marketing-pages.test.mjs
      - name: Pricing V2 module (Chromium + WebKit)
        run: |
          node tests/pricing-v2-website.test.mjs
          BOOKUNA_BROWSER=webkit node tests/pricing-v2-website.test.mjs
      - name: Clean-slate Chromium + WebKit + Axe acceptance
        run: node tests/marketing-onepage-browser.test.mjs
      - name: Holding visual responsive acceptance
        run: node tests/marketing-premium-browser.test.mjs
      - name: Mobile laboratory performance and no-JavaScript content
        run: node tests/marketing-performance.test.mjs
      - name: Retired-route and required-route navigation safety
        run: node tests/marketing-navigation.test.mjs
      - name: Legacy marketing asset absence
        run: node tests/marketing-product-proof.test.mjs
      - name: Extended responsive clean-baseline evidence
        run: node tests/marketing-editorial-responsive.test.mjs
      - name: Split build boundaries
        run: node tests/split-build-boundaries.test.mjs
      - name: Split characterization
        run: node tests/split-characterization.test.mjs
      - name: Split generated surface browser smoke
        run: node tests/split-surfaces-browser.test.mjs
      - name: Production source safety
        run: node tests/source-safety.test.mjs
      - name: Upload clean baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-clean-baseline-evidence
          path: |
            tests/artifacts/multipage/
            tests/artifacts/premium-marketing/
            tests/artifacts/brand-clean-slate-*.png
          if-no-files-found: warn
