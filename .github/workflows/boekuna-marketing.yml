name: Boekuna marketing tests

on:
  pull_request:
    paths:
      - "public/index.html"
      - "public/404.html"
      - "public/*/index.html"
      - "public/robots.txt"
      - "public/sitemap.xml"
      - "public/assets/marketing.css"
      - "public/assets/marketing.js"
      - "public/assets/homepage.css"
      - "public/assets/homepage.js"
      - "public/assets/marketing-editorial.css"
      - "public/assets/marketing-editorial.js"
      - "public/assets/marketing-editorial/**"
      - "public/assets/product/**"
      - "public/assets/editorial/**"
      - "public/assets/brand-v2.css"
      - "public/assets/boekuna-symbol*.svg"
      - "public/assets/boekuna-favicon.svg"
      - "public/assets/boekuna-app-icon-180.png"
      - "public/assets/favicon-32.png"
      - "scripts/build-marketing.mjs"
      - "tests/marketing-pages.test.mjs"
      - "tests/marketing-product-proof.test.mjs"
      - "tests/marketing-editorial-responsive.test.mjs"
      - "tests/marketing-content-freeze.test.mjs"
      - "tests/marketing-editorial-browser.test.mjs"
      - "tests/fixtures/marketing-content-freeze.json"
      - "tests/fixtures/marketing-content-freeze-v2.json"
      - "tests/marketing-content-freeze-v2.test.mjs"
      - "tests/marketing-v2-browser.test.mjs"
      - "tests/helpers/marketing-site.mjs"
      - "tests/split-build-boundaries.test.mjs"
      - "tests/marketing-app-non-regression.test.mjs"
      - "tests/split-surfaces-browser.test.mjs"
      - "tests/split-ci-scopes.test.mjs"
      - ".github/workflows/boekuna-marketing.yml"

permissions:
  contents: read

jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CI scope contract
        run: node tests/split-ci-scopes.test.mjs
      - name: Split build boundaries
        run: node tests/split-build-boundaries.test.mjs
      - name: Install browser test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Install Playwright
        run: npm install --prefix tests --no-save playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium and WebKit
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Build standalone marketing artifact
        run: node scripts/build-marketing.mjs
      - name: Marketing app artifact non-regression
        run: node tests/marketing-app-non-regression.test.mjs
      - name: Frozen content and SEO parity
        run: node tests/marketing-content-freeze.test.mjs && node tests/marketing-content-freeze-v2.test.mjs
      - name: Marketing page QA
        run: node tests/marketing-pages.test.mjs
      - name: No content images or product screenshots
        run: node tests/marketing-product-proof.test.mjs
      - name: Image-free marketing responsive QA
        run: node tests/marketing-editorial-responsive.test.mjs
      - name: Split generated surface browser smoke
        run: node tests/split-surfaces-browser.test.mjs
      - name: Generated marketing full browser and accessibility gate
        run: node tests/marketing-v2-browser.test.mjs
      - name: Upload brand visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-marketing-image-free
          path: tests/artifacts/image-free-*.png
          if-no-files-found: error
      - name: Upload editorial before-after and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-marketing-editorial-v2
          path: tests/artifacts/marketing-editorial-v2/
          if-no-files-found: error
