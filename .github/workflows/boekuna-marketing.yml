name: Boekuna marketing tests

on:
  pull_request:
    paths:
      - "public/index.html"
      - "public/404.html"
      - "public/*/index.html"
      - "public/robots.txt"
      - "public/sitemap.xml"
      - "public/assets/site.css"
      - "public/assets/site.js"
      - "public/assets/favicon.svg"
      - "public/assets/onepage.css"
      - "public/assets/marketing.js"
      - "public/assets/boekuna-*.svg"
      - "public/assets/boekuna-og-1200x630.png"
      - "scripts/build-marketing.mjs"
      - "vercel.json"
      - "tests/marketing-pages.test.mjs"
      - "tests/marketing-onepage-browser.test.mjs"
      - "tests/marketing-app-non-regression.test.mjs"
      - "tests/helpers/marketing-site.mjs"
      - "tests/split-ci-scopes.test.mjs"
      - ".github/workflows/boekuna-marketing.yml"

permissions:
  contents: read

jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CI scope contract
        run: node tests/split-ci-scopes.test.mjs
      - name: Install browser test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Install Playwright + Axe
        run: npm install --prefix tests --no-save playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium and WebKit
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Build standalone marketing artifact
        run: node scripts/build-marketing.mjs
      - name: Untouched app artifact non-regression
        run: node tests/marketing-app-non-regression.test.mjs
      - name: Multipage static / route / legal QA
        run: node tests/marketing-pages.test.mjs
      - name: Multipage Chromium + WebKit + Axe acceptance
        run: node tests/marketing-onepage-browser.test.mjs
      - name: Upload multipage browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boekuna-multipage-evidence
          path: tests/artifacts/multipage/
          if-no-files-found: warn
