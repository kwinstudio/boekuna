name: Boekuna final logo assets

on:
  push:
    branches:
      - brand/final-boekuna-logo
    paths:
      - "public/assets/boekuna-symbol.svg"
      - "public/assets/boekuna-favicon.svg"
      - "public/assets/boekuna-app-icon.svg"
      - "public/assets/boekuna-app-icon-maskable.svg"
      - "public/assets/boekuna-og-template.svg"
      - "scripts/generate-brand-icons.mjs"
      - ".github/workflows/brand-icons.yml"

permissions:
  contents: write

concurrency:
  group: boekuna-final-logo-assets
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/final-boekuna-logo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image renderer
        run: npm install --prefix tests --no-save sharp@0.33.5
      - name: Generate final logo raster assets
        run: node scripts/generate-brand-icons.mjs
      - name: Commit generated assets
        run: |
          git config user.name "boekuna-brand-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/boekuna-app-icon-*.png public/assets/favicon-*.png public/assets/boekuna-logo-master-1024.png public/assets/boekuna-social-avatar-1024.png public/assets/boekuna-og-1200x630.png public/assets/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "brand: generate final Boekuna logo raster assets [skip ci]"
          git push origin HEAD:brand/final-boekuna-logo
