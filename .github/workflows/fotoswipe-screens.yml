name: Fotoswipe screenshots per iPhone size
# Debug build on simulators of three sizes with synthetic sample photos.
# Screenshots are pushed to the claude/fotoswipe-screens branch for review. No signing, no upload.
on:
  push:
    branches: [claude/fotoswipe-pop]
    paths: ['fotoswipe/**', '.github/workflows/fotoswipe-screens.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fotoswipe-screens
  cancel-in-progress: true
jobs:
  screens:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: fotoswipe
    steps:
      - uses: actions/checkout@v4
      - name: Build for simulator (Debug)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project Fotoswipe.xcodeproj -scheme Fotoswipe -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/build.log | tail -5 || {
            grep -E "error:" build/build.log | sort -u | head -30 | while IFS= read -r l; do echo "::error title=Fotoswipe screens::$l"; done; exit 1; }
      - name: Sample photos
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 scripts/make_sample_photos.py build/media
      - name: Screenshots on three sizes
        run: |
          APP=build/DD/Build/Products/Debug-iphonesimulator/Fotoswipe.app
          BUNDLE=nl.zichtwerfstudio.fotoswipe
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; print(r[-1]["identifier"])')
          mkdir -p "$RUNNER_TEMP/shots"
          create() {
            for TYPE in "$@"; do
              UDID=$(xcrun simctl create "fs-$NAME" "com.apple.CoreSimulator.SimDeviceType.$TYPE" "$RUNTIME" 2>/dev/null) && { echo "$UDID"; return 0; }
            done
            return 1
          }
          for SIZE in "se:iPhone-SE-3rd-generation" "regular:iPhone-17 iPhone-16" "promax:iPhone-17-Pro-Max iPhone-16-Pro-Max"; do
            NAME=${SIZE%%:*}; TYPES=${SIZE#*:}
            UDID=$(create $TYPES) || { echo "::warning title=Fotoswipe screens::Cannot create $NAME ($TYPES)"; continue; }
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl addmedia "$UDID" build/media/*.jpg
            # First launch without access: the welcome screen must show without a system prompt.
            for PAGE in 0 1 2; do
              xcrun simctl launch "$UDID" "$BUNDLE" -FSOnboardingPage $PAGE >/dev/null; sleep 7
              xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$NAME-onboarding$PAGE.png" >/dev/null 2>&1
              xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            done
            if [[ "$NAME" == "se" ]]; then
              xcrun simctl ui "$UDID" content_size accessibility-extra-large || echo "::warning title=Fotoswipe screens::content_size not supported"
              for PAGE in 0 2; do
                xcrun simctl launch "$UDID" "$BUNDLE" -FSOnboardingPage $PAGE >/dev/null; sleep 7
                xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/se-largetext-onboarding$PAGE.png" >/dev/null 2>&1
                xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
              done
              xcrun simctl ui "$UDID" content_size large || true
            fi
            # Grant full photo access in the simulator's privacy database (CI only).
            xcrun simctl shutdown "$UDID"
            TCC="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/TCC/TCC.db"
            if [[ -f "$TCC" ]]; then
              sqlite3 "$TCC" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags, last_modified) VALUES ('kTCCServicePhotos', '$BUNDLE', 0, 2, 2, 1, 0, CAST(strftime('%s','now') AS INTEGER));" \
                || echo "::warning title=Fotoswipe screens::TCC insert failed on $NAME"
            else
              echo "::warning title=Fotoswipe screens::No TCC.db on $NAME"
            fi
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            OUT=$(xcrun simctl privacy "$UDID" grant photos "$BUNDLE" 2>&1) || echo "::warning title=Fotoswipe screens::privacy grant failed on $NAME: $OUT"
            ROWS=$(sqlite3 "$TCC" "SELECT service, client, auth_value FROM access WHERE client='$BUNDLE';" 2>&1 | tr '\n' ';')
            echo "::notice title=Fotoswipe screens::TCC on $NAME: $ROWS"
            for SCREEN in main focus stacks review end whatsnew info clutter stats smart; do
              xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
              if [[ "$SCREEN" == "main" ]]; then
                xcrun simctl launch "$UDID" "$BUNDLE" -fotoswipe.focusGuideSeen YES >/dev/null
              else
                xcrun simctl launch "$UDID" "$BUNDLE" -fotoswipe.focusGuideSeen YES -FSScreen "$SCREEN" >/dev/null
              fi
              sleep 9
              xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$NAME-$SCREEN.png" >/dev/null 2>&1
            done
            xcrun simctl shutdown "$UDID" || true
            echo "::notice title=Fotoswipe screens::$NAME done"
          done
          ls "$RUNNER_TEMP/shots" | wc -l | xargs -I{} echo "::notice title=Fotoswipe screens::{} screenshots"
      - name: Publish screenshots to review branch
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q && git checkout -q -b claude/fotoswipe-screens
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screens ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" claude/fotoswipe-screens
