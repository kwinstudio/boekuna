name: BOEKUNA document engine and workflow regressions
on:
  pull_request:
    paths:
      - 'kwinest/docprocessor/**'
      - 'kwinest/index.html'
      - 'supabase/functions/document-processing/**'
      - 'supabase/migrations/*document*'
      - 'tests/document-*.test.*'
      - 'tests/test_document_processor_regression.py'
      - 'tests/fixtures/supabase-platform-shim.sql'
      - 'tests/fixtures/replay-migrations.sh'
      - 'tests/document-workflow-integration.py'
      - '.github/workflows/boekuna-document-v6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned workflow SDK and processor
        run: python -m pip install -r kwinest/docprocessor/requirements-workflow.txt pytest==9.1.1
      - run: npm ci --prefix tests
      - name: Metadata, shared engine, existing financial and OCR contracts
        run: >-
          python -m pytest --import-mode=importlib -q
          tests/document-v6-metadata.test.py tests/document-v6-scenarios.test.py tests/document-workflow-worker.test.py
          tests/document-intelligence-phases.test.py tests/document-scan-intelligence-unit.test.py
          tests/financial-blocks.test.py tests/receipt-math.test.py
          tests/document-user-supplied-edge-regressions.test.py tests/document-ocr-v5-regressions.test.py
          tests/ocr-production-hardening.test.py tests/document-error-contract.test.py
          tests/document-processor-pdf.test.py tests/processor-production-origin.test.py
          tests/test_document_processor_regression.py
      - name: Actual migration lease, ownership, quota and 1/10/50 job regressions
        run: node tests/document-workflow-leases.test.mjs
      - name: Upload receipt behavior
        run: node tests/document-upload-receipt.test.mjs
      - name: Workflow and Edge review routing parity
        run: node tests/document-review-parity.test.mjs
      - name: Frozen existing OCR benchmark
        env:
          BOOKUNA_OCR_V5_REPORT: artifacts/document-v6-ocr.json
        run: python tests/document-ocr-v5-benchmark.test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-v6-ocr
          path: artifacts/document-v6-ocr.json
          if-no-files-found: warn
  workflow_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow SDK, processor and integration clients
        run: python -m pip install -r kwinest/docprocessor/requirements-workflow.txt 'psycopg[binary]==3.2.10' PyJWT==2.10.1
      - name: Install pinned PostgREST
        run: |
          curl -sSL -o postgrest.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          echo '9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  postgrest.tar.xz' | sha256sum -c -
          tar xJf postgrest.tar.xz && ./postgrest --version
      - name: All migrations on PostgreSQL 17, PostgREST RPC, real worker and engine under faults
        env:
          BOOKUNA_WORKFLOW_REPORT: artifacts/workflow-integration.json
        run: |
          mkdir -p artifacts
          python tests/document-workflow-integration.py postgresql://postgres:postgres@localhost:5432/postgres ./postgrest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-integration
          path: artifacts/workflow-integration.json
          if-no-files-found: warn
  document_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing browser test dependencies
        id: browser_dependencies
        run: |
          npm ci --prefix tests --ignore-scripts
          npm install --prefix tests --no-save playwright@1.56.1
      - name: Existing upload, review and background browser regressions
        run: |
          node tests/document-upload-browser.test.mjs
          BOOKUNA_BROWSER=webkit node tests/document-upload-browser.test.mjs
          node tests/document-background-processing.test.mjs
      - name: Diagnose document overflow against unchanged publication main
        if: always() && steps.browser_dependencies.outcome == 'success'
        run: |
          mkdir -p artifacts
          if node tests/mobile-flow-simplification.test.mjs > artifacts/mobile-candidate.log 2>&1; then
            cat artifacts/mobile-candidate.log
          else
            cat artifacts/mobile-candidate.log
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git fetch origin 50fa6ae456f96d0e4f8145c32ce8d6641d28444a --depth=1
            git show FETCH_HEAD:kwinest/index.html > kwinest/index.html
            node tests/mobile-flow-simplification.test.mjs > artifacts/mobile-base.log 2>&1 || true
            cat artifacts/mobile-base.log
            git checkout -- kwinest/index.html
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-browser-diagnostics
          path: |
            artifacts/mobile-*.log
            tests/artifacts/**
          if-no-files-found: warn
