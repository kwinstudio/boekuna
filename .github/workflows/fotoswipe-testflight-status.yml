name: Fotoswipe TestFlight status
# Read-mostly App Store Connect check: processing state, export compliance,
# and internal-group availability of the newest Fotoswipe build. No uploads, no App Review.
on:
  push:
    branches: [claude/fotoswipe-testflight-status]
  workflow_dispatch:
    inputs:
      target_build:
        description: "Build number to check (empty = newest)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: fotoswipe-testflight-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check processing and internal TestFlight availability
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TARGET_BUILD: ${{ inputs.target_build || '11' }}
          WAIT_MINUTES: "40"
          WHAT_TO_TEST: "Nieuw in build 11: de app is nu Engels met Nederlands, Spaans, Duits, Frans en Japans (kies bij i > Instellingen > Taal). Slim opruimen heeft Grote video's (verkleinen in laag/midden/hoog), de Reiskaart en Dubbele contacten. Snelle albums: zet tot 3 albums onder de foto (i > Instellingen > Snelle albums). Nieuwe widget voor je beginscherm, en de app werkt nu ook op iPad. Test vooral: taal wisselen, de widget, de reiskaart en dubbele contacten (bekijk eerst het overzicht)."
        run: node fotoswipe/scripts/asc-testflight-status.mjs
