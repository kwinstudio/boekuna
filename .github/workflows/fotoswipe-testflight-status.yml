name: Fotoswipe TestFlight status
# Read-mostly App Store Connect check: processing state, export compliance,
# and internal-group availability of the newest Fotoswipe build. No uploads, no App Review.
on:
  push:
    branches: [claude/fotoswipe-testflight-status]
  workflow_dispatch:
    inputs:
      target_build:
        description: "Build number to check (empty = newest)"
        type: string
        default: ""
      contact_first:
        description: "Beta review contact: first name (only sent to Apple)"
        type: string
        default: ""
      contact_last:
        description: "Beta review contact: last name (only sent to Apple)"
        type: string
        default: ""
      contact_phone:
        description: "Beta review contact: phone (only sent to Apple)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: fotoswipe-testflight-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check processing and internal TestFlight availability
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TARGET_BUILD: ${{ inputs.target_build || '13' }}
          WAIT_MINUTES: "40"
          WHAT_TO_TEST: "Nieuw in build 13: Slim opruimen kijkt nu naar je hele fotobibliotheek in plaats van alleen de nieuwste 1200 foto's, en foto's uit WhatsApp en andere apps worden eerst bekeken. Je ziet al resultaten terwijl de scan nog loopt. Test vooral: Slim opruimen > Rommel en Per ongeluk, en of de app soepel blijft tijdens het scannen."
        run: node fotoswipe/scripts/asc-testflight-status.mjs
      - name: Public TestFlight link for friends
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TARGET_BUILD: ${{ inputs.target_build || '13' }}
          CONTACT_FIRST: ${{ inputs.contact_first }}
          CONTACT_LAST: ${{ inputs.contact_last }}
          CONTACT_PHONE: ${{ inputs.contact_phone }}
        run: node fotoswipe/scripts/asc-share.mjs
