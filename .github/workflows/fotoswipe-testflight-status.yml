name: Fotoswipe TestFlight status
# Read-mostly App Store Connect check: processing state, export compliance,
# and internal-group availability of the newest Fotoswipe build. No uploads, no App Review.
on:
  push:
    branches: [claude/fotoswipe-testflight-status]
  workflow_dispatch:
    inputs:
      target_build:
        description: "Build number to check (empty = newest)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: fotoswipe-testflight-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check processing and internal TestFlight availability
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TARGET_BUILD: ${{ inputs.target_build || '7' }}
          WAIT_MINUTES: "40"
          WHAT_TO_TEST: "Nieuw in build 7: Bijna dubbel (stapels met de beste foto voorgekozen, een veeg bevestigt), Rommel (wazig, bonnetjes, screenshots vooraan), dagelijkse herinnering op jouw tijd, sessiegrootte 15/30/50, Bewaar de rest (via Meer) en een berichtje over wat nieuw is. Test vooral: of de voorgekozen foto klopt, of Rommel geen goede foto's toont, en of de herinnering op tijd komt."
        run: node fotoswipe/scripts/asc-testflight-status.mjs
