name: Fotoswipe TestFlight status
# Read-mostly App Store Connect check: processing state, export compliance,
# and internal-group availability of the newest Fotoswipe build. No uploads, no App Review.
on:
  push:
    branches: [claude/fotoswipe-testflight-status]
  workflow_dispatch:
    inputs:
      target_build:
        description: "Build number to check (empty = newest)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: fotoswipe-testflight-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check processing and internal TestFlight availability
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TARGET_BUILD: ${{ inputs.target_build || '8' }}
          WAIT_MINUTES: "40"
          WHAT_TO_TEST: "Nieuw in build 8: sessies van 100 (kies 30, 50 of 100 onder het i-knopje). De app vraagt pas om fototoegang als je op de knop tikt. Welkomstscherm past op elke iPhone (ook SE), lichtere berekeningen tijdens swipen. Test vooral: eerste start na herinstallatie, een sessie van 100 en het swipen op een kleine iPhone."
        run: node fotoswipe/scripts/asc-testflight-status.mjs
