name: Fotoswipe TestFlight status
# Read-mostly App Store Connect check: processing state, export compliance,
# and internal-group availability of the newest Fotoswipe build. No uploads, no App Review.
on:
  push:
    branches: [claude/fotoswipe-testflight-status]
  workflow_dispatch:
    inputs:
      target_build:
        description: "Build number to check (empty = newest)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: fotoswipe-testflight-status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check processing and internal TestFlight availability
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TARGET_BUILD: ${{ inputs.target_build || '12' }}
          WAIT_MINUTES: "40"
          WHAT_TO_TEST: "Nieuw in build 12: een nieuw icoon en een rustiger, strakker ontwerp (geen dikke randen meer). Daarnaast veel verbeteringen onder de motorkap: dubbele contacten worden veiliger samengevoegd (niets is vooraf aangevinkt, en alle gegevens zoals datums en relaties gaan mee), swipen is soepeler, willekeurige volgorde blijft gelijk, de widget wordt na elke sessie bijgewerkt. Test vooral: het nieuwe uiterlijk, swipen, Slim opruimen en de widget."
        run: node fotoswipe/scripts/asc-testflight-status.mjs
