name: Boekuna integrity tests

on:
  push:
    branches:
      - kwinest-hosting
  pull_request:
    paths:
      - "kwinest/**"
      - "tests/**"
      - "supabase/functions/send-invoice/**"
      - ".github/workflows/boekuna-integrity.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Accounting integrity
        run: node tests/accounting-integrity.test.mjs
      - name: Production source safety
        run: node tests/source-safety.test.mjs
      - name: Install invoice test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Production calculation regression tests
        run: node tests/production-integrity.test.mjs
      - name: Invoice PDF and email parity
        run: node tests/invoice-delivery.test.mjs
      - name: Python syntax safety
        run: python -m py_compile kwinest/docprocessor/app.py
