name: Boekuna integrity tests

on:
  push:
    branches:
      - main
      - kwinest-hosting
  pull_request:
    paths:
      - "kwinest/**"
      - "tests/**"
      - "supabase/functions/send-invoice/**"
      - "supabase/functions/consume-quota/**"
      - "supabase/functions/analyze-invoice/**"
      - ".github/workflows/boekuna-integrity.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: "pip"
          cache-dependency-path: "kwinest/docprocessor/requirements.txt"
      - name: Accounting integrity
        run: node tests/accounting-integrity.test.mjs
      - name: Production source safety
        run: node tests/source-safety.test.mjs
      - name: Smart financial correction
        run: node tests/smart-financial-correction.test.mjs
      - name: Install invoice test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: Install browser QA dependency
        run: npm install --prefix tests --no-save playwright@1.56.1
      - name: Install Chromium for browser QA
        run: ./tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser pre-launch smoke
        run: node tests/browser-smoke.test.mjs
      - name: PDF browser regressions
        run: node tests/document-upload-browser.test.mjs
      - name: Auth and progressive onboarding
        run: node tests/auth-progressive-onboarding.test.mjs
      - name: Contextual list controls
        run: node tests/list-controls.test.mjs
      - name: Invoice status edit regression
        run: node tests/invoice-status-edit.test.mjs
      - name: Two-pass document verification
        run: node tests/document-verification.test.mjs
      - name: Cloud sync serialization
        run: node tests/cloud-sync-serialization.test.mjs
      - name: Production calculation regression tests
        run: node tests/production-integrity.test.mjs
      - name: Invoice PDF and email parity
        run: node tests/invoice-delivery.test.mjs
      - name: Install document processor regression dependencies
        run: pip install --disable-pip-version-check -r kwinest/docprocessor/requirements.txt
      - name: OCR production hardening
        run: python tests/ocr-production-hardening.test.py
      - name: PDF document processor regression
        run: python tests/document-processor-pdf.test.py
      - name: Real Dutch document regressions
        run: python tests/test_document_processor_regression.py
      - name: Document error contract regression
        run: python tests/document-error-contract.test.py
      - name: Receipt VAT arithmetic
        run: python tests/receipt-math.test.py
      - name: Invoice financial block regressions
        run: python tests/financial-blocks.test.py
      - name: Marketing page QA
        run: node tests/marketing-pages.test.mjs
      - name: Real marketing product screenshots
        run: node tests/marketing-product-proof.test.mjs
      - name: Editorial marketing responsive screenshots
        run: node tests/marketing-editorial-responsive.test.mjs

      - name: Billing subscription regressions
        run: node tests/billing-source.test.mjs
      - name: Python syntax safety
        run: python -m py_compile kwinest/docprocessor/app.py kwinest/docprocessor/receipt_math.py kwinest/docprocessor/financial_blocks.py
