name: TEMP OCR V4 advance payment regression

on:
  pull_request:
    paths:
      - "tests/document-advance-payment-regression.test.py"
      - "kwinest/docprocessor/**"
      - ".github/workflows/temp-ocr-v4-advance-regression.yml"

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: kwinest/docprocessor/requirements.txt
      - name: Install processor dependencies
        run: pip install --disable-pip-version-check -r kwinest/docprocessor/requirements.txt
      - name: Advance payment and outstanding balance regression
        run: python tests/document-advance-payment-regression.test.py
