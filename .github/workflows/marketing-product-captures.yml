name: Boekuna real product marketing captures

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tests/marketing-capture.mjs"
      - ".github/workflows/marketing-product-captures.yml"

permissions:
  contents: write

concurrency:
  group: boekuna-marketing-product-captures
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOOKUNA_MARKETING_CAPTURE_EMAIL: ${{ secrets.BOOKUNA_MARKETING_CAPTURE_EMAIL }}
      BOOKUNA_MARKETING_CAPTURE_PASSWORD: ${{ secrets.BOOKUNA_MARKETING_CAPTURE_PASSWORD }}
      BOOKUNA_MARKETING_CAPTURE_ORIGIN: https://boekuna-boekhouding.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install capture dependencies
        run: |
          npm ci --prefix tests --ignore-scripts
          npm install --prefix tests --no-save playwright@1.56.1 sharp@0.33.5
          ./tests/node_modules/.bin/playwright install --with-deps chromium

      - name: Capture real Boekuna product UI
        run: node tests/marketing-capture.mjs

      - name: Verify required assets
        run: |
          for f in \
            boekuna-dashboard-desktop.webp \
            boekuna-invoices-desktop.webp \
            boekuna-documents-desktop.webp \
            boekuna-vat-desktop.webp \
            boekuna-contacts-desktop.webp \
            boekuna-services-desktop.webp \
            boekuna-company-settings-desktop.webp \
            boekuna-reports-desktop.webp \
            boekuna-dashboard-mobile.webp \
            boekuna-invoices-mobile.webp \
            boekuna-documents-mobile.webp \
            boekuna-vat-mobile.webp; do
            test -s "public/assets/product/$f" || { echo "Missing $f"; exit 1; }
          done
          test -s public/assets/product/capture-proof.json
          node -e "const p=require('./public/assets/product/capture-proof.json'); if(!p.sourceCommit||!p.sourceRef)throw new Error('Missing capture build provenance'); if(p.viewportMobile!=='390x844')throw new Error('Unexpected mobile viewport'); if(p.demoDataset!=='permanent-fictive-marketing-v1')throw new Error('Unexpected demo dataset'); if(p.processorStatus==='real-processor-confirmed'){for(const f of ['boekuna-document-review-desktop.webp','boekuna-document-review-mobile.webp'])require('fs').accessSync('./public/assets/product/'+f)} else {console.log('Processor review assets pending dedicated QA/demo auth secrets.')}"

      - name: Commit generated product screenshots
        run: |
          if git diff --quiet -- public/assets/product/ && [ -z "$(git ls-files --others --exclude-standard public/assets/product/)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "boekuna-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/product/
          git commit -m "Add real Boekuna product marketing screenshots [skip ci]"
          git push origin HEAD:main
