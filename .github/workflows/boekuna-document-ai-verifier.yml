name: BOEKUNA document AI verifier contracts

on:
  pull_request:
    paths:
      - "services/document-ai-verifier/**"
      - ".github/workflows/boekuna-document-ai-verifier.yml"
  workflow_dispatch:

jobs:
  verifier-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install contract test dependencies
        run: python -m pip install --upgrade pip fastapi "pydantic>=2.8,<3" "httpx>=0.27,<1" pytest
      - name: Document-only verifier contract
        run: pytest -q services/document-ai-verifier/tests/test_contract.py
