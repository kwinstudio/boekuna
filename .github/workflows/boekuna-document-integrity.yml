name: Boekuna document integrity

on:
  pull_request:
    paths:
      - "kwinest/docprocessor/**"
      - "kwinest/index.html"
      - "public/assets/financial-correction.js"
      - "public/assets/document-intelligence.js"
      - "public/assets/document-review-v2.js"
      - "tests/document-*.test.py"
      - "tests/document-scan-intelligence-unit.test.py"
      - "tests/document-*.test.mjs"
      - "tests/ocr-production-hardening.test.py"
      - "tests/test_document_processor_regression.py"
      - "tests/receipt-math.test.py"
      - "tests/financial-blocks.test.py"
      - "tests/smart-financial-correction.test.mjs"
      - "docs/document-scan-intelligence.md"
      - ".github/workflows/boekuna-document-integrity.yml"
  workflow_dispatch:

env:
  ORT_DISABLE_TELEMETRY: "1"

permissions:
  contents: read

jobs:
  document-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: "pip"
          cache-dependency-path: "kwinest/docprocessor/requirements.txt"

      - name: Tenant isolation regression
        run: node tests/tenant-isolation.test.mjs
      - name: Smart financial correction
        run: node tests/smart-financial-correction.test.mjs
      - name: Document intelligence phase regressions
        run: |
          node tests/document-intelligence-app.test.mjs
          node tests/document-intelligence-learning.test.mjs
      - name: Production calculation regression
        run: node tests/production-integrity.test.mjs

      - name: Install browser dependencies
        run: |
          npm ci --prefix tests --ignore-scripts
          npm install --prefix tests --no-save playwright@1.56.1
          ./tests/node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Document intelligence tenant persistence
        run: node tests/document-intelligence-sql-isolation.test.mjs
      - name: App browser smoke · Chromium
        run: node tests/browser-smoke.test.mjs
      - name: App browser smoke · WebKit
        run: BOOKUNA_BROWSER=webkit node tests/browser-smoke.test.mjs
      - name: Document upload/review · Chromium
        run: node tests/document-upload-browser.test.mjs
      - name: Document upload/review · WebKit
        run: BOOKUNA_BROWSER=webkit node tests/document-upload-browser.test.mjs
      - name: Beginner document review
        run: node tests/document-review-beginner-ux.test.mjs
      - name: Document background processing
        run: node tests/document-background-processing.test.mjs
      - name: Document verification
        run: node tests/document-verification.test.mjs
      - name: App plain-language regression · Chromium
        run: node tests/app-ux-plain-language.test.mjs
      - name: App plain-language regression · WebKit
        run: BOOKUNA_BROWSER=webkit node tests/app-ux-plain-language.test.mjs

      - name: Install processor dependencies
        run: pip install --disable-pip-version-check -r kwinest/docprocessor/requirements.txt httpx==0.28.1
      - name: Document intelligence parser phases
        run: python tests/document-intelligence-phases.test.py
      - name: OCR production hardening
        run: python tests/ocr-production-hardening.test.py
      - name: Baseline scan intelligence benchmark
        env:
          BOOKUNA_BASE_SHA: f1c0a10df6e84da376e333e7ee00f178862bcfcb
        run: |
          BASE=/tmp/boekuna-base-processor
          mkdir -p "$BASE"
          for file in app.py receipt_math.py financial_blocks.py; do
            git show "$BOOKUNA_BASE_SHA:kwinest/docprocessor/$file" > "$BASE/$file"
          done
          BOOKUNA_PROCESSOR_DIR="$BASE" python tests/document-scan-intelligence-benchmark.test.py
      - name: Scan intelligence benchmark
        run: python tests/document-scan-intelligence-benchmark.test.py
      - name: Scan intelligence unit regressions
        run: python tests/document-scan-intelligence-unit.test.py
      - name: Production origin and image codecs
        run: python tests/processor-production-origin.test.py
      - name: Processor memory regression
        run: python tests/processor-memory-regression.test.py
      - name: PDF processor regression
        run: python tests/document-processor-pdf.test.py
      - name: Real document regressions
        run: python tests/test_document_processor_regression.py
      - name: Document error contract
        run: python tests/document-error-contract.test.py
      - name: Receipt VAT arithmetic
        run: python tests/receipt-math.test.py
      - name: Financial blocks
        run: python tests/financial-blocks.test.py
      - name: Python syntax safety
        run: python -m py_compile kwinest/docprocessor/app.py kwinest/docprocessor/receipt_math.py kwinest/docprocessor/financial_blocks.py kwinest/docprocessor/image_quality.py kwinest/docprocessor/document_intelligence.py
