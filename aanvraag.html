<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boekingsaanvraag · DJ APP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">D</span><span>DJ APP</span></a><nav class="desktop-nav"><a href="index.html#discover">DJ's vinden</a><a href="organisator.html">Mijn aanvragen</a></nav><div class="header-actions"><a class="pill-btn" href="index.html#discover">Andere DJ zoeken</a></div></header><main class="page-main section-shell"><a id="backToDj" class="back-link" href="index.html#discover">← Terug naar profiel</a><div class="page-heading"><span class="eyebrow">Boekingsaanvraag</span><h1 id="requestTitle">Vertel ons over je event.</h1><p>Deze MVP slaat je demo-aanvraag lokaal in je browser op. Er wordt nog geen echte betaling of bericht naar een DJ verstuurd.</p></div><div class="form-panel"><form id="requestForm" class="form-grid"><input type="hidden" id="djId"><div class="field"><label>Naam</label><input id="name" required autocomplete="name"></div><div class="field"><label>E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Datum evenement</label><input id="date" type="date" required></div><div class="field"><label>Locatie / plaats</label><input id="location" required placeholder="Bijv. Rotterdam"></div><div class="field"><label>Type evenement</label><select id="eventType" required><option value="">Kies...</option><option>Bruiloft</option><option>Bedrijfsfeest</option><option>Verjaardag</option><option>Club</option><option>Festival</option><option>Anders</option></select></div><div class="field"><label>Aantal gasten</label><input id="guests" type="number" min="1" placeholder="150"></div><div class="field"><label>Starttijd</label><input id="startTime" type="time"></div><div class="field"><label>Eindtijd</label><input id="endTime" type="time"></div><div class="field full"><label>Budgetindicatie</label><input id="budget" type="number" min="0" placeholder="Bijv. 750"></div><div class="field full"><label>Wensen / opmerkingen</label><textarea id="message" placeholder="Vertel kort welke sfeer je zoekt, muziekvoorkeuren en praktische informatie."></textarea></div><div class="field full"><button class="form-submit" type="submit">Verstuur demo-aanvraag</button></div></form><div id="successBox" class="success-box" hidden></div></div></main><script src="request.js"></script></body></html>
