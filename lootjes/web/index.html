<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lootjes</title>
<meta name="description" content="Lootjes trekken voor Sinterklaas en Kerst. Zonder account, gratis en zonder reclame.">
<meta name="theme-color" content="#B3261E">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root { --red:#B3261E; --gold:#B3261E; --green:#1E8E3E; --paper:#F2F2F7; --card:#fff; --ink:#111; --muted:#6b6b70; --line:#dcdce0; --accent:var(--red); }
  @media (prefers-color-scheme: dark) { :root { --red:#F2726A; --gold:#F2726A; --green:#34C759; --paper:#000; --card:#1C1C1E; --ink:#f2f2f7; --muted:#98989f; --line:#38383a; } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:520px; margin:0 auto; padding:20px 18px calc(120px + env(safe-area-inset-bottom)); }
  h1 { font-size:28px; line-height:1.15; margin:8px 0 6px; letter-spacing:-.02em; }
  h2 { font-size:18px; margin:0 0 6px; }
  p { margin:0 0 10px; }
  .muted { color:var(--muted); font-size:15px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin:12px 0; }
  .pill { display:inline-flex; gap:6px; align-items:center; font-weight:600; color:var(--accent); font-size:15px; }
  input, textarea { width:100%; font:inherit; color:inherit; background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; outline:none; }
  input:focus, textarea:focus { border-color:var(--accent); }
  textarea { min-height:150px; resize:vertical; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-family:inherit; font-size:17px; font-weight:600; line-height:1; cursor:pointer; text-decoration:none; transition:transform .12s; }
  .btn:active { transform:scale(.97); }
  .btn[disabled] { opacity:.45; }
  .btn.secondary { background:var(--card); color:var(--accent); border:1px solid var(--line); min-height:44px; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .bar > div { max-width:520px; margin:0 auto; display:grid; gap:8px; }
  .name { font-size:34px; font-weight:700; color:var(--ink); letter-spacing:-.02em; line-height:1.1; overflow-wrap:anywhere; }
  .scratch { position:relative; height:260px; border-radius:28px; overflow:hidden; background:var(--card); box-shadow:0 10px 30px color-mix(in srgb, var(--accent) 25%, transparent); touch-action:none; user-select:none; -webkit-user-select:none; }
  .scratch .under { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; }
  .scratch canvas { position:absolute; inset:0; width:100%; height:100%; transition:opacity .45s; }
  .linkbtn { background:none; border:0; padding:6px 0; min-height:32px; color:var(--muted, #6b6b70); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; }
  .bubble { max-width:80%; padding:10px 14px; border-radius:16px; margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .me { margin-left:auto; background:var(--accent); color:#fff; }
  .them { background:var(--paper); }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row input { flex:1; }
  .send { width:52px; min-height:50px; flex:none; }
  .toggle { display:flex; align-items:center; justify-content:space-between; min-height:44px; font-weight:600; }
  .toggle input { width:52px; height:30px; accent-color:var(--green); }
  .error { color:#d33; font-size:15px; margin-top:8px; }
  .warn { color:#c77700; font-size:14px; }
  .center { text-align:center; }
  a { color:var(--accent); }
  .wish { white-space:pre-wrap; overflow-wrap:anywhere; }
  .appbanner { display:flex; gap:12px; align-items:center; }
  .appbanner img { width:48px; height:48px; border-radius:11px; }
  .fest { position:relative; overflow:hidden; border-radius:16px; padding:18px; color:#fff; margin:6px 0 14px; display:flex; align-items:center; gap:12px; min-height:104px; }
  .fest.sint { background:linear-gradient(135deg,#B3261E,#731214); }
  .fest.kerst { background:linear-gradient(135deg,#1F6B4A,#0F3D2B); }
  .fest canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .fest .t { position:relative; flex:1; } .fest .t b { font-size:17px; } .fest .t div { opacity:.85; font-size:15px; }
  .fest .n { position:relative; text-align:center; min-width:86px; } .fest .n strong { display:block; font-size:38px; line-height:1; font-variant-numeric:tabular-nums; } .fest .n span { font-size:12px; opacity:.85; }
  .env { position:relative; height:210px; perspective:700px; margin:6px 0 4px; }
  .env .body { position:absolute; left:14px; right:14px; bottom:0; height:150px; border-radius:12px; background:var(--envg); transition:opacity .3s .7s; }
  .env .flap { position:absolute; left:14px; right:14px; top:45px; height:80px; background:var(--envf); clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top; transition:transform .45s ease-in-out .2s, opacity .3s .7s; z-index:3; }
  .env .seal { position:absolute; left:50%; top:105px; width:52px; height:52px; margin-left:-26px; border-radius:50%; background:#EDC254; z-index:4; transition:transform .25s cubic-bezier(.3,1.6,.6,1), opacity .25s; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .env .letter { position:absolute; left:28px; right:28px; top:70px; min-height:120px; background:var(--card); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; opacity:0; z-index:2; transition:transform .55s cubic-bezier(.2,.9,.3,1.1) .65s, opacity .2s .45s, box-shadow .3s .8s; }
  .env.open .seal { transform:scale(.01); opacity:0; }
  .env.open .flap { transform:rotateX(180deg); opacity:0; }
  .env.open .body { opacity:0; }
  .env.open .letter { opacity:1; transform:translateY(-52px); z-index:5; box-shadow:0 10px 24px rgba(0,0,0,.14); }
  .prod { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .prod img { width:52px; height:52px; object-fit:contain; background:#fff; border-radius:8px; flex:none; }
  .prod .pt { flex:1; font-size:15px; } .prod .pp { font-weight:600; }
  .prod button { width:44px; height:44px; border-radius:22px; border:0; background:var(--accent); color:#fff; font-size:22px; flex:none; }
  .prev { display:flex; gap:10px; align-items:center; padding:8px; margin-top:8px; border-radius:10px; background:var(--paper); color:inherit; text-decoration:none; }
  .prev img, .prev .ph { width:52px; height:52px; border-radius:8px; object-fit:cover; flex:none; background:var(--line); }
  .prev .pt { font-size:15px; font-weight:500; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .prev .ps { font-size:12px; color:var(--muted); }
  .row2 { display:flex; gap:8px; } .row2 .btn { flex:1; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .chip { flex:none; border:0; border-radius:16px; padding:8px 12px; font:inherit; font-size:14px; font-weight:600; background:var(--paper); color:var(--ink); }
  .chip.on { background:var(--accent); color:#fff; }
  .idea { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .idea .pt { flex:1; font-size:15px; } .idea .pt small { display:block; color:var(--muted); font-size:12px; }
  .idea a.look { color:var(--muted); text-decoration:none; padding:8px; }
  .idea button { width:40px; height:40px; border-radius:20px; border:0; background:var(--accent); color:#fff; font-size:20px; flex:none; }
  .wi { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .wi img, .wi .ph { width:48px; height:48px; border-radius:8px; object-fit:contain; background:#fff; flex:none; border:1px solid var(--line); }
  .wi .pt { flex:1; font-size:15px; } .wi .pt small { display:block; color:var(--muted); font-size:12px; }
  .wi .x { border:0; background:none; color:var(--muted); font-size:18px; width:36px; height:40px; }
  .pill-btn { border:0; border-radius:16px; padding:8px 12px; font:inherit; font-size:13px; font-weight:600; background:var(--accent); color:#fff; text-decoration:none; display:inline-block; }
  .pill-btn.soft { background:var(--paper); color:var(--ink); } .pill-btn.ok { background:color-mix(in srgb, var(--green) 15%, transparent); color:var(--green); }
  .si { display:flex; gap:10px; align-items:center; padding:6px 0; }
  .si input[type=checkbox] { width:24px; height:24px; accent-color:var(--green); flex:none; }
  .si .pt { flex:1; } .si.done .pt { text-decoration:line-through; color:var(--muted); }
  .bar2 { height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin:6px 0 2px; } .bar2 div { height:100%; background:var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="muted center" style="margin-top:40vh">Even laden…</p></main>
<div class="bar" id="bar" hidden><div id="barInner"></div></div>
<script>
const API = "https://vuwfyhtejsxhdfyvkkeq.supabase.co/functions/v1/lootjes";
const APP_STORE_URL = "__APP_STORE_URL__";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener nofollow">$1</a>');
const euro = (c) => c == null ? "" : new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", maximumFractionDigits: c % 100 ? 2 : 0 }).format(c / 100);
const longDate = (s) => s ? new Date(s + "T12:00:00").toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" }) : "";
function countdown(s) {
  if (!s) return "";
  const d = Math.round((new Date(s + "T00:00:00") - new Date(new Date().toDateString())) / 864e5);
  return d < 0 ? "" : d === 0 ? "vandaag" : d === 1 ? "morgen" : `nog ${d} dagen`;
}
const occ = (o) => ({ sinterklaas: { word: "pakjesavond", giver: "Sint", color: "var(--red)" }, kerst: { word: "kerst", giver: "Secret Santa", color: "var(--red)" } }[o] || { word: "het feest", giver: "Secret Santa", color: "var(--red)" });
const vibrate = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

async function call(action, params = {}) {
  let r;
  try {
    r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, ...params }) });
  } catch { throw new Error("Geen internet. Controleer je verbinding en probeer het opnieuw."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j?.error?.message || "Er ging iets mis. Probeer het opnieuw.");
  return j;
}

function bar(html) {
  const b = $("#bar");
  if (!html) { b.hidden = true; return; }
  $("#barInner").innerHTML = html;
  b.hidden = false;
}
function render(html) { $("#app").innerHTML = html; }
function setAccent(o) { document.documentElement.style.setProperty("--accent", occ(o).color); }

function appBanner(path) {
  return `<div class="card appbanner">
    <img src="/icon.png" alt="">
    <div style="flex:1"><strong>Lootjes-app</strong><div class="muted">Handiger met meldingen en een gedichthulp.</div></div>
    <a class="btn secondary" style="width:auto;padding:0 16px" href="${APP_STORE_URL !== "__APP_STORE_URL__" ? APP_STORE_URL : "lootjes://" + path}">${APP_STORE_URL !== "__APP_STORE_URL__" ? "Download" : "Open app"}</a>
  </div>`;
}


// ---------- Festive header ----------
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function seasonOf(occasion) {
  if (occasion === "kerst") return "kerst";
  if (occasion === "sinterklaas") return "sint";
  const n = new Date(), m = n.getMonth() + 1, d = n.getDate();
  return (m === 12 && d > 5) || (m === 1 && d <= 6) ? "kerst" : "sint";
}
function daysTo(s) {
  if (!s) return null;
  const d = Math.round((new Date(s + "T00:00:00") - new Date(new Date().toDateString())) / 864e5);
  return d >= 0 ? d : null;
}
function festHeader(g) {
  const season = seasonOf(g.occasion), days = daysTo(g.eventDate), word = occ(g.occasion).word;
  const title = g.occasion === "kerst" ? "Kerst" : g.occasion === "sinterklaas" ? "Sinterklaas" : esc(g.name);
  return `<div class="fest ${season}"><canvas data-season="${season}"></canvas>
    <div class="t"><b>${title}</b>${g.eventDate ? `<div>${esc(longDate(g.eventDate))}</div>` : ""}${g.budgetCents != null ? `<div>Budget ${euro(g.budgetCents)}</div>` : ""}</div>
    ${days != null ? `<div class="n"><strong data-count="${days}">${reduced ? days : 0}</strong><span>${days === 1 ? "dag tot " + word : days === 0 ? "het is vandaag!" : "dagen tot " + word}</span></div>` : ""}</div>`;
}
function startFestive() {
  document.querySelectorAll(".fest [data-count]").forEach((el) => {
    const to = +el.dataset.count; if (reduced || !to) { el.textContent = to; return; }
    const t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  if (reduced) return;
  document.querySelectorAll(".fest canvas").forEach((c) => {
    const ctx = c.getContext("2d"), dpr = devicePixelRatio || 1, season = c.dataset.season;
    const W = c.clientWidth, H = c.clientHeight; c.width = W * dpr; c.height = H * dpr; ctx.scale(dpr, dpr);
    const ps = Array.from({ length: 24 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 2 + Math.random() * 3, v: 8 + Math.random() * 14, a: 3 + Math.random() * 7, p: Math.random() * 6.28 }));
    const star = (x, y, r) => { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, q = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); };
    const frame = (t) => {
      if (!c.isConnected) return;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = season === "kerst" ? "rgba(255,255,255,.75)" : "rgba(255,214,115,.85)";
      for (const p of ps) {
        const y = (p.y + t / 1000 * p.v) % (H + 20) - 10, x = p.x + Math.sin(t / 1250 + p.p) * p.a;
        if (season === "kerst") { ctx.beginPath(); ctx.arc(x, y, p.s / 2, 0, 6.28); ctx.fill(); } else star(x, y, p.s);
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}

// ---------- Join ----------
async function joinPage(code) {
  let p;
  try { p = await call("groupByCode", { joinCode: code }); }
  catch (e) { return render(`<h1>Oeps</h1><p>${esc(e.message)}</p>`); }
  const g = p.group;
  setAccent(g.occasion);
  const closed = g.drawnAt || !g.joinOpen;
  render(`
    ${festHeader(g)}
    <h1>${esc(g.name)}</h1>
    ${g.note ? `<div class="card">${esc(g.note)}</div>` : ""}
    ${p.memberNames.length ? `<p class="muted">Doen al mee: ${p.memberNames.map(esc).join(", ")}</p>` : ""}
    ${closed ? `<div class="card"><strong>Aanmelden is gesloten.</strong><p class="muted">Er is al getrokken. Vraag de organisator om je toe te voegen.</p></div>` : `
    <div class="card">
      <label for="nm"><h2>Hoe heet je?</h2></label>
      <input id="nm" autocomplete="given-name" autocapitalize="words" maxlength="40" placeholder="Je naam">
      <div id="dupe" class="warn" hidden></div>
      <div id="err" class="error" role="alert"></div>
    </div>
    <p class="muted center">Geen account nodig. Je krijgt meteen je eigen persoonlijke pagina.</p>`}
  `);
  startFestive();
  if (closed) return bar("");
  const names = p.memberNames.map((n) => n.toLowerCase());
  const input = $("#nm");
  input.value = localStorage.getItem("lt_name") || "";
  bar(`<button class="btn" id="go">Doe mee</button>`);
  const go = $("#go");
  const check = () => {
    const v = input.value.trim();
    go.disabled = !v;
    const d = $("#dupe");
    d.hidden = !names.includes(v.toLowerCase());
    d.textContent = "Die naam staat er al in. Ben jij dat? Vraag dan de organisator om jouw persoonlijke link. Iemand anders? Voeg een achternaam toe.";
  };
  input.addEventListener("input", check); check();
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  go.onclick = async () => {
    go.disabled = true; go.textContent = "Even geduld…";
    try {
      const r = await call("join", { joinCode: g.joinCode, name: input.value.trim() });
      localStorage.setItem("lt_name", input.value.trim());
      saveToken(r.token, g.name);
      vibrate(20);
      history.replaceState(null, "", "/m/" + r.token);
      memberPage(r.token, true);
    } catch (e) { $("#err").textContent = e.message; go.disabled = false; go.textContent = "Doe mee"; }
  };
}

function saveToken(token, name) {
  try { const all = JSON.parse(localStorage.getItem("lt_links") || "{}"); all[token] = { name, at: Date.now() }; localStorage.setItem("lt_links", JSON.stringify(all)); } catch {}
}

// ---------- Member ----------
async function memberPage(token, justJoined = false) {
  let d;
  try { d = await call("me", { token }); }
  catch (e) { return render(`<h1>Link werkt niet</h1><p>${esc(e.message)}</p>`), bar(""); }
  let knownHere = false;
  try { knownHere = !!JSON.parse(localStorage.getItem("lt_links") || "{}")[token]; } catch {}
  const warnOpened = d.me.openedBefore && !knownHere && !justJoined;
  saveToken(token, d.group.name);
  setAccent(d.group.occasion);
  const o = occ(d.group.occasion);
  const g = d.group;
  const cd = countdown(g.eventDate);
  const revealKey = `lt_rev_${token.slice(0, 10)}_${g.drawnAt}`;
  const info = `<div class="card muted">
      ${g.eventDate ? `<p>Datum: ${esc(longDate(g.eventDate))}${cd ? " (" + cd + ")" : ""}</p>` : ""}
      ${g.note ? `<p>Bericht: ${esc(g.note)}</p>` : ""}
      <p style="margin:0">Deelnemers: ${d.memberNames.map(esc).join(", ")}</p></div>`;
  const myWish = `<div class="card"><h2>Mijn verlanglijstje</h2>
      <p class="muted" style="font-size:13px">${g.budgetCents != null ? "Budget " + euro(g.budgetCents) + ". " : ""}Je Sint ziet dit lijstje.</p>
      <div id="mywish"></div>
      <h2 style="margin-top:14px">Toevoegen</h2>
      <div class="row"><input id="q" maxlength="80" placeholder="Zoek een idee, bijv. sokken, puzzel"><button class="btn send" id="qgo" aria-label="Zoek">&#128269;</button></div>
      <div id="qres"></div>
      <div class="row" style="margin-top:10px"><input id="own" maxlength="160" placeholder="Of typ zelf een wens, of plak een link"><button class="btn send" id="owngo" aria-label="Toevoegen">+</button></div>
      <p class="muted" id="wishState" style="font-size:13px;margin-top:6px"></p></div>`;

  if (!d.receiver) {
    render(`${festHeader(g)}<div class="pill">Je doet mee</div><h1>Hoi ${esc(d.me.name)}!</h1>
      <p class="muted">${justJoined ? "Je bent aangemeld. " : ""}De lootjes worden nog getrokken. Bewaar deze pagina (of deze link) — hier verschijnt straks je lootje.</p>
      ${myWish}
      ${g.joinOpen ? `<div class="card"><a href="/j/${esc(g.joinCode)}">Ook iemand anders aanmelden, bijvoorbeeld je kind</a></div>` : ""}
      ${info}${appBanner("m/" + token)}`);
    startFestive();
    bar("");
    wireWish(token, g.budgetCents, d);
    return;
  }

  const r = d.receiver;
  const revealed = localStorage.getItem(revealKey) === "1";
  const threads = (t) => d.messages.filter((m) => m.thread === t);
  const chat = (t, title, sub, ph) => `<div class="card"><h2>${title}</h2><p class="muted">${sub}</p>
      <div id="msgs_${t}">${threads(t).map((m) => `<div class="bubble ${m.fromMe ? "me" : "them"}">${esc(m.body)}</div>${m.fromMe ? "" : `<button class="linkbtn" data-report="${esc(m.id)}">Meld dit bericht</button>`}`).join("") || `<p class="muted">Nog geen berichten.</p>`}</div>
      <div class="row" style="margin-top:8px"><input id="in_${t}" maxlength="500" placeholder="${ph}"><button class="btn send" data-thread="${t}" aria-label="Verstuur">↑</button></div>
      <p style="margin:8px 0 0"><button class="linkbtn" data-block="${t}" data-on="${d.blocked?.[t] ? "1" : ""}">${d.blocked?.[t] ? "Deblokkeer berichten" : "Blokkeer berichten"}</button></p></div>`;

  render(`
    ${warnOpened && !d.me.isOrganizer && !revealed ? `<p class="warn">Deze link is al eerder geopend. Was jij dat niet? Vraag de organisator om een nieuwe link.</p>` : ""}
    ${festHeader(g)}

    b.onclick = async () => {

      try { await call("reportMessage", { token, messageId: b.dataset.report }); b.textContent = "Gemeld, bedankt"; b.disabled = true; } catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-block]").forEach((b) => {
    b.onclick = async () => {
      const on = !b.dataset.on;
      if (on && !confirm("Geen berichten meer ontvangen in dit gesprek? Je kunt dit later ongedaan maken.")) return;
      try {
        await call("setBlocked", { token, thread: b.dataset.block, blocked: on });
        b.dataset.on = on ? "1" : ""; b.textContent = on ? "Deblokkeer berichten" : "Blokkeer berichten";
      } catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll("[data-thread]").forEach((b) => {
    const t = b.dataset.thread, input = $("#in_" + t);
    const send = async () => {
      const text = input.value.trim(); if (!text) return;
      b.disabled = true;
      try {
        await call("sendMessage", { token, thread: t, body: text });
        const box = $("#msgs_" + t);
        if (box.querySelector("p.muted")) box.innerHTML = "";
        box.insertAdjacentHTML("beforeend", `<div class="bubble me">${esc(text)}</div>`);
        input.value = ""; vibrate(10);
      } catch (e) { alert(e.message); }
      b.disabled = false;
    };
    b.onclick = send;
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  });
  wireWish(token, g.budgetCents, d);
  bar("");
}

function urlsIn(text) {
  return [...new Set((text.match(/https?:\/\/[^\s<]+/g) || []))].slice(0, 6);
}
async function renderPreviews(host, text) {
  if (!host) return;
  for (const u of urlsIn(text)) {
    const a = document.createElement("a");
    a.className = "prev"; a.href = u; a.target = "_blank"; a.rel = "noopener nofollow";
    a.innerHTML = `<div class="ph"></div><div><div class="pt">${esc(u)}</div><div class="ps"></div></div>`;
    host.appendChild(a);
    call("linkPreview", { url: u }).then((p) => {
      if (p.title) a.querySelector(".pt").textContent = p.title;
      a.querySelector(".ps").textContent = p.site || "";
      if (p.imageUrl) { const img = new Image(); img.alt = ""; img.referrerPolicy = "no-referrer"; img.src = p.imageUrl; img.onload = () => a.querySelector(".ph").replaceWith(img); }
    }).catch(() => {});
  }
}
let ideaCatalog = null;
async function loadIdeas() {
  if (ideaCatalog) return ideaCatalog;
  try { ideaCatalog = await (await fetch("/gift-ideas.json")).json(); } catch { ideaCatalog = { categories: [], ideas: [] }; }
  return ideaCatalog;
}
const fold = (s) => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function searchIdeas(cat, q, budget) {
  const words = fold(q).split(/[^a-z0-9]+/).filter((w) => w.length >= 2);
  if (!words.length) return [];
  const catName = Object.fromEntries(cat.categories.map((c) => [c.id, c.name]));
  return cat.ideas.map((i) => {
    const name = fold(i.n), keys = fold((i.k || "") + " " + (catName[i.c] || ""));
    let score = 0;
    for (const w of words) {
      if (name.startsWith(w)) score += 30;
      else if (name.split(" ").some((x) => x.startsWith(w))) score += 20;
      else if (name.includes(w)) score += 12;
      else if (keys.split(" ").some((x) => x.startsWith(w))) score += 8;
      else if (keys.includes(w)) score += 4;
      else return null;
    }
    if (i.top) score += 3;
    if (budget != null && i.p[0] * 100 <= budget) score += 2;
    return [i, score];
  }).filter(Boolean).sort((a, b) => b[1] - a[1] || a[0].n.localeCompare(b[0].n)).slice(0, 12).map((x) => x[0]);
}
async function wireSearch(budget) {
  const q = $("#q"), go = $("#qgo"), out = $("#qres");
  if (!q) return;
  const cat = await loadIdeas();
  let category = null, showAll = false;
  const addLine = (draft, btn) => addWish(draft, btn);
  const shopLinks = (term) => `<p class="muted" style="margin:10px 0 0;font-size:13px;font-weight:600">Iets specifieks zoeken?</p><div class="row2" style="margin-top:6px">
      <a class="btn secondary" target="_blank" rel="noopener" href="https://www.bol.com/nl/nl/s/?searchtext=${encodeURIComponent(term)}">Bij bol.com</a>
      <a class="btn secondary" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(term)}">Op internet</a></div>
      <p class="muted" style="margin-top:8px;font-size:13px">Gevonden? Kopieer de link en plak hem hieronder bij "typ zelf of plak een link".</p>`;
  const ideaRows = (list) => list.map((i) => `<div class="idea"><div class="pt">${esc(i.n)}<small>€${i.p[0]}–${i.p[1]}${budget != null && i.p[0] * 100 > budget ? " · boven budget" : ""}</small></div>
      <a class="look" target="_blank" rel="noopener" aria-label="Bekijk in een winkel" href="https://www.bol.com/nl/nl/s/?searchtext=${encodeURIComponent(i.n)}">&#128269;</a>
      <button data-n="${esc(i.n)}" aria-label="Zet op je lijstje">+</button></div>`).join("");
  const wire = () => out.querySelectorAll("button[data-n]").forEach((b) => b.onclick = () => addLine({ title: b.dataset.n }, b));
  const render = () => {
    const term = q.value.trim();
    if (term.length >= 2) {
      const list = searchIdeas(cat, term, budget);
      out.innerHTML = (list.length ? ideaRows(list) : `<p class="muted">Geen idee gevonden in onze lijst.</p>`) + shopLinks(term);
    } else {
      let list = category ? cat.ideas.filter((i) => i.c === category) : cat.ideas.filter((i) => i.top);
      if (budget != null && !category) { const fit = list.filter((i) => i.p[0] * 100 <= budget); if (fit.length) list = fit; }
      const shown = showAll ? list : list.slice(0, 6);
      out.innerHTML = `<div class="chips"><button class="chip ${category ? "" : "on"}" data-c="">Populair</button>${cat.categories.map((c) => `<button class="chip ${category === c.id ? "on" : ""}" data-c="${c.id}">${esc(c.name)}</button>`).join("")}</div>` +
        ideaRows(shown) + (list.length > 6 ? `<p style="margin:8px 0 0"><a href="#" id="more">${showAll ? "Minder tonen" : "Toon alle " + list.length}</a></p>` : "");
      out.querySelectorAll(".chip").forEach((c) => c.onclick = () => { category = c.dataset.c || null; showAll = false; render(); });
      const more = $("#more"); if (more) more.onclick = (e) => { e.preventDefault(); showAll = !showAll; render(); };
    }
    wire();
  };
  const products = async () => {
    const term = q.value.trim(); if (term.length < 2) return;
    try {
      const r = await call("searchProducts", { query: term });
      if (!r.results.length) return;
      out.insertAdjacentHTML("afterbegin", `<p class="muted" style="font-size:13px;font-weight:600;margin:4px 0">Producten bij bol.com</p>` + r.results.map((p, i) => `<div class="prod">${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="" referrerpolicy="no-referrer">` : `<div style="width:52px"></div>`}
        <div class="pt">${esc(p.title)}${p.price != null ? `<div class="pp">${euro(p.price)}</div>` : ""}</div>
        <button data-p="${i}" aria-label="Voeg toe">+</button></div>`).join("") +
        (r.partnerLinks ? `<p class="muted" style="font-size:12px;margin-top:8px">Links naar bol.com zijn partnerlinks: de maker van deze app krijgt een kleine vergoeding, jij betaalt niets extra.</p>` : ""));
      out.querySelectorAll("button[data-p]").forEach((b) => b.onclick = () => {
        const p = r.results[+b.dataset.p];
        addLine({ title: p.title.slice(0, 160), url: p.url, imageUrl: p.imageUrl, priceCents: p.price }, b);
      });
    } catch {}
  };
  q.addEventListener("input", render);
  go.onclick = products; q.addEventListener("keydown", (e) => e.key === "Enter" && products());
  render();
}

const W = { token: null, budget: null, mine: [], their: null, shop: [] };
const priceTxt = (c) => c != null ? euro(c) : "";
const thumb = (u) => u ? `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" loading="lazy">` : `<div class="ph"></div>`;
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
function parsePrice(t) { const v = parseFloat(String(t || "").replace("€", "").replace(",", ".").trim()); return isNaN(v) ? null : Math.round(v * 100); }

function renderMine() {
  const el = $("#mywish"); if (!el) return;
  el.innerHTML = W.mine.length ? W.mine.map((w) => `<div class="wi">${thumb(w.imageUrl)}<div class="pt">${esc(w.title)}
      <small>${[priceTxt(w.priceCents), w.url ? hostOf(w.url) : "", w.note ? esc(w.note) : ""].filter(Boolean).join(" · ")}</small></div>
      <button class="x" data-del="${w.id}" aria-label="Verwijder ${esc(w.title)}">&times;</button></div>`).join("")
    : `<p class="muted">Nog leeg. Zoek hieronder een idee of typ zelf iets.</p>`;
  el.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.del; W.mine = W.mine.filter((w) => w.id !== id); renderMine();
    try { await call("wishDelete", { token: W.token, id }); } catch {}
  });
}
async function addWish(draft, btn) {
  try {
    const r = await call("wishAdd", { token: W.token, ...draft });
    W.mine.push(r.item); renderMine(); vibrate(15);
    if (btn) { btn.textContent = "✓"; btn.disabled = true; btn.style.background = "var(--green)"; }
    $("#wishState").textContent = `"${draft.title}" staat op je lijstje.`;
  } catch (e) { $("#wishState").textContent = e.message; }
}
function renderTheir() {
  const el = $("#theirwish"); if (!el || !W.their) return;
  const items = W.their.items || [];
  el.innerHTML = items.length ? items.map((w) => {
    const on = W.shop.some((s) => s.wishItemId === w.id);
    return `<div class="wi" style="align-items:flex-start">${thumb(w.imageUrl)}<div class="pt">${esc(w.title)}
      <small>${[priceTxt(w.priceCents), w.note ? esc(w.note) : ""].filter(Boolean).join(" · ")}</small>
      <div style="display:flex;gap:6px;margin-top:6px">${w.url ? `<a class="pill-btn soft" target="_blank" rel="noopener nofollow" href="${esc(w.url)}">Bekijk</a>` : ""}
      ${on ? `<span class="pill-btn ok">Op je boodschappenlijst</span>` : `<button class="pill-btn" data-buy="${w.id}">Ik koop dit</button>`}</div></div></div>`;
  }).join("") : `<p class="muted">${esc(W.their.name)} heeft nog niets ingevuld. Stel hieronder anoniem een vraag.</p>`;
  el.querySelectorAll("[data-buy]").forEach((b) => b.onclick = async () => {
    const w = items.find((x) => x.id === b.dataset.buy); b.disabled = true;
    try { const r = await call("shopAdd", { token: W.token, title: w.title, priceCents: w.priceCents, wishItemId: w.id }); W.shop.push(r.item); renderTheir(); renderShop(); vibrate(15); }
    catch (e) { b.disabled = false; alert(e.message); }
  });
}
function renderShop() {
  const el = $("#shop"); if (!el) return;
  const total = W.shop.reduce((a, s) => a + (s.priceCents || 0), 0), done = W.shop.filter((s) => s.bought).length;
  const quick = ["Inpakpapier", "Chocoladeletter", "Surprise-materiaal", "Kaartje"].filter((q) => !W.shop.some((s) => s.title === q));
  el.innerHTML = (W.budget != null ? `<div class="bar2"><div style="width:${Math.min(100, total / Math.max(W.budget, 1) * 100)}%;${total > W.budget ? "background:#c77700" : ""}"></div></div>
      <p class="muted" style="font-size:13px">${euro(total)} van ${euro(W.budget)}${total > W.budget ? " · boven budget" : ""}${W.shop.length ? " · " + done + " van " + W.shop.length + " gekocht" : ""}</p>` : "") +
    W.shop.map((s) => `<div class="si ${s.bought ? "done" : ""}"><input type="checkbox" data-tog="${s.id}" ${s.bought ? "checked" : ""} aria-label="${esc(s.title)} gekocht">
      <div class="pt">${esc(s.title)}</div><span class="muted">${priceTxt(s.priceCents)}</span><button class="x" data-sdel="${s.id}" aria-label="Verwijder">&times;</button></div>`).join("") +
    `<div class="row" style="margin-top:8px"><input id="snew" maxlength="160" placeholder="Nog iets kopen…"><input id="sprice" inputmode="decimal" placeholder="€" style="width:70px;flex:none"><button class="btn send" id="sadd" aria-label="Toevoegen">+</button></div>
    <div class="chips">${quick.map((q) => `<button class="chip" data-q="${q}">+ ${q}</button>`).join("")}</div>` +
    (W.shop.length && done === W.shop.length ? `<p style="color:var(--green);font-weight:600">Alles gekocht. Je cadeau staat op klaar.</p>` : "");
  el.querySelectorAll("[data-tog]").forEach((c) => c.onchange = async () => {
    const s = W.shop.find((x) => x.id === c.dataset.tog); s.bought = c.checked; renderShop(); vibrate(10);
    try { await call("shopUpdate", { token: W.token, id: s.id, bought: s.bought }); } catch {}
  });
  el.querySelectorAll("[data-sdel]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.sdel; W.shop = W.shop.filter((x) => x.id !== id); renderShop(); renderTheir();
    try { await call("shopDelete", { token: W.token, id }); } catch {}
  });
  const addShop = async (title, price) => {
    if (!title.trim()) return;
    try { const r = await call("shopAdd", { token: W.token, title: title.trim(), priceCents: price }); W.shop.push(r.item); renderShop(); vibrate(10); } catch (e) { alert(e.message); }
  };
  $("#sadd").onclick = () => addShop($("#snew").value, parsePrice($("#sprice").value));
  $("#snew").addEventListener("keydown", (e) => e.key === "Enter" && $("#sadd").click());
  el.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => addShop(b.dataset.q, null));
}
async function addOwn() {
  const v = $("#own").value.trim(); if (!v) return;
  const url = (v.match(/https?:\/\/[^\s<]+/) || [])[0];
  $("#own").value = "";
  if (url) {
    $("#wishState").textContent = "Link wordt gelezen…";
    let p = {}; try { p = await call("linkPreview", { url }); } catch {}
    const title = v.replace(url, "").trim() || p.title || hostOf(url);
    return addWish({ title: title.slice(0, 160), url, imageUrl: p.imageUrl || null, priceCents: p.priceCents ?? null });
  }
  addWish({ title: v.slice(0, 160) });
}
function wireWish(token, budget, d) {
  W.token = token; W.budget = budget; W.mine = d.myItems || []; W.their = d.receiver; W.shop = d.shopItems || [];
  renderMine(); renderTheir(); renderShop();
  wireSearch(budget);
  if ($("#owngo")) { $("#owngo").onclick = addOwn; $("#own").addEventListener("keydown", (e) => e.key === "Enter" && addOwn()); }
}

function support() {
  const qa = [
    ["Hoe werkt het?", "De organisator maakt een groep en deelt de link. Iedereen meldt zich aan of krijgt een eigen link. Na de trekking ziet iedereen op zijn eigen telefoon wie hij heeft getrokken."],
    ["Kan de organisator zien wie wie heeft?", "Nee. De trekking gebeurt op de server en niemand kan de koppels zien, ook de organisator niet."],
    ["Iemand is zijn link kwijt", "De organisator opent de groep, tikt op de naam en maakt een nieuwe link. De oude link werkt dan niet meer."],
    ["Iemand doet toch niet mee", "Haal die persoon weg bij de groep en trek opnieuw. Iedereen krijgt dan een nieuw lootje."],
    ["Heb ik de app nodig?", "Nee. Deelnemers kunnen alles via de link in de browser doen. De app is handig voor de organisator en voor herinneringen."],
    ["Kost het geld?", "Nee. Lootjes is gratis en zonder reclame."],
    ["Mijn gegevens laten verwijderen", "De organisator kan de hele groep verwijderen. Wil je iets anders laten verwijderen, mail ons dan."],
  ];
  render(`<h1>Hulp en contact</h1>
    <p class="muted">Kom je er niet uit? Mail <a href="mailto:k.phetmanee@gmail.com?subject=Lootjes">k.phetmanee@gmail.com</a>. We reageren meestal binnen een dag.</p>
    ${qa.map(([q, a]) => `<div class="card"><h2>${q}</h2><p>${a}</p></div>`).join("")}
    <p class="muted center"><a href="/privacy">Privacy</a> · <a href="/">Lootjes</a></p>`);
  bar("");
}

const parts = location.pathname.split("/").filter(Boolean);
if (parts[0] === "j" && parts[1]) joinPage(parts[1].toUpperCase());
else if (parts[0] === "m" && parts[1]) memberPage(parts[1]);
else if (parts[0] === "b" && parts[1]) adminPage(parts[1]);
else if (parts[0] === "privacy") privacy();
else if (parts[0] === "support") support();
else home();
</script>
