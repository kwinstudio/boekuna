name: Lootjes
options:
  bundleIdPrefix: nl.zichtwerfstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Lootjes:
    type: application
    platform: iOS
    sources:
      - path: Lootjes
    resources: []
    info:
      path: Lootjes/Info.plist
      properties:
        CFBundleDisplayName: Lootjes
        CFBundleDevelopmentRegion: nl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: nl.zichtwerfstudio.lootjes
            CFBundleURLSchemes: [lootjes]
        LSApplicationQueriesSchemes: [whatsapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.zichtwerfstudio.lootjes
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
  LootjesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LootjesTests
    dependencies:
      - target: Lootjes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.zichtwerfstudio.lootjes.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lootjes.app/Lootjes
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Lootjes:
    build:
      targets:
        Lootjes: all
        LootjesTests: [test]
    test:
      targets: [LootjesTests]
