<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn aanvragen · DJ APP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">D</span><span>DJ APP</span></a><nav class="desktop-nav"><a href="index.html#discover">DJ's vinden</a><a href="dj-aanmelden.html">Voor DJ's</a></nav><div class="header-actions"><a class="pill-btn" href="index.html#discover">Nieuwe aanvraag</a></div></header><main class="page-main section-shell"><div class="page-heading"><span class="eyebrow">Organisator dashboard</span><h1>Mijn aanvragen</h1><p>Hier zie je de aanvragen die je in deze MVP vanuit deze browser hebt verstuurd.</p></div><section class="dashboard-card"><div id="requestList" class="dashboard-list"></div></section></main><script>const root=document.querySelector("#requestList");const reqs=JSON.parse(localStorage.getItem("djBookingRequests")||"[]");if(!reqs.length){root.innerHTML="<div class='empty-state'><h2>Nog geen aanvragen</h2><p>Bekijk DJ-profielen en stuur je eerste aanvraag.</p><a class='pill-btn' href='index.html#discover'>Vind een DJ</a></div>"}else{root.innerHTML=reqs.map(r=>`<article class="request-item"><div><b>${r.djName}</b><p>${r.eventType} · ${r.date||"Datum onbekend"} · ${r.location}</p><p>${r.startTime||"?"} – ${r.endTime||"?"} · Budget ${r.budget?"€"+r.budget:"niet opgegeven"}</p></div><span class="status-pill">${r.status}</span></article>`).join("")}</script></body></html>
