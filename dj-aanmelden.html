<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DJ aanmelden · DJ APP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">D</span><span>DJ APP</span></a><nav class="desktop-nav"><a href="index.html#discover">DJ's vinden</a><a href="index.html#how">Hoe het werkt</a></nav><div class="header-actions"><a class="ghost-btn" href="organisator.html">Organisator</a></div></header><main class="page-main section-shell"><div class="page-heading"><span class="eyebrow">Voor DJ's</span><h1>Maak je profiel klaar voor boekingen.</h1><p>Vul de basis in. In deze MVP wordt je profielconcept lokaal opgeslagen; echte accounts en publicatie volgen in de backend-fase.</p></div><div class="form-panel"><form id="djForm" class="form-grid"><div class="field"><label>DJ-naam</label><input id="djName" required></div><div class="field"><label>Standplaats</label><input id="djCity" required></div><div class="field"><label>Hoofdgenre</label><input id="djGenre" required placeholder="Bijv. House"></div><div class="field"><label>Vanafprijs (€)</label><input id="djPrice" type="number" min="0"></div><div class="field full"><label>Korte omschrijving</label><input id="djTagline" placeholder="Wat maakt jouw stijl herkenbaar?"></div><div class="field full"><label>Bio</label><textarea id="djBio"></textarea></div><div class="field full"><button class="form-submit" type="submit">Bewaar profielconcept</button></div></form><div id="djSuccess" class="success-box" hidden></div></div></main><script>
const form=document.querySelector("#djForm");
const fields={
  name:document.querySelector("#djName"),
  city:document.querySelector("#djCity"),
  genre:document.querySelector("#djGenre"),
  price:document.querySelector("#djPrice"),
  tagline:document.querySelector("#djTagline"),
  bio:document.querySelector("#djBio")
};
const saved=JSON.parse(localStorage.getItem("djProfileDraft")||"null");
if(saved){Object.keys(fields).forEach(k=>{fields[k].value=saved[k]||""})}
form.addEventListener("submit",e=>{
  e.preventDefault();
  const profile={};Object.keys(fields).forEach(k=>profile[k]=fields[k].value);
  localStorage.setItem("djProfileDraft",JSON.stringify(profile));
  const success=document.querySelector("#djSuccess");
  success.hidden=false;
  success.textContent="Profielconcept opgeslagen in deze browser. De volgende technische fase is echte accountregistratie en database-opslag.";
});
</script></body></html>
