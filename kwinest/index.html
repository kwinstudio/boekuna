/* document review: desktop keeps split preview; mobile becomes a four-step flow */
.document-review-flow{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:16px;align-items:start}
.document-review-fields{min-width:0}
.review-step{margin-bottom:18px}
.review-step-preview{grid-row:1;grid-column:1;position:sticky;top:0}
.document-review-fields{grid-column:2}
.review-step-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 12px}
.review-step-head h4{font-size:17px;letter-spacing:-.02em;margin:2px 0 0}
.review-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:850}
.review-confidence{font-size:10px;font-weight:800;border-radius:999px;padding:6px 8px;background:#f3f5f4;color:var(--muted);white-space:nowrap}
.review-confidence.good{background:#e8f5ef;color:var(--good)}.review-confidence.warn{background:#fff4d8;color:var(--warn)}.review-confidence.bad{background:#fceaea;color:var(--bad)}
.document-review-preview-frame,.document-review-preview-image{width:100%;height:680px;border:1px solid var(--line);border-radius:12px;background:#fff;object-fit:contain}
.review-step-grid{margin-bottom:12px}
.review-amount-card{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.review-amount-primary{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.review-amount-primary span{display:block;font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.review-amount-primary strong{display:block;font-size:18px;margin-top:4px}.review-amount-primary.emphasis{background:#f6f9f8}
.review-settlement-card{border:1px solid #dbe6e1;border-radius:13px;padding:11px 12px;background:#f7faf8;margin-bottom:12px}
.review-money-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0}.review-money-row small{grid-column:1/-1;color:var(--muted);font-size:9px}.review-money-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.review-check-summary{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:12px}.review-check-line{display:flex;gap:9px;padding:10px 11px;border-bottom:1px solid #edf1ef}.review-check-line:last-child{border-bottom:0}.review-check-line strong{display:block;font-size:11px}.review-check-line span:not(.check-icon){display:block;font-size:10px;color:var(--muted);line-height:1.4;margin-top:2px}
.review-save-summary{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px;background:#f7f9f8;display:grid;grid-template-columns:1fr auto;gap:3px 10px}.review-save-summary span{font-size:11px;font-weight:750}.review-save-summary strong{font-size:18px}.review-save-summary small{grid-column:1/-1;color:var(--muted)}
.review-details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 12px;background:#fff}.review-details>summary{cursor:pointer;font-size:11px;font-weight:800;color:#43554f}.review-technical-body{display:grid;gap:8px;margin-top:10px}.review-technical pre{white-space:pre-wrap;font:10px/1.5 ui-monospace,monospace;background:#f6f8f7;padding:10px;border-radius:9px;max-height:220px;overflow:auto}
.review-checkbox{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;margin:8px 0;font-size:10px;line-height:1.4;text-transform:none;letter-spacing:0}.review-checkbox input{width:auto;margin-top:2px}.review-checkbox.warn{border-color:#edd9a6;background:#fffaf0}
.review-important{margin-bottom:10px}
.mobile-review-progress,.mobile-review-actions,.mobile-only-review,.mobile-review-hint{display:none}
.desktop-review-actions{display:flex;gap:8px}

@media(max-width:700px){.invoice-check-list,.review-grid,.invoice-options{grid-template-columns:1fr}.invoice-check-item:nth-child(odd){border-right:0}}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-270px;width:252px;transition:.2s;box-shadow:20px 0 60px rgba(0,0,0,.2)}.sidebar.open{left:0}.mobile-menu{display:grid;place-items:center}.topbar{padding:0 15px;height:68px}.search{display:none}.content{padding:20px 15px 50px}.page-title{font-size:17px}.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.hero-strip{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.line-item{grid-template-columns:1fr 70px 100px 90px 36px;overflow:auto}.top-actions .btn span{display:none}.avatar{display:none}}
@media(max-width:700px){
 .document-review-flow{display:block}
 .document-review-fields{display:block}
 .document-review-flow .review-step{display:none;margin:0}
 .document-review-flow .review-step.active{display:block}
 .review-step-preview{position:static}
 .mobile-review-progress{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-2px 0 16px;color:var(--muted);font-size:10px;font-weight:800}
 .mobile-review-progress>div{display:flex;gap:4px}.mobile-review-progress i{display:block;width:18px;height:3px;border-radius:999px;background:#e2e7e4}
 .document-review-flow[data-step="1"] .mobile-review-progress i:nth-child(-n+1),
 .document-review-flow[data-step="2"] .mobile-review-progress i:nth-child(-n+2),
 .document-review-flow[data-step="3"] .mobile-review-progress i:nth-child(-n+3),
 .document-review-flow[data-step="4"] .mobile-review-progress i:nth-child(-n+4){background:var(--primary)}
 .document-review-preview-frame,.document-review-preview-image{height:58vh;min-height:420px;border-radius:10px}
 .review-preview-shell{background:#f4f6f5;border-radius:12px;padding:6px}
 .review-step-head{align-items:center}
 .review-step-head h4{font-size:20px}
 .review-kicker{font-size:9px}
 .review-confidence{font-size:9px;padding:5px 7px}
 .mobile-only-review,.mobile-review-hint{display:block}
 .mobile-review-hint{font-size:10px;line-height:1.45;color:var(--muted);margin-top:10px}
 .review-amount-card{grid-template-columns:1fr 1fr;gap:8px}
 .review-amount-primary.emphasis{grid-column:1/-1}
 .review-amount-primary{padding:12px}.review-amount-primary strong{font-size:21px}
 .review-check-line{padding:11px}
 .review-step-grid{grid-template-columns:1fr}
 .desktop-review-actions{display:none}
 .mobile-review-actions{display:flex;width:100%;gap:8px}
 .mobile-review-actions .btn{flex:1;justify-content:center;min-height:46px}
 .modal-foot:has(.mobile-review-actions){padding:10px 16px calc(10px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:#fff;z-index:5;border-top:1px solid var(--line)}

/* Visibility and interaction polish */
.marketing a,.marketing button,.marketing summary{
  -webkit-tap-highlight-color:transparent
}
.marketing a,.marketing button{
  transition:background-color .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease
}

  color:#4E5E66!important
}
.kz-tab{
  cursor:pointer;min-height:46px;color:#34434B;
  display:flex;align-items:center;justify-content:center
}
.kz-tab.active{
  background:#202B33!important;color:#fff!important;border-color:#202B33!important;
  box-shadow:0 8px 20px rgba(32,43,51,.12)
}
.kz-product-shell{transition:background .25s ease}
.kz-browser-banner,.kz-browser-card,.kz-phone-hero{
  transition:opacity .16s ease,transform .16s ease,background .16s ease
}

.kz-backtop.show{opacity:1;pointer-events:auto;transform:none}
.kz-backtop:hover{background:#202B33;color:#fff}
.marketing-nav.scrolled{box-shadow:0 10px 30px rgba(24,64,76,.08)}

/* Interaction layer */
.kz-progress{
  position:fixed;left:0;top:0;height:3px;width:0;z-index:200;
  background:#08A9C5;transition:width .08s linear;pointer-events:none
}
.kz-reveal{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.kz-reveal.in-view{opacity:1;transform:none}

.kz-workflow{background:#F7FAF8;border-top:1px solid #E5ECE8;border-bottom:1px solid #E5ECE8;padding:84px 0}
.kz-workflow-inner{max-width:1200px;margin:auto;padding:0 22px}
.kz-workflow-grid{display:grid;grid-template-columns:.78fr 1.22fr;gap:32px;align-items:stretch}
.kz-workflow-tabs{display:grid;gap:8px}
.kz-workflow-tab{
  width:100%;text-align:left;background:#fff;border:1px solid #E1E8E5;border-radius:14px;
  padding:16px 17px;cursor:pointer;color:#20292E
}
.kz-workflow-tab strong{display:block;font-size:13px}
.kz-workflow-tab span{display:block;margin-top:4px;color:#65747A;font-size:10px;line-height:1.5}
.kz-workflow-tab.active{background:#20292E;color:#fff;border-color:#20292E;box-shadow:0 10px 25px rgba(32,41,46,.1)}
.kz-workflow-tab.active span{color:#C8D0D3}
.kz-workflow-stage{
  background:#fff;border:1px solid #E1E8E5;border-radius:20px;min-height:390px;padding:30px;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative
}
.kz-workflow-stage:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-80px;background:#F1F8EE}
.kz-workflow-meta{position:relative;z-index:1}
.kz-workflow-meta small{color:#078DA7;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.09em}
.kz-workflow-meta h3{font-size:34px;line-height:1.05;letter-spacing:-.05em;margin:10px 0 10px}
.kz-workflow-meta p{max-width:600px;color:#526169;font-size:12px;line-height:1.7}
.kz-workflow-preview{position:relative;z-index:1;margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kz-workflow-box{border:1px solid #E1E8E5;background:#F8FAF9;border-radius:12px;padding:13px}
.kz-workflow-box span{display:block;color:#819096;font-size:7px;text-transform:uppercase}
.kz-workflow-box b{display:block;margin-top:7px;font-size:10px;color:#20292E}

.kz-compare{max-width:1200px;margin:auto;padding:84px 22px}
.kz-compare-switch{display:inline-flex;background:#F1F5F3;border:1px solid #E1E8E5;border-radius:12px;padding:4px;gap:4px;margin-bottom:24px}
.kz-compare-switch button{border:0;background:transparent;border-radius:9px;padding:10px 14px;font-size:11px;font-weight:850;cursor:pointer;color:#526169}
.kz-compare-switch button.active{background:#20292E;color:#fff}
.kz-compare-panel{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px;align-items:stretch}
.kz-compare-copy{border:1px solid #E1E8E5;background:#fff;border-radius:18px;padding:26px}
.kz-compare-copy h3{font-size:28px;letter-spacing:-.045em;margin:0 0 10px}
.kz-compare-copy p{font-size:12px;line-height:1.7;color:#526169}
.kz-compare-list{display:grid;gap:8px;margin-top:18px}
.kz-compare-item{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#F8FAF9;border-radius:11px;font-size:11px;color:#425159}
.kz-compare-item:before{content:"•";font-weight:900;color:#08A9C5}
.kz-compare-visual{border-radius:20px;background:#F3F8F5;border:1px solid #E2EAE6;padding:28px;display:grid;align-content:center}
.kz-compare-flow{display:grid;gap:10px}
.kz-compare-flow-row{display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center;background:#fff;border:1px solid #E1E8E5;border-radius:13px;padding:13px}
.kz-compare-flow-row i{width:40px;height:40px;border-radius:10px;background:#EAF7F9}
.kz-compare-flow-row strong{font-size:11px}.kz-compare-flow-row small{display:block;font-size:8px;color:#829096;margin-top:3px}
.kz-compare-flow-row em{font-style:normal;color:#078DA7;font-size:8px}

.kz-solution-more{
  margin-top:14px;border:0;background:transparent;padding:0;color:#078DA7;font-size:10px;font-weight:850;cursor:pointer
}
.kz-solution-extra{
  max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease,margin-top .2s ease;
  color:#526169;font-size:10px;line-height:1.55
}
.kz-solution.expanded .kz-solution-extra{max-height:100px;opacity:1;margin-top:10px}
.kz-solution.expanded{border-color:#BFDCD4!important;box-shadow:0 12px 30px rgba(24,64,76,.07)}

/* Boekuna screen UI cleanup v2 — functional icons + high-contrast navigation */
#mainApp.app{
  min-height:100vh!important;
  position:relative;
}

/* Guarantees a continuous dark left rail even when the page itself is taller than the sidebar content. */
#mainApp.app::before{
  content:"";
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:252px;
  background:#1F3550;
  z-index:0;
  pointer-events:none;
}

#mainApp .sidebar{
  position:sticky!important;
  top:0!important;
  align-self:start!important;
  height:100vh!important;
  height:100dvh!important;
  max-height:100dvh!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  background:#1F3550!important;
  color:#F8FAFC!important;
  border-right:1px solid rgba(255,255,255,.12)!important;

async function getSupabase(){if(!supabaseClient){const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');supabaseClient=mod.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}return supabaseClient}
async function getApiAccessToken(forceRefresh=false){
 if(TEST_MODE_NO_AUTH)return '';
 const sb=await getSupabase();let {data:{session}}=await sb.auth.getSession();
 const expiresAt=Number(session?.expires_at||0)*1000,almostExpired=!!expiresAt&&expiresAt-Date.now()<90000;
 if(forceRefresh||!session?.access_token||almostExpired){
  const {data,error}=await sb.auth.refreshSession();
  if(!error&&data?.session)session=data.session;
 }
 if(!session?.access_token)throw new Error('Je sessie is verlopen. Log opnieuw in.');
 return session.access_token
}
async function apiAuthHeaders(extra={},forceRefresh=false){if(TEST_MODE_NO_AUTH)return {...extra,'x-kwinest-test-mode':'1'};const token=await getApiAccessToken(forceRefresh);return {...extra,Authorization:`Bearer ${token}`}}
async function fetchWithAuthRetry(url,options={}){
 const first={...options,headers:await apiAuthHeaders(options.headers||{})};
 let res=await fetch(url,first);
 if(res.status===401){
  const retry={...options,headers:await apiAuthHeaders(options.headers||{},true)};
  res=await fetch(url,retry)
 }
 return res
}
function billingPlanLabel(plan='free'){return ({free:'Gratis',boekuna:'Boekuna',pro:'Boekuna Pro'})[String(plan)]||'Gratis'}
function billingStatusLabel(status='free'){return ({free:'Gratis',trialing:'Gratis proefperiode',active:'Actief',past_due:'Betaling nodig',canceled:'Beëindigd',incomplete:'Nog niet afgerond',incomplete_expired:'Niet afgerond',unpaid:'Onbetaald',paused:'Gepauzeerd'})[String(status)]||String(status||'Gratis')}
function billingDate(v){if(!v)return '';try{return new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'long',year:'numeric'}).format(new Date(v))}catch{return ''}}
async function loadBillingSummary(force=false){
 if(TEST_MODE_NO_AUTH)return null;
 if(!force&&billingSnapshot&&Date.now()-billingLoadedAt<30000)return billingSnapshot;
 const sb=await getSupabase();
 const {data,error}=await sb.rpc('get_billing_summary');
 if(error)throw error;
 billingSnapshot=Array.isArray(data)?(data[0]||null):data;
 billingLoadedAt=Date.now();
 return billingSnapshot
}
function renderBillingCard(){
 const b=billingSnapshot;
 if(!b)return `<div class="card" id="billingCard" style="margin-bottom:16px"><div class="section-head"><div><h2>Abonnement</h2><p>Je abonnement en slimme documentverwerkingen.</p></div><span class="badge">Laden…</span></div><div class="help">Abonnementsstatus ophalen…</div></div>`;
 const plan=String(b.plan||'free'),status=String(b.status||'free'),limit=Number(b.monthly_limit||10),used=Number(b.used||0),remaining=Math.max(0,Number(b.remaining??limit-used)),pct=Math.min(100,Math.round((used/Math.max(1,limit))*100));
 const paid=plan!=='free'&&['trialing','active','past_due','unpaid','paused'].includes(status);
 const trial=status==='trialing'&&b.trial_end;
 const founder=b.founder_number?`Founding 100 · #${Number(b.founder_number)}`:'';
 const statusClass=['active','trialing'].includes(status)?'good':['past_due','unpaid','paused'].includes(status)?'warn':'';
 const period=trial?`Gratis tot ${billingDate(b.trial_end)}`:(paid&&b.current_period_end?`Huidige periode tot ${billingDate(b.current_period_end)}`:'');
 return `<div class="card" id="billingCard" style="margin-bottom:16px">
   <div class="section-head"><div><h2>Abonnement</h2><p>Beheer je plan en maandelijkse slimme documentverwerkingen.</p></div><span class="badge ${statusClass}">${esc(billingPlanLabel(plan))} · ${esc(billingStatusLabel(status))}</span></div>
   ${founder?`<div class="notice info" style="margin-bottom:14px"><strong>${esc(founder)}</strong><br>${trial?`Je eerste 90 dagen zijn gratis. Daarna loopt je abonnement maandelijks door tegen het normale tarief, tenzij je opzegt.`:'Je Founding 100-status blijft aan je account gekoppeld.'}</div>`:''}
   <div class="grid grid-2"><div><div class="eyebrow">Slimme documenten deze maand</div><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:7px"><strong style="font-size:26px">${used} / ${limit}</strong><span class="help">${remaining} over</span></div><div class="progress" style="height:7px;margin-top:10px"><span style="width:${pct}%"></span></div>${period?`<div class="help" style="margin-top:9px">${esc(period)}</div>`:''}</div>
   <div style="display:flex;gap:8px;align-items:flex-start;justify-content:flex-end;flex-wrap:wrap">
     ${paid?`<button class="btn" onclick="openBillingPortal()">Beheer abonnement</button>`:`<button class="btn primary" onclick="startSubscription('boekuna')">Boekuna · €9,95</button><button class="btn" onclick="startSubscription('pro')">Pro · €20</button>`}
     <a class="btn" href="/prijzen/" target="_blank" rel="noopener">Prijzen</a>
   </div></div>
   ${b.cancel_at_period_end?`<div class="notice warn" style="margin-top:14px"><strong>Opzegging gepland.</strong> Je betaalde toegang loopt door tot het einde van de huidige periode.</div>`:''}
 </div>`
}
async function refreshBillingCard(force=false){
 try{await loadBillingSummary(force);const el=document.getElementById('billingCard');if(el)el.outerHTML=renderBillingCard()}catch(err){console.warn('Billing summary',err);const el=document.getElementById('billingCard');if(el)el.innerHTML='<div class="section-head"><div><h2>Abonnement</h2><p>Status kon niet worden geladen.</p></div></div><button class="btn small" onclick="refreshBillingCard(true)">Opnieuw proberen</button>'}
}
async function startSubscription(plan){
 if(billingBusy)return;
 if(!['boekuna','pro'].includes(plan))return;
 if(!currentUser){location.href='/?login=1&plan='+encodeURIComponent(plan);return}
 if(!profileEssentialsComplete(state.company)){navigate('profile');toast('Maak eerst je bedrijfsprofiel compleet voordat je een abonnement activeert.');return}
 billingBusy=true;
 try{
  toast('Veilige Stripe Checkout openen…');
  const res=await fetchWithAuthRetry(EDGE_BASE+'/billing-checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({plan})});
  const body=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(body?.error||'Checkout kon niet worden gestart.');
  if(!body?.url)throw new Error('Stripe Checkout gaf geen betaalpagina terug.');
  location.href=body.url
 }catch(err){console.error('Billing checkout',err);toast(err?.message||'Checkout kon niet worden gestart.')}
 finally{billingBusy=false}
}
async function openBillingPortal(){
 if(billingBusy)return;billingBusy=true;
 try{
  toast('Abonnementbeheer openen…');
  const res=await fetchWithAuthRetry(EDGE_BASE+'/billing-portal',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
  const body=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(body?.error||'Abonnementbeheer kon niet worden geopend.');
  if(!body?.url)throw new Error('Stripe gaf geen beheerpagina terug.');
  location.href=body.url
 }catch(err){console.error('Billing portal',err);toast(err?.message||'Abonnementbeheer kon niet worden geopend.')}
 finally{billingBusy=false}
}
async function handleBillingReturnAndPlan(){
 const u=new URL(location.href),billing=u.searchParams.get('billing'),plan=u.searchParams.get('plan');
 if(billing){
  u.searchParams.delete('billing');
  history.replaceState({},'',u.pathname+(u.search?'?'+u.searchParams.toString():'')+u.hash);
  await loadBillingSummary(true).catch(()=>null);
  if(billing==='success')toast('Abonnement bevestigd. Je status wordt bijgewerkt zodra Stripe de betaling heeft verwerkt.');
  else if(billing==='cancelled')toast('Checkout geannuleerd. Er is niets gewijzigd.');
  else if(billing==='portal-return')toast('Abonnementsstatus bijgewerkt.');
  if(page==='settings')render()
 }
 if(plan&&['boekuna','pro'].includes(plan)){
  u.searchParams.delete('plan');
  history.replaceState({},'',u.pathname+(u.search?'?'+u.searchParams.toString():'')+u.hash);
  await startSubscription(plan)
 }
}

}

}

async function initAuth(){
 document.getElementById('mainApp').style.display='none';
 const url=new URL(location.href);
 const wantsLogin=url.searchParams.get('login')==='1';
 const hashParams=new URLSearchParams((location.hash||'').replace(/^#/,''));
 const isRecovery=hashParams.get('type')==='recovery';
 try{
  const sb=await getSupabase();
  const {data:{session},error:sessionError}=await sb.auth.getSession();
  if(sessionError)throw sessionError;

  if(isRecovery&&session?.user){
   currentUser={id:session.user.id,email:session.user.email||'',supabaseUser:session.user};
   showResetPassword();
  }else if(session?.user){
   if(!(await requireMfaForUser(session.user))){
    await hydrateCloudAccount(session.user);
    enterApp();
   }
  }else if(wantsLogin){
   showAuth('login');
  }else{
   showLanding();
  }

  sb.auth.onAuthStateChange((event,nextSession)=>{
   if(event==='PASSWORD_RECOVERY'){
    setTimeout(()=>{
     if(nextSession?.user)currentUser={id:nextSession.user.id,email:nextSession.user.email||'',supabaseUser:nextSession.user};
     showResetPassword();
    },0);
    return;
   }
   if(event==='SIGNED_IN'&&nextSession?.user&&!isRecovery){
    setTimeout(async()=>{
     try{
      if(!(await requireMfaForUser(nextSession.user))){
       await hydrateCloudAccount(nextSession.user);
       enterApp();
      }
     }catch(err){
      console.error('Auth sign-in hydration failed',err);
      authError('Inloggen gelukt, maar je administratie kon niet worden geladen. Probeer opnieuw.');
     }
    },0);
    return;
   }
   if(event==='SIGNED_OUT'&&!nextSession){
    currentUser=null;
    state=structuredClone(DEFAULT);
    showLanding();
   }
  });
 }catch(e){
  console.error('Supabase auth init failed',e);
  if(wantsLogin||isRecovery){
   showAuth('login');
   authError(isRecovery?'De herstel-link kon niet worden verwerkt. Vraag een nieuwe herstel-link aan.':'Supabase Auth kon niet worden gestart. Vernieuw de pagina en probeer opnieuw.');
  }else{
   showLanding();
  }
 }
}

function renderDocuments(){return `<div class="page-head"><div><h1>Documenten</h1><p>Upload bronstukken via dezelfde slimme documentprocessor. Facturen en bonnen worden herkend; andere documenten worden gecontroleerd en veilig opgeslagen.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="document.getElementById('docFile').click()">${icon('i-upload')} Slim document uploaden</button><button class="btn" onclick="triggerReceiptPhoto()">${icon('i-upload')} Foto kiezen</button><button class="btn" onclick="triggerReceiptCamera()">${icon('i-upload')} Camera</button><button class="btn" onclick="document.getElementById('archiveFile').click()">Alleen archiveren</button></div><input class="hidden" type="file" id="docFile" accept="application/pdf,image/*,.heic,.heif,.tif,.tiff,.bmp,.docx,.xlsx,.csv,text/csv"><input class="hidden" type="file" id="archiveFile" multiple accept="application/pdf,image/*,.heic,.heif,.tif,.tiff,.bmp,.docx,.xlsx,.csv,text/csv"></div><div class="notice info"><strong>Eén herkenningsmethode voor boekhoudstukken.</strong> PDF, foto/scan, Word, Excel en CSV gaan via dezelfde v2-documentprocessor. Op mobiel kun je kiezen uit je fotobibliotheek of direct de camera openen. Ook iPhone HEIC/HEIF-foto’s worden ondersteund. De app boekt nooit stilletjes: financiële gegevens komen eerst in het controlescherm.</div><div class="card" style="margin-top:16px"><div class="dropzone" onclick="document.getElementById('docFile').click()">${icon('i-upload')}<strong>Sleep of kies een document om slim uit te lezen</strong><span>Facturen en bonnen worden herkend met tekstextractie, tabellen en OCR. Niet-financiële documenten worden alleen geanalyseerd en opgeslagen.</span></div><div class="divider"></div><div class="section-head"><div><h2>Bestanden</h2><p>${state.documents.length} documenten geregistreerd</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Naam</th><th>Type</th><th>Datum</th><th>Status</th><th>< function profileCompleteness(){const required=[state.company.name,state.company.address,state.company.postal,state.company.city,state.company.kvk,state.company.email,state.company.iban];const optional=[state.company.vat,state.company.phone,state.company.contactName,state.company.website,state.company.peppolId];const score=Math.round((required.filter(Boolean).length/required.length)*85+(optional.filter(Boolean).length/optional.length)*15);return Math.min(100,score)}

nts & database</strong><span>Supabase Auth + database met RLS per gebruiker</span></div><span class="badge good">Actief</span></div><div class="action-row"><div class="action-text"><strong>Documentopslag</strong><span>Privé Supabase Storage met gebruikersgebonden toegang</span></div><span class="badge good">Actief</span></div><div class="action-row"><div class="action-text"><strong>E-mail & AI</strong><span>Server-endpoints zijn voorbereid; providerstatus kan live worden gecontroleerd</span></div><button class="btn small" onclick="checkIntegrations()">Controleer</button></div><div class="action-row"><div class="action-text"><strong>Bank / PSD2 & Peppol</strong><span>Externe gecertificeerde providers nodig</span></div><span class="badge warn">Nog koppelen</span></div></div></div></div>`}

 pendingSendInvoiceId=id;pendingSendRequestId=uid('send');const docLabel=i.kind==='credit'?'Creditfactuur':'Factuur',subject=invoiceMailSubject(i,c);modal(`Verstuur ${docLabel.toLowerCase()} ${esc(i.number)}`,`<div class="notice info" id="emailServiceNotice"><strong>E-mailverbinding controleren…</strong></div><form id="sendInvoiceForm" class="form-grid" style="margin-top:14px"><div class="field full"><label>Ontvanger *</label><input name="to" type="email" value="${esc(c.email||'')}" required placeholder="administratie@klant.nl"><div class="help">Controleer dit adres goed. De PDF-factuur wordt hierheen verzonden.</div></div><div class="field full"><label>Onderwerp *</label><input name="subject" value="${esc(subject)}" required></div><div class="field full"><label>Bericht *</label><textarea name="message" style="min-height:210px" required>${esc(defaultInvoiceEmailMessage(i,c))}</textarea></div><div class="field full"><label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0"><input type="checkbox" name="ccSelf" style="width:auto" ${state.company.email?'checked':''}> Stuur een kopie naar ${esc(state.company.email||'mijn bedrijfse-mail')}</label></div></form><div class="review-grid" style="margin-top:12px"><div class="review-card"><h4>PDF-bijlage</h4><div class="help"><strong>${i.kind==='credit'?'Creditfactuur':'Factuur'}-${esc(i.number)}.pdf</strong><br>Professionele A4-factuur met klant-, bedrijfs-, btw- en betalingsgegevens.</div></div><div class="review-card"><h4>Verzendcontrole</h4><div class="help">Totaal: <strong>${money(invoiceGross(i))}</strong><br>Vervaldatum: ${dateNL(i.dueDate)}<br>Reply-to: ${esc(state.company.email||'niet ingesteld')}</div></div></div>`,`<button class="btn" onclick="closeModal();pendingSendInvoiceId=null">Annuleren</button><button class="btn primary" id="sendInvoiceButton" onclick="sendInvoiceEmail()">${i.kind==='credit'?'Verstuur creditfactuur':'Verstuur factuur'}</button>`,true);checkInvoiceEmailService() async function checkInvoiceEmailService(){const n=document.getElementById('emailServiceNotice');if(!n)return;try{const r=await fetch(EDGE_BASE+'/send-invoice',{cache:'no-store'}),j=await r.json();if(j.configured)n.innerHTML='<strong>E-mailverzending is gekoppeld.</strong> Na bevestiging wordt de factuur direct met PDF-bijlage verstuurd.';else{n.className='notice warn';n.innerHTML='<strong>E-mailprovider nog niet gekoppeld.</strong> De verstuurfunctie staat klaar, maar Vercel heeft nog RESEND_API_KEY en INVOICE_FROM_EMAIL nodig.'}}catch(e){n.className='notice warn';n.innerHTML='<strong>E-mailstatus kon niet worden gecontroleerd.</strong> Probeer het later opnieuw.'}}
async function sendInvoiceEmail(){const i=state.invoices.find(x=>x.id===pendingSendInvoiceId),f=document.getElementById('sendInvoiceForm'),btn=document.getElementById('sendInvoiceButton');if(!i||!f||!f.reportValidity())return;const c=getContact(i.customerId),d=new FormData(f),to=String(d.get('to')||'').trim(),subject=String(d.get('subject')||'').trim(),message=String(d.get('message')||'').trim();if(!to||!subject||!message)return toast('Controleer ontvanger, onderwerp en bericht');btn.disabled=true;btn.textContent='Versturen…';try{const r=await fetch(EDGE_BASE+'/send-invoice',{method:'POST',headers:await apiAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify({requestId:pendingSendRequestId,to,subject,message,ccSelf:d.get('ccSelf')==='on',company:state.company,customer:{...c,email:to},invoice:i})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.details?.join(' ')||j.error||'Versturen mislukt');if(!c.email)c.email=to;else if(c.email!==to)c.email=to;i.lastSentAt=j.sentAt||new Date().toISOString();i.lastSentTo=to;i.sendProviderId=j.id||'';i.sendHistory=[...(i.sendHistory||[]),{sentAt:i.lastSentAt,to,subject,providerId:j.id||''}];if(i.status==='draft')i.status='sent';save();pendingSendInvoiceId=null;pendingSendRequestId=null;closeModal();toast(`Factuur ${i.number} is verstuurd naar ${to}`);render()}catch(e){toast(e.message||'Factuur kon niet worden verstuurd');btn.disabled=false;btn.textContent='Verstuur factuur'}}
function registerPayment(id){const i=state.invoices.find(x=>x.id===id);if(!i)return;if(i.kind==='credit')return toast('Een creditfactuur verwerk je via verrekening of terugbetaling, niet als klantbetaling');const out=invoiceOutstanding(i);modal('Betaling registreren',`<div class="notice info" style="margin-bottom:14px"><strong>${esc(i.number)}</strong> · nog open ${money(out)}</div><form id="paymentForm" class="form-grid"><div class="field"><label>Datum *</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Bedrag *</label><input name="amount" type="number" min="0.01" max="${out.toFixed(2)}" step="0.01" value="${out.toFixed(2)}" required></div><div class="field full"><label>Omschrijving</label><input name="note" value="Handmatige betaling ${esc(i.number)}"></div></form>`,`<button class="btn" onclick="closeModal()">Annuleren</button><button class="btn primary" onclick="savePayment('${id}')">Betaling opslaan</button>`)}
function savePayment(id){const i=state.invoices.find(x=>x.id===id),f=document.getElementById('paymentForm');if(!i||!f?.reportValidity())return;const d=new FormData(f),amount=roundMoney(d.get('amount')||0),date=String(d.get('date')||''),out=invoiceOutstanding(i);if(amount<=0||amount>out+.02)return toast('Controleer het betalingsbedrag');const bankDuplicate=state.transactions.find(t=>t.status==='matched'&&t.matchType==='invoice'&&t.matchId===i.id&&t.date===date&&Math.abs(Math.abs(roundMoney(t.amount||0))-Math.abs(amount))<=0.02);if(bankDuplicate)return toast('Deze betaling staat al als gekoppelde banktransactie geregistreerd en wordt niet dubbel geboekt.');if(!Array.isArray(i.payments))i.payments=[];i.payments.push({id:uid('p'),date,amount,note:String(d.get('note')||'')});syncInvoiceStatus(i);logEvent('Betaling geregistreerd',`${i.number} · ${money(amount)}`,'invoice',i.id);save();closeModal();render();toast(invoiceOutstanding(i)<=.02?'Factuur volledig betaald':'Deelbetaling geregistreerd')}

function parseEmbeddedInvoiceXml(xml,forced='auto'){
 try{
  const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))return null;
  const root=doc.documentElement;
  const supplier=xmlParty(root,'AccountingSupplierParty'),customer=xmlParty(root,'AccountingCustomerParty');
  const ownVat=String(state.company.vat||'').replace(/\s/g,'').toUpperCase(),ownName=String(state.company.name||'').trim().toLowerCase();
  const suppOwn=(supplier.vatId||'').replace(/\s/g,'').toUpperCase()===ownVat&&ownVat||ownName&&supplier.party?.toLowerCase().includes(ownName);
  const custOwn=(customer.vatId||'').replace(/\s/g,'').toUpperCase()===ownVat&&ownVat||ownName&&customer.party?.toLowerCase().includes(ownName);
  const type=forced!=='auto'?forced:(suppOwn?'sale':custOwn?'purchase':'purchase');
  const party=type==='sale'?customer:supplier;
  const net=parseMoneyValue(xmlFirst(root,['TaxExclusiveAmount','LineTotalAmount']));
  const vat=parseMoneyValue(xmlFirst(root,['TaxAmount','TaxTotalAmount']));
  const gross=parseMoneyValue(xmlFirst(root,['PayableAmount','TaxInclusiveAmount','GrandTotalAmount']));
  const rates=xmlByLocal(root,'Percent').map(x=>Number(String(x.textContent).replace(',','.'))).filter(Number.isFinite);
  const invoiceNumber=xmlFirst(root,['ID']);
  const issueDate=parseLooseDate(xmlFirst(root,['IssueDate','DateTimeString']));
  const dueDate=parseLooseDate(xmlFirst(root,['DueDate','PaymentDueDate']));
  const iban=xmlByLocal(root,'ID').map(x=>x.textContent.trim().replace(/\s/g,'')).find(x=>/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(x))||'';
  const ref=xmlFirst(root,['PaymentID','BuyerReference','OrderReference']);
  if(!invoiceNumber&&!party.party&&gross==null)return null;
  return {type,...party,invoiceNumber,issueDate,dueDate,net:net??'',vatAmount:vat??'',gross:gross??'',vatRate:rates.includes(21)?21:rates.includes(9)?9:rates[0]??'',mixedRates:new Set(rates.filter(x=>x>=0)).size>1,iban,paymentReference:ref,description:'Geïmporteerde e-factuur',sourceQuality:'embedded-xml',confidenceScore:98,fieldConfidence:{party:98,invoiceNumber:99,issueDate:99,net:98,vatAmount:98,gross:98}}
 }catch(e){console.warn('XML invoice parse',e);return null}
}

}

async function deleteStoredFile(id){if(!id||!currentUser)return;if(TEST_MODE_NO_AUTH){await deleteLegacyStoredFile(id);return}try{const sb=await getSupabase();const {data:meta,error}=await sb.from('documents').select('storage_path').eq('user_id',currentUser.id).eq('client_ref',id).maybeSingle();if(error)throw error;if(meta?.storage_path)await sb.storage.from('kwinest-documents').remove([meta.storage_path]);await sb.from('documents').delete().eq('user_id',currentUser.id).eq('client_ref',id)}catch(e){console.warn(e)}}
function deleteAccountDialog(){modal('Account definitief verwijderen',`<div class="notice warn" style="margin-bottom:14px"><strong>Dit kan niet ongedaan worden gemaakt.</strong> Je cloudaccount, administratie, bedrijfsprofiel en alle privé-documenten worden definitief verwijderd.</div><form id="deleteAccountForm" class="form-grid"><div class="field full"><label>Wachtwoord *</label><input name="password" type="password" required></div><div class="field full"><label>Typ VERWIJDER *</label><input name="confirm" required autocomplete="off"></div></form>`,`<button class="btn" onclick="closeModal()">Annuleren</button><button class="btn danger" onclick="deleteAccountNow()">Definitief verwijderen</button>`)}
async function deleteAccountNow(){const f=document.getElementById('deleteAccountForm');if(!f?.reportValidity()||!currentUser)return;const d=new FormData(f),password=String(d.get('password')||'');if(String(d.get('confirm')||'').trim().toUpperCase()!=='VERWIJDER')return toast('Typ VERWIJDER om te bevestigen');try{const sb=await getSupabase();const {error:reauthError}=await sb.auth.signInWithPassword({email:currentUser.email,password});if(reauthError)throw new Error('Wachtwoord is niet correct');const {error}=await sb.functions.invoke('delete-account',{body:{confirm:true}});if(error)throw error;const old=currentUser;localStorage.removeItem(DATA_KEY_PREFIX+old.id);localStorage.removeItem(PROFILE_KEY_PREFIX+old.id);const legacy=getUsers().find(u=>String(u.email||'').toLowerCase()===String(old.email||'').toLowerCase());if(legacy){localStorage.removeItem(DATA_KEY_PREFIX+legacy.id);localStorage.removeItem(PROFILE_KEY_PREFIX+legacy.id);saveUsers(getUsers().filter(u=>u.id!==legacy.id))}currentUser=null;state=structuredClone(DEFAULT);closeModal();showAuth('login');toast('Account en cloudgegevens definitief verwijderd')}catch(err){toast(err?.message||'Account kon niet worden verwijderd')}}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>b.dataset.page&&navigate(b.dataset.page)));document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('quickNew').addEventListener('click',quickMenu);document.getElementById('globalSearch').addEventListener('input',e=>{search=e.target.value;render()});window.addEventListener('popstate',()=>{if(document.getElementById('mainApp').style.display==='none')showLanding()});window.addEventListener('online',()=>{if(TEST_MODE_NO_AUTH){setCloudSyncStatus('saved');return}setCloudSyncStatus('saving');syncCloudStateNow().catch(()=>setCloudSyncStatus('error'))});window.addEventListener('offline',()=>setCloudSyncStatus(TEST_MODE_NO_AUTH?'saved':'offline'));initAuth();
</script>
<script id="boekuna-upload-bootstrap">
(function(){
 const configs=[
  ['invoicePdfFile','auto'],
  ['receiptPhotoFile','purchase'],
  ['receiptCameraFile','purchase']
 ];
 for(const [id,kind] of configs){
  const input=document.getElementById(id);
  if(!input)continue;
  input.onchange=function(){
   try{
    if(typeof window.startSelectedDocumentUpload!=='function')throw new Error('De documentscanner kon niet worden gestart. Vernieuw Boekuna en probeer opnieuw.');
    void window.startSelectedDocumentUpload(input,kind);
   }catch(err){
    console.error('Upload bootstrap failed',err);
    if(typeof window.toast==='function')window.toast(err?.message||'Upload kon niet starten');
    else window.alert(err?.message||'Upload kon niet starten');
   }
  };
  input.dataset.uploadBound='true';
 }
})();
</script>
