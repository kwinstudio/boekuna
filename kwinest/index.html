function normalizeState(x){const base=structuredClone(DEFAULT),v=x&&x.meta?x:{},profile=loadProfile(),companyRaw={...base.company,...(v.company||{}),...profile};companyRaw.emailTemplate={...DEFAULT_EMAIL_TEMPLATE,...(v.company?.emailTemplate||{}),...(profile?.emailTemplate||{})};companyRaw.invoiceDesign={...DEFAULT_INVOICE_DESIGN,...(v.company?.invoiceDesign||{}),...(profile?.invoiceDesign||{})};const out={...base,...v,meta:{...base.meta,...(v.meta||{})},company:companyRaw};for(const k of ['contacts','invoices','expenses','transactions','hours','mileage','documents','bookings','plannedCash','settlements','audit'])if(!Array.isArray(out[k]))out[k]=[];return out}

function openLegacyFileDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('boekhouden-files-v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

async function migrateLegacyFilesToCloud(){if(!currentUser||!Array.isArray(state.documents))return 0;const sb=await getSupabase();let moved=0;for(const d of state.documents){if(!d.fileId)continue;const {data:exists,error}=await sb.from('documents').select('id').eq('user_id',currentUser.id).eq('client_ref',d.fileId).maybeSingle();if(error)throw error;if(exists)continue;const old=await getLegacyStoredFile(d.fileId);if(!old?.blob)continue;const file=new File([old.blob],old.name||d.name||'document',{type:old.type||old.blob.type||'application/octet-stream'});try{await putStoredFile(d.fileId,file);await deleteLegacyStoredFile(d.fileId);moved++}catch(e){console.warn('Legacy document niet gemigreerd',d.fileId,e)}}return moved}

async function hydrateCloudAccount(user){currentUser={id:user.id,email:user.email||'',supabaseUser:user};state=load();const sb=await getSupabase();const [{data:profileRow,error:profileErr},{data:ledgerRow,error:ledgerErr}]=await Promise.all([sb.from('profiles').select('company').eq('user_id',user.id).maybeSingle(),sb.from('ledger_state').select('state,version').eq('user_id',user.id).maybeSingle()]);if(profileErr)throw profileErr;if(ledgerErr)throw ledgerErr;cloudVersion=Number(ledgerRow?.version||1);const cloudState=ledgerRow?.state&&Object.keys(ledgerRow.state).length?ledgerRow.state:null;const legacy=!cloudState?legacySnapshotForEmail(user.email):null;state=normalizeState(cloudState||legacy||{});if(profileRow?.company)state.company={...state.company,...profileRow.company};localStorage.setItem(userDataKey(),JSON.stringify(state));localStorage.setItem(userProfileKey(),JSON.stringify(state.company||{}));if(!cloudState){await syncCloudProfile(state.company);await syncCloudStateNow();if(legacy){const moved=await migrateLegacyFilesToCloud();clearLegacyLocalAccount(user.email);toast(`Je bestaande administratie is naar de cloud gekopieerd${moved?` · ${moved} document(en) meegenomen`:''}`)}}setCloudSyncStatus('saved')}

function invoiceEffectiveStatus(i){if(!i)return 'draft';if(i.status==='draft')return 'draft';const paid=invoicePaidAmount(i),out=invoiceOutstanding(i);if(out<=0.02&&Math.abs(invoiceGross(i))>0)return 'paid';if(paid>0&&out>0.02)return 'partial';if(i.dueDate&&i.dueDate<today())return 'overdue';return i.status||'sent'}
function daysUntil(d){if(!d)return 9999;const a=new Date(today()+'T12:00:00'),b=new Date(d+'T12:00:00');return Math.ceil((b-a)/86400000)}
function cashBalance(){return state.transactions.reduce((s,t)=>s+Number(t.amount||0),0)}
function quarterVatPosition(){const q=currentQuarter(),out=state.invoices.filter(i=>i.status!=='draft'&&inQuarter(i.issueDate,q)).reduce((s,i)=>s+invoiceVat(i),0),input=state.expenses.filter(e=>inQuarter(e.date,q)).reduce((s,e)=>s+expenseVat(e),0);return state.company.kor?0:Math.max(0,out-input)}

function dataHealthIssues(){const issues=[];const nums={};for(const i of state.invoices){nums[i.number]=(nums[i.number]||0)+1;if(i.status!=='draft'&&Math.abs(invoiceGross(i))<.01)issues.push({severity:'warn',title:`${i.number}: bedrag is €0`,detail:'Controleer de factuurregels.',page:'invoices'});if(invoicePaidAmount(i)-Math.abs(invoiceGross(i))>.02)issues.push({severity:'bad',title:`${i.number}: overbetaling`,detail:`Betaald ${money(invoicePaidAmount(i))} op ${money(Math.abs(invoiceGross(i)))}`,page:'invoices'});if(i.issueDate&&i.dueDate&&i.dueDate<i.issueDate)issues.push({severity:'bad',title:`${i.number}: onlogische datums`,detail:'Vervaldatum ligt vóór de factuurdatum.',page:'invoices'})}for(const [n,c] of Object.entries(nums))if(n&&c>1)issues.push({severity:'bad',title:`Dubbel factuurnummer ${n}`,detail:`${c} facturen gebruiken hetzelfde nummer.`,page:'invoices'});for(const e of state.expenses)if(Number(e.exVat)<0)issues.push({severity:'warn',title:`Negatieve kosten bij ${e.vendor}`,detail:'Controleer of dit een correctie/credit hoort te zijn.',page:'expenses'});const badContacts=state.contacts.filter(c=>c.type==='customer'&&(!c.name||!c.address||!c.postal||!c.city));if(badContacts.length)issues.push({severity:'warn',title:`${badContacts.length} klant(en) met onvolledig adres`,detail:'Kan problemen geven op facturen.',page:'contacts'});if(!profileEssentialsComplete(state.company))issues.push({severity:'bad',title:'Bedrijfsprofiel onvolledig',detail:'Vul verplichte bedrijfsgegevens aan.',page:'profile'});return issues}
function randomSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
function hexToBytes(hex){return new Uint8Array((hex.match(/.{1,2}/g)||[]).map(x=>parseInt(x,16)))}
function bufferToHex(buf){return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('')}
async function hashPassword(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexToBytes(salt),iterations:150000,hash:'SHA-256'},key,256);return bufferToHex(bits)}

function invoiceSign(i){return i?.kind==='credit'?-1:1}
function invoiceNet(i){const raw=i.importedTotals?.net!=null?Math.abs(Number(i.importedTotals.net)):i.lines.reduce((s,l)=>s+Number(l.qty)*Number(l.unit),0);return raw*invoiceSign(i)}
function invoiceVat(i){const raw=i.importedTotals?.vat!=null?Math.abs(Number(i.importedTotals.vat)):i.lines.reduce((s,l)=>s+(Number(l.qty)*Number(l.unit)*(Number(l.vat)||0)/100),0);return raw*invoiceSign(i)}
function invoiceGross(i){const raw=i.importedTotals?.gross!=null?Math.abs(Number(i.importedTotals.gross)):Math.abs(invoiceNet(i))+Math.abs(invoiceVat(i));return raw*invoiceSign(i)}
function invoicePayments(i){return Array.isArray(i?.payments)?i.payments:[]}
function invoicePaidAmount(i){const manual=invoicePayments(i).reduce((s,p)=>s+Math.abs(Number(p.amount||0)),0),bank=state.transactions.filter(t=>t.status==='matched'&&t.matchType==='invoice'&&t.matchId===i.id).reduce((s,t)=>s+Math.abs(Number(t.amount||0)),0);if(!manual&&!bank&&i?.selfBilling&&i?.status==='paid'&&Number(i.payout||0)>0)return Math.abs(invoiceGross(i));return manual+bank}
function invoiceOutstanding(i){return Math.max(0,Math.abs(invoiceGross(i))-invoicePaidAmount(i))}
function syncInvoiceStatus(i){if(!i||i.status==='draft')return;if(invoiceOutstanding(i)<=0.02){i.status='paid';if(!i.paidDate)i.paidDate=today()}else{if(i.status==='paid')i.status='sent';delete i.paidDate}}
function expenseVat(e){return e.vatAmount!=null?Number(e.vatAmount):Number(e.exVat)*Number(e.vatRate||0)/100}
function expenseGross(e){return e.gross!=null?Number(e.gross):Number(e.exVat)+expenseVat(e)}
function inQuarter(date,q){const d=new Date(date+'T12:00:00'),year=d.getFullYear(),m=d.getMonth()+1;return year===2026 && Math.ceil(m/3)===q}
function currentQuarter(){return Math.min(4,Math.ceil((new Date().getMonth()+1)/3))}

async function openSendInvoice(id){const i=state.invoices.find(x=>x.id===id);if(!i)return;const c=getContact(i.customerId),checks=invoiceChecks({...i,customer:c,paymentDays:i.paymentDays||0});checks.errors=checks.errors.filter(x=>x.label!=='Uniek factuurnummer');if(i.kind!=='credit'&&!state.company.iban)checks.errors.push({label:'IBAN',msg:'Vul je IBAN in bij Instellingen voordat je een factuur verstuurt.'});if(!state.company.email)checks.errors.push({label:'Bedrijfse-mail',msg:'Vul je bedrijfse-mailadres in bij Instellingen; antwoorden op de factuurmail komen daar binnen.'});if(checks.errors.length){modal('Factuur nog niet klaar voor verzending',`<div class="notice warn"><strong>Deze factuur mist verplichte gegevens.</strong> Corrigeer de volgende punten voordat je hem verstuurt.</div><div class="legal-list" style="margin-top:12px">${checks.errors.map(x=>`<div class="legal-item"><strong>${esc(x.label)}</strong><p>${esc(x.msg)}</p></div>`).join('')}</div>`,`<button class="btn" onclick="closeModal()">Sluiten</button>`);return}
 pendingSendInvoiceId=id;pendingSendRequestId=uid('send');const docLabel=i.kind==='credit'?'Creditfactuur':'Factuur',subject=invoiceMailSubject(i,c);modal(`Verstuur ${docLabel.toLowerCase()} ${esc(i.number)}`,`<div class="notice info" id="emailServiceNotice"><strong>E-mailverbinding controleren…</strong></div><form id="sendInvoiceForm" class="form-grid" style="margin-top:14px"><div class="field full"><label>Ontvanger *</label><input name="to" type="email" value="${esc(c.email||'')}" required placeholder="administratie@klant.nl"><div class="help">Controleer dit adres goed. De PDF-factuur wordt hierheen verzonden.</div></div><div class="field full"><label>Onderwerp *</label><input name="subject" value="${esc(subject)}" required></div><div class="field full"><label>Bericht *</label><textarea name="message" style="min-height:210px" required>${esc(defaultInvoiceEmailMessage(i,c))}</textarea></div><div class="field full"><label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0"><input type="checkbox" name="ccSelf" style="width:auto" ${state.company.email?'checked':''}> Stuur een kopie naar ${esc(state.company.email||'mijn bedrijfse-mail')}</label></div></form><div class="review-grid" style="margin-top:12px"><div class="review-card"><h4>PDF-bijlage</h4><div class="help"><strong>${i.kind==='credit'?'Creditfactuur':'Factuur'}-${esc(i.number)}.pdf</strong><br>Professionele A4-factuur met klant-, bedrijfs-, btw- en betalingsgegevens.</div></div><div class="review-card"><h4>Verzendcontrole</h4><div class="help">Totaal: <strong>${money(invoiceGross(i))}</strong><br>Vervaldatum: ${dateNL(i.dueDate)}<br>Reply-to: ${esc(state.company.email||'niet ingesteld')}</div></div></div>`,`<button class="btn" onclick="closeModal();pendingSendInvoiceId=null">Annuleren</button><button class="btn primary" id="sendInvoiceButton" onclick="sendInvoiceEmail()">${i.kind==='credit'?'Verstuur creditfactuur':'Verstuur factuur'}</button>`,true);checkInvoiceEmailService() async function checkInvoiceEmailService(){const n=document.getElementById('emailServiceNotice');if(!n)return;try{const r=await fetch(EDGE_BASE+'/send-invoice',{cache:'no-store'}),j=await r.json();if(j.configured)n.innerHTML='<strong>E-mailverzending is gekoppeld.</strong> Na bevestiging wordt de factuur direct met PDF-bijlage verstuurd.';else{n.className='notice warn';n.innerHTML='<strong>E-mailprovider nog niet gekoppeld.</strong> De verstuurfunctie staat klaar, maar Vercel heeft nog RESEND_API_KEY en INVOICE_FROM_EMAIL nodig.'}}catch(e){n.className='notice warn';n.innerHTML='<strong>E-mailstatus kon niet worden gecontroleerd.</strong> Probeer het later opnieuw.'}}
async function sendInvoiceEmail(){const i=state.invoices.find(x=>x.id===pendingSendInvoiceId),f=document.getElementById('sendInvoiceForm'),btn=document.getElementById('sendInvoiceButton');if(!i||!f||!f.reportValidity())return;const c=getContact(i.customerId),d=new FormData(f),to=String(d.get('to')||'').trim(),subject=String(d.get('subject')||'').trim(),message=String(d.get('message')||'').trim();if(!to||!subject||!message)return toast('Controleer ontvanger, onderwerp en bericht');btn.disabled=true;btn.textContent='Versturen…';try{const r=await fetch(EDGE_BASE+'/send-invoice',{method:'POST',headers:await apiAuthHeaders({'Content-Type':'application/json'}),body:JSON.stringify({requestId:pendingSendRequestId,to,subject,message,ccSelf:d.get('ccSelf')==='on',company:state.company,customer:{...c,email:to},invoice:i})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.details?.join(' ')||j.error||'Versturen mislukt');if(!c.email)c.email=to;else if(c.email!==to)c.email=to;i.lastSentAt=j.sentAt||new Date().toISOString();i.lastSentTo=to;i.sendProviderId=j.id||'';i.sendHistory=[...(i.sendHistory||[]),{sentAt:i.lastSentAt,to,subject,providerId:j.id||''}];if(i.status==='draft')i.status='sent';save();pendingSendInvoiceId=null;pendingSendRequestId=null;closeModal();toast(`Factuur ${i.number} is verstuurd naar ${to}`);render()}catch(e){toast(e.message||'Factuur kon niet worden verstuurd');btn.disabled=false;btn.textContent='Verstuur factuur'}}

function normalizeInvoiceText(s){return String(s||'').replace(/\u00a0/g,' ').replace(/[‐‑‒–—]/g,'-').replace(/[“”]/g,'"').replace(/[’]/g,"'").replace(/[ \t]+/g,' ').replace(/\n[ \t]+/g,'\n').trim()}
function groupPdfTextItems(items){
 const clean=items.filter(x=>x.str&&x.str.trim()).map(x=>({s:normalizeInvoiceText(x.str),x:Number(x.transform?.[4]||0),y:Number(x.transform?.[5]||0),w:Number(x.width||0)}));
 clean.sort((a,b)=>Math.abs(b.y-a.y)>2.7?b.y-a.y:a.x-b.x);
 const rows=[];
 for(const it of clean){let row=rows.find(r=>Math.abs(r.y-it.y)<=2.7);if(!row){row={y:it.y,items:[]};rows.push(row)}row.items.push(it)}
 rows.sort((a,b)=>b.y-a.y);
 return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(x=>x.s).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean)
}
async function readPdfStructure(file){
 const pdfjs=await loadPdfLib(),data=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjs.getDocument({data}).promise,pages=[];
 for(let p=1;p<=Math.min(pdf.numPages,30);p++){const pg=await pdf.getPage(p),tc=await pg.getTextContent({includeMarkedContent:false}),lines=groupPdfTextItems(tc.items);pages.push({page:p,lines,text:lines.join('\n'),chars:lines.join(' ').length})}
 let attachments=[];try{const a=await pdf.getAttachments?.();if(a)attachments=Object.values(a).map(x=>({name:x.filename||'',content:x.content||null}))}catch(e){console.warn('PDF attachments',e)}
 return {pdf,pages,text:pages.map(x=>x.text).join('\n\n'),attachments,numPages:pdf.numPages}
}
function decodeAttachmentText(content){try{return new TextDecoder('utf-8').decode(content)}catch(e){try{return new TextDecoder('windows-1252').decode(content)}catch(_){return ''}}}
function xmlByLocal(root,name){return [...root.getElementsByTagName('*')].filter(x=>x.localName===name)}
function xmlFirst(root,names){for(const n of names){const el=xmlByLocal(root,n)[0];if(el?.textContent?.trim())return el.textContent.trim()}return ''}
function xmlParty(root,kind){
 const node=xmlByLocal(root,kind)[0];if(!node)return {};
 const name=xmlFirst(node,['RegistrationName','Name']);
 const email=xmlFirst(node,['ElectronicMail','URI']);
 const vatId=xmlByLocal(node,'CompanyID').map(x=>x.textContent.trim()).find(x=>/[A-Z]{2}.?\d/i.test(x))||'';
 const companyIds=xmlByLocal(node,'CompanyID').map(x=>x.textContent.trim());
 const kvk=companyIds.find(x=>/^\d{8}$/.test(x.replace(/\D/g,'')))||'';
 const address=xmlFirst(node,['StreetName']);const add=xmlFirst(node,['AdditionalStreetName']);
 const house=xmlFirst(node,['BuildingNumber']);
 const postal=xmlFirst(node,['PostalZone']);const city=xmlFirst(node,['CityName']);
 return {party:name,email,vatId,kvk,address:[address,house,add].filter(Boolean).join(' ').trim(),postal,city}
}
function parseEmbeddedInvoiceXml(xml,forced='auto'){
 try{
  const doc=new DOMParser().parseFromString(xml,'application/xml');if(doc.querySelector('parsererror'))return null;
  const root=doc.documentElement;
  const supplier=xmlParty(root,'AccountingSupplierParty'),customer=xmlParty(root,'AccountingCustomerParty');
  const ownVat=String(state.company.vat||'').replace(/\s/g,'').toUpperCase(),ownName=String(state.company.name||'').trim().toLowerCase();
  const suppOwn=(supplier.vatId||'').replace(/\s/g,'').toUpperCase()===ownVat&&ownVat||ownName&&supplier.party?.toLowerCase().includes(ownName);
  const custOwn=(customer.vatId||'').replace(/\s/g,'').toUpperCase()===ownVat&&ownVat||ownName&&customer.party?.toLowerCase().includes(ownName);
  const type=forced!=='auto'?forced:(suppOwn?'sale':custOwn?'purchase':'purchase');
  const party=type==='sale'?customer:supplier;
  const net=parseMoneyValue(xmlFirst(root,['TaxExclusiveAmount','LineTotalAmount']));
  const vat=parseMoneyValue(xmlFirst(root,['TaxAmount','TaxTotalAmount']));
  const gross=parseMoneyValue(xmlFirst(root,['PayableAmount','TaxInclusiveAmount','GrandTotalAmount']));
  const rates=xmlByLocal(root,'Percent').map(x=>Number(String(x.textContent).replace(',','.'))).filter(Number.isFinite);
  const invoiceNumber=xmlFirst(root,['ID']);
  const issueDate=parseLooseDate(xmlFirst(root,['IssueDate','DateTimeString']));
  const dueDate=parseLooseDate(xmlFirst(root,['DueDate','PaymentDueDate']));
  const iban=xmlByLocal(root,'ID').map(x=>x.textContent.trim().replace(/\s/g,'')).find(x=>/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(x))||'';
  const ref=xmlFirst(root,['PaymentID','BuyerReference','OrderReference']);
  if(!invoiceNumber&&!party.party&&gross==null)return null;
  return {type,...party,invoiceNumber,issueDate,dueDate,net:net??'',vatAmount:vat??'',gross:gross??'',vatRate:rates.includes(21)?21:rates.includes(9)?9:rates[0]??'',mixedRates:new Set(rates.filter(x=>x>=0)).size>1,iban,paymentReference:ref,description:'Geïmporteerde e-factuur',sourceQuality:'embedded-xml',confidenceScore:98,fieldConfidence:{party:98,invoiceNumber:99,issueDate:99,net:98,vatAmount:98,gross:98}}
 }catch(e){console.warn('XML invoice parse',e);return null}
}
function findEmbeddedInvoice(structure,forced){
 for(const a of structure.attachments||[]){if(!a.content||!/(\.xml$|ubl|factur|zugferd)/i.test(a.name||''))continue;const parsed=parseEmbeddedInvoiceXml(decodeAttachmentText(a.content),forced);if(parsed)return parsed}
 return null
}

function printReport(){const {from,to}=reportRange(),invs=state.invoices.filter(i=>i.status!=='draft'&&inRange(i.issueDate,from,to)),exps=state.expenses.filter(e=>inRange(e.date,from,to)),sales=invs.reduce((s,i)=>s+invoiceNet(i),0),vatOut=invs.reduce((s,i)=>s+invoiceVat(i),0),costs=exps.reduce((s,e)=>s+Number(e.exVat),0),vatIn=exps.reduce((s,e)=>s+expenseVat(e),0),profit=sales-costs,open=state.invoices.filter(i=>i.status!=='draft'&&i.kind!=='credit').reduce((s,i)=>s+invoiceOutstanding(i),0),company=state.company,cats={};exps.forEach(e=>cats[e.category]=(cats[e.category]||0)+Number(e.exVat));const w=window.open('','_blank');if(!w)return toast('Pop-up geblokkeerd; sta pop-ups toe voor PDF');const rows=Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${money(v)}</td></tr>`).join('');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Boekhoudrapport ${from} - ${to}</title><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#14201d;margin:0;font-size:10.5pt}h1{font-size:24pt;margin:0 0 4px}h2{font-size:13pt;margin:22px 0 8px}p{margin:3px 0}.muted{color:#68736f}.head{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #14201d;padding-bottom:14px}.brand{text-align:right;font-size:9.5pt}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.k{border:1px solid #dfe5e2;border-radius:8px;padding:10px}.k span{display:block;color:#68736f;font-size:8pt;text-transform:uppercase}.k b{display:block;font-size:14pt;margin-top:4px}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid #e4e9e6;text-align:left}.tbl th{font-size:8pt;text-transform:uppercase;color:#68736f}.r{text-align:right!important}.summary{width:100%;max-width:360px;margin-left:auto}.summary div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e4e9e6}.summary .total{font-size:12pt;font-weight:700;border-top:2px solid #14201d}.footer{margin-top:28px;padding-top:10px;border-top:1px solid #dfe5e2;color:#68736f;font-size:8pt}.pagebreak{break-before:page}@media print{button{display:none}}</style></head><body><div class="head"><div><h1>Boekhoudrapport</h1><p class="muted">${dateNL(from)} – ${dateNL(to)}</p></div><div class="brand"><b>${esc(company.name||'Bedrijf')}</b><br>${esc(company.address||'')} ${esc(company.postal||'')} ${esc(company.city||'')}<br>${company.kvk?`KVK ${esc(company.kvk)}<br>`:''}${company.vat?`BTW ${esc(company.vat)}<br>`:''}${company.iban?`IBAN ${esc(company.iban)}`:''}</div></div><div class="kpis"><div class="k"><span>Omzet excl. btw</span><b>${money(sales)}</b></div><div class="k"><span>Kosten excl. btw</span><b>${money(costs)}</b></div><div class="k"><span>Resultaat</span><b>${money(profit)}</b></div><div class="k"><span>Openstaand</span><b>${money(open)}</b></div></div><h2>Winst & verlies</h2><div class="summary"><div><span>Omzet excl. btw</span><b>${money(sales)}</b></div><div><span>Kosten excl. btw</span><b>− ${money(costs)}</b></div><div class="total"><span>Resultaat</span><b>${money(profit)}</b></div></div><h2>Btw-overzicht periode</h2><div class="summary"><div><span>Verschuldigde btw</span><b>${money(vatOut)}</b></div><div><span>Voorbelasting</span><b>− ${money(vatIn)}</b></div><div class="total"><span>Saldo</span><b>${money(vatOut-vatIn)}</b></div></div><h2>Kosten per categorie</h2><table class="tbl"><thead><tr><th>Categorie</th><th class="r">Excl. btw</th></tr></thead><tbody>${rows||'<tr><td colspan="2">Geen kosten in deze periode</td></tr>'}</tbody></table><div class="pagebreak"></div><h2>Verkoopfacturen</h2><table class="tbl"><thead><tr><th>Nr.</th><th>Klant</th><th>Datum</th><th>Status</th><th class="r">Excl.</th><th class="r">Btw</th><th class="r">Incl.</th></tr></thead><tbody>${invs.map(i=>`<tr><td>${esc(i.number)}</td><td>${esc(getContact(i.customerId).name)}</td><td>${dateNL(i.issueDate)}</td><td>${invoiceEffectiveStatus(i)}</td><td class="r">${money(invoiceNet(i))}</td><td class="r">${money(invoiceVat(i))}</td><td class="r">${money(invoiceGross(i))}</td></tr>`).join('')||'<tr><td colspan="7">Geen verkoopfacturen</td></tr>'}</tbody></table><h2>Inkoop & kosten</h2><table class="tbl"><thead><tr><th>Datum</th><th>Leverancier</th><th>Categorie</th><th class="r">Excl.</th><th class="r">Btw</th><th class="r">Incl.</th></tr></thead><tbody>${exps.map(e=>`<tr><td>${dateNL(e.date)}</td><td>${esc(e.vendor)}</td><td>${esc(e.category)}</td><td class="r">${money(e.exVat)}</td><td class="r">${money(expenseVat(e))}</td><td class="r">${money(expenseGross(e))}</td></tr>`).join('')||'<tr><td colspan="6">Geen kosten</td></tr>'}</tbody></table><div class="footer">Gegenereerd op ${new Date().toLocaleString('nl-NL')}. Controleer de administratie vóór formele aangiften of jaarstukken.</div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
async function deleteStoredFile(id){if(!id||!currentUser)return;try{const sb=await getSupabase();const {data:meta,error}=await sb.from('documents').select('storage_path').eq('user_id',currentUser.id).eq('client_ref',id).maybeSingle();if(error)throw error;if(meta?.storage_path)await sb.storage.from('kwinest-documents').remove([meta.storage_path]);await sb.from('documents').delete().eq('user_id',currentUser.id).eq('client_ref',id)}catch(e){console.warn(e)}}
function deleteAccountDialog(){modal('Account definitief verwijderen',`<div class="notice warn" style="margin-bottom:14px"><strong>Dit kan niet ongedaan worden gemaakt.</strong> Je cloudaccount, administratie, bedrijfsprofiel en alle privé-documenten worden definitief verwijderd.</div><form id="deleteAccountForm" class="form-grid"><div class="field full"><label>Wachtwoord *</label><input name="password" type="password" required></div><div class="field full"><label>Typ VERWIJDER *</label><input name="confirm" required autocomplete="off"></div></form>`,`<button class="btn" onclick="closeModal()">Annuleren</button><button class="btn danger" onclick="deleteAccountNow()">Definitief verwijderen</button>`)}
async function deleteAccountNow(){const f=document.getElementById('deleteAccountForm');if(!f?.reportValidity()||!currentUser)return;const d=new FormData(f),password=String(d.get('password')||'');if(String(d.get('confirm')||'').trim().toUpperCase()!=='VERWIJDER')return toast('Typ VERWIJDER om te bevestigen');try{const sb=await getSupabase();const {error:reauthError}=await sb.auth.signInWithPassword({email:currentUser.email,password});if(reauthError)throw new Error('Wachtwoord is niet correct');const {error}=await sb.functions.invoke('delete-account',{body:{confirm:true}});if(error)throw error;const old=currentUser;localStorage.removeItem(DATA_KEY_PREFIX+old.id);localStorage.removeItem(PROFILE_KEY_PREFIX+old.id);const legacy=getUsers().find(u=>String(u.email||'').toLowerCase()===String(old.email||'').toLowerCase());if(legacy){localStorage.removeItem(DATA_KEY_PREFIX+legacy.id);localStorage.removeItem(PROFILE_KEY_PREFIX+legacy.id);saveUsers(getUsers().filter(u=>u.id!==legacy.id))}currentUser=null;state=structuredClone(DEFAULT);closeModal();showAuth('login');toast('Account en cloudgegevens definitief verwijderd')}catch(err){toast(err?.message||'Account kon niet worden verwijderd')}}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>b.dataset.page&&navigate(b.dataset.page)));document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('quickNew').addEventListener('click',quickMenu);document.getElementById('globalSearch').addEventListener('input',e=>{search=e.target.value;render()});document.getElementById('invoicePdfFile').addEventListener('change',handleInvoicePdfFile);window.addEventListener('online',()=>{setCloudSyncStatus('saving');syncCloudStateNow().catch(()=>setCloudSyncStatus('error'))});window.addEventListener('offline',()=>setCloudSyncStatus('offline'));initAuth();
</script>
