/* document review: desktop keeps split preview; mobile becomes a four-step flow */
.document-review-flow{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:16px;align-items:start}
.document-review-fields{min-width:0}
.review-step{margin-bottom:18px}

.document-review-fields{grid-column:2}
.review-step-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 12px}
.review-step-head h4{font-size:17px;letter-spacing:-.02em;margin:2px 0 0}

.review-step-grid{margin-bottom:12px}

.review-settlement-card{border:1px solid #dbe6e1;border-radius:13px;padding:11px 12px;background:#f7faf8;margin-bottom:12px}
.review-money-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0}.review-money-row small{grid-column:1/-1;color:var(--muted);font-size:9px}.review-money-row.total{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.review-check-summary{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:12px}.review-check-line{display:flex;gap:9px;padding:10px 11px;border-bottom:1px solid #edf1ef}.review-check-line:last-child{border-bottom:0}.review-check-line strong{display:block;font-size:11px}.review-check-line span:not(.check-icon){display:block;font-size:10px;color:var(--muted);line-height:1.4;margin-top:2px}
.review-save-summary{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px;background:#f7f9f8;display:grid;grid-template-columns:1fr auto;gap:3px 10px}.review-save-summary span{font-size:11px;font-weight:750}.review-save-summary strong{font-size:18px}.review-save-summary small{grid-column:1/-1;color:var(--muted)}
.review-details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0 12px;background:#fff}.review-details>summary{cursor:pointer;font-size:11px;font-weight:800;color:#43554f}.review-technical-body{display:grid;gap:8px;margin-top:10px}.review-technical pre{white-space:pre-wrap;font:10px/1.5 ui-monospace,monospace;background:#f6f8f7;padding:10px;border-radius:9px;max-height:220px;overflow:auto}

.product-proof,.product-crop,.product-mobile{margin:0;position:relative}
.product-proof{width:min(1120px,100%);margin-inline:auto;border:1px solid #E1E8E5;border-radius:20px;background:#fff;box-shadow:0 18px 52px rgba(20,43,51,.09);overflow:hidden}

.product-crop{--product-max:760px;width:min(var(--product-max),100%);border:1px solid #E1E8E5;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(20,43,51,.07);overflow:hidden}

/* Document processing experience */
.processing-experience{--pe-accent:var(--primary);display:grid;gap:18px;min-width:0}
.processing-shell{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:22px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#fff,rgba(247,250,249,.92))}
.processing-document{position:relative;overflow:hidden;min-height:210px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px 16px;box-shadow:0 12px 30px rgba(21,38,35,.07)}
.processing-doc-mark{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.processing-doc-line{height:8px;border-radius:999px;background:#e9efed;margin:9px 0}
.processing-doc-line.short{width:58%}.processing-doc-line.medium{width:78%}
.processing-doc-total{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-weight:800}
.processing-scanline{position:absolute;left:10px;right:10px;top:20px;height:2px;background:var(--pe-accent);opacity:.42;box-shadow:0 0 12px rgba(33,94,79,.18);animation:documentScan 2.8s ease-in-out infinite}
.processing-copy{min-width:0}
.processing-eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.processing-title{font-size:22px;line-height:1.2;margin:0;color:var(--text)}
.processing-file{margin-top:7px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.processing-status{margin-top:16px;font-size:15px;font-weight:750;color:var(--text)}
.processing-subtext{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.45;min-height:38px}
.processing-progress{margin-top:15px}
.processing-progress progress,.processing-overall progress{display:block;width:100%;height:7px;appearance:none;border:0;border-radius:999px;overflow:hidden;background:#e8eeec}
.processing-progress progress::-webkit-progress-bar,.processing-overall progress::-webkit-progress-bar{background:#e8eeec;border-radius:999px}
.processing-progress progress::-webkit-progress-value,.processing-overall progress::-webkit-progress-value{background:var(--pe-accent);border-radius:999px}
.processing-progress progress::-moz-progress-bar,.processing-overall progress::-moz-progress-bar{background:var(--pe-accent);border-radius:999px}
.processing-indeterminate{height:7px;border-radius:999px;background:#e8eeec;overflow:hidden;position:relative}
.processing-indeterminate::after{content:"";position:absolute;inset:0 auto 0 -38%;width:38%;border-radius:inherit;background:var(--pe-accent);animation:documentIndeterminate 1.35s ease-in-out infinite}
.processing-bytes{display:flex;justify-content:space-between;gap:12px;margin-top:6px;color:var(--muted);font-size:12px}
.processing-steps{display:grid;gap:9px;margin-top:18px}
.processing-step{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:center;color:var(--muted);font-size:13px;line-height:1.35}

 document.getElementById('mainApp').style.display='none';const url=new URL(location.href),wantsLogin=url.searchParams.get('login')==='1',wantsRegister=url.searchParams.get('register')==='1',hashParams=new URLSearchParams((location.hash||'').replace(/^#/,'')),callbackType=hashParams.get('type')||url.searchParams.get('type')||'',callbackError=hashParams.get('error_code')||url.searchParams.get('error_code')||hashParams.get('error')||url.searchParams.get('error')||'',callbackDescription=hashParams.get('error_description')||url.searchParams.get('error_description')||'',isRecovery=callbackType==='recovery';

  sb.auth.onAuthStateChange((event,nextSession)=>{
   if(event==='PASSWORD_RECOVERY'){setTimeout(()=>{if(nextSession?.user)currentUser={id:nextSession.user.id,email:nextSession.user.email||'',supabaseUser:nextSession.user};showResetPassword()},0);return}
   if(event==='SIGNED_IN'&&nextSession?.user&&!authRecoveryActive){
    setTimeout(async()=>{try{if(!(await requireMfaForUser(nextSession.user))){await hydrateCloudAccount(nextSession.user);enterApp();if(callbackType==='signup'||callbackType==='email'){setPendingVerificationEmail('');toast('E-mailadres bevestigd. Welkom bij Boekuna.')}}}catch(err){console.error('Auth sign-in hydration failed',err);showAuth('login');authError(mapAuthError(err,'hydration'))}},0);return

function toCents(v){const n=Number(v||0);return Math.round((n+(n>=0?Number.EPSILON:-Number.EPSILON))*100)}

function allocateDiscountCents(amounts,discountCents){
 const total=amounts.reduce((sum,value)=>sum+value,0),discount=Math.min(Math.max(0,discountCents),Math.max(0,total));
 if(!discount||total<=0)return amounts.slice();
 const target=total-discount,parts=amounts.map((value,index)=>{const scaled=value*target/total;return {index,cents:Math.floor(scaled),remainder:scaled-Math.floor(scaled)}});
 let remainder=target-parts.reduce((sum,part)=>sum+part.cents,0);
 const order=parts.slice().sort((a,b)=>b.remainder-a.remainder||a.index-b.index);
 for(let index=0;index<remainder;index++)order[index%order.length].cents++;
 return parts.map(part=>part.cents);
}
function invoiceDiscountFactor(i){const base=invoiceDiscountBase(i);return base>0?(base-invoiceDiscountAmount(i))/base:1}

function discountedLineVat(i,l){return roundMoney(discountedLineNet(i,l)*Number(l?.vat||0)/100)}

function invoiceSign(i){return i?.kind==='credit'?-1:1}
function invoiceTaxTreatment(i){return String(i?.taxTreatment||'standard')}

function invoiceVat(i){if(isZeroOutputVatTreatment(invoiceTaxTreatment(i)))return 0;const raw=i?.importedTotals?.vat!=null?Math.abs(roundMoney(i.importedTotals.vat)):(i?.lines||[]).reduce((s,l)=>roundMoney(s+discountedLineVat(i,l)),0);return roundMoney(raw*invoiceSign(i))}

function expenseTaxTreatment(e){return String(e?.taxTreatment||'standard')}

 if(e?.vatAmount!=null)return roundMoney(e.vatAmount);
 const lines=Array.isArray(e?.vatLines)?e.vatLines:[],rates=[...new Set(lines.map(v=>Number(v?.rate)).filter(Number.isFinite))],mixed=!!e?.mixedRates||rates.length>1;

 return roundMoney(Number(e?.exVat||0)*scalar/100)

function listNormalize(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}
function listAmountText(v){

  return [compact,fixed,fixed.replace('.',','),money(n)].join(' ')

function listPeriodMatch(dateValue,period='all',from='',to=''){
  const d=String(dateValue||'').slice(0,10);if(!d||period==='all')return period==='all';
  if(period==='custom')return (!from||d>=from)&&(!to||d<=to);
  const now=new Date(),year=String(now.getFullYear()),month=String(now.getMonth()+1).padStart(2,'0');
  if(period==='year')return d.startsWith(year+'-');
  if(period==='month')return d.startsWith(year+'-'+month);
  if(period==='quarter'){const m=Number(d.slice(5,7)),q=Math.floor(now.getMonth()/3)+1;return d.startsWith(year+'-')&&Math.floor((m-1)/3)+1===q}
  return true
}

function invoiceListStatusMatch(i,status){
  if(status==='all')return true;
  if(status==='draft')return i.status==='draft';
  if(status==='overdue')return invoiceEffectiveStatus(i)==='overdue';
  if(status==='paid')return i.status!=='draft'&&invoiceEffectiveStatus(i)==='paid';
  if(status==='open')return i.status!=='draft'&&invoiceOutstanding(i)>.02;
  return true
}
function listMatchesFilters(name,item){
  const f=listPageState(name).filters||{};
  if(name==='invoices'){
    if(!invoiceListStatusMatch(item,f.status))return false;
    if(f.customer!=='all'&&item.customerId!==f.customer)return false;
    if(!listPeriodMatch(item.issueDate,f.period))return false;
    if(f.type==='invoice'&&item.kind==='credit')return false;
    if(f.type==='credit'&&item.kind!=='credit')return false;
    return true
  }
  if(name==='expenses'){
    if(f.vendor!=='all'&&String(item.vendor||'')!==f.vendor)return false;
    if(!listPeriodMatch(item.date,f.period))return false;
    if(f.category!=='all'&&String(item.category||'')!==f.category)return false;
    if(f.docType!=='all'&&expenseListType(item)!==f.docType)return false;
    return true
  }
  if(name==='bank'){
    if(f.status==='unmatched'&&item.status!=='unmatched')return false;
    if(f.status==='matched'&&item.status!=='matched')return false;
    if(f.direction==='income'&&Number(item.amount||0)<=0)return false;
    if(f.direction==='expense'&&Number(item.amount||0)>=0)return false;
    if(!listPeriodMatch(item.date,f.period))return false;
    return true
  }
  if(name==='contacts')return f.type==='all'||item.type===f.type;
  if(name==='services')return f.status==='all'||(f.status==='active'?item.active!==false:item.active===false);
  if(name==='documents'){
    if(f.linked==='linked'&&!item.linkedId)return false;
    if(f.linked==='unlinked'&&item.linkedId)return false;
    if(f.type!=='all'&&String(item.type||'')!==f.type)return false;
    if(f.status!=='all'&&documentListStatus(item)!==f.status)return false;
    if(!listPeriodMatch(item.date,f.period))return false;
    return true
  }
  if(name==='bookings'){
    if(f.status!=='all'&&item.status!==f.status)return false;
    const upcoming=String(item.date||'')>=today();
    if(f.time==='upcoming'&&!upcoming)return false;
    if(f.time==='past'&&upcoming)return false;
    if(!listPeriodMatch(item.date,f.period,f.from,f.to))return false;
    return true
  }
  return true
}
function listSortCompare(name,a,b){
  const sort=listPageState(name).sort||LIST_DEFAULTS[name]?.sort||'';
  const text=(x,y)=>String(x||'').localeCompare(String(y||''),'nl',{sensitivity:'base'});
  if(name==='invoices'){
    if(sort==='issue-asc')return text(a.issueDate,b.issueDate);
    if(sort==='due-asc')return text(a.dueDate,b.dueDate);
    if(sort==='amount-desc')return invoiceGross(b)-invoiceGross(a);
    if(sort==='amount-asc')return invoiceGross(a)-invoiceGross(b);
    if(sort==='customer-asc')return text(getContact(a.customerId).name,getContact(b.customerId).name);
    if(sort==='customer-desc')return text(getContact(b.customerId).name,getContact(a.customerId).name);
    return text(b.issueDate,a.issueDate)
  }
  if(name==='expenses'){
    if(sort==='date-asc')return text(a.date,b.date);
    if(sort==='vendor-asc')return text(a.vendor,b.vendor);
    if(sort==='vendor-desc')return text(b.vendor,a.vendor);
    if(sort==='amount-desc')return expenseGross(b)-expenseGross(a);
    if(sort==='amount-asc')return expenseGross(a)-expenseGross(b);
    return text(b.date,a.date)
  }
  if(name==='bank'){
    if(sort==='date-asc')return text(a.date,b.date);

function newService(editId=''){const s=editId?(state.services||[]).find(x=>x.id===editId):null;modal(s?'Dienst bewerken':'Nieuwe dienst',`<form id="serviceForm" class="form-grid"><div class="field full"><label>Naam *</label><input name="name" value="${esc(s?.name||'')}" placeholder="Bijv. Consultancy" required maxlength="100"></div><div class="field full"><label>Omschrijving op factuur</label><input name="description" value="${esc(s?.description||'')}" placeholder="Bijv. Strategisch advies en uitvoering"></div><div class="field"><label>Prijs excl. btw *</label><input name="price" type="number" min="0" step="0.01" value="${Number(s?.price||0)}" required></div><div class="field"><label>Eenheid *</label><select name="unitLabel"><option value="uur" ${s?.unitLabel==='uur'?'selected':''}>uur</option><option value="stuk" ${!s||s?.unitLabel==='stuk'?'selected':''}>stuk</option><option value="dag" ${s?.unitLabel==='dag'?'selected':''}>dag</option><option value="maand" ${s?.unitLabel==='maand'?'selected':''}>maand</option><option value="project" ${s?.unitLabel==='project'?'selected':''}>project</option><option value="sessie" ${s?.unitLabel==='sessie'?'selected':''}>sessie</option><option value="pakket" ${s?.unitLabel==='pakket'?'selected':''}>pakket</option></select></div><div class="field"><label>Btw *</label><select name="vat"><option value="21" ${Number(s?.vat??21)===21?'selected':''}>21%</option><option value="9" ${Number(s?.vat)===9?'selected':''}>9%</option><option value="0" ${Number(s?.vat)===0?'selected':''}>0%</option></select></div><div class="field"><label>Status</label><select name="active"><option value="true" ${s?.active!==false?'selected':''}>Actief</option><option value="false" ${s?.active===false?'selected':''}>Inactief</option></select></div></form>`,`<button class="btn" onclick="closeModal()">Annuleren</button>${s?`<button class="btn danger" onclick="deleteService('${s.id}')">Verwijder</button>`:''}<button class="btn primary" onclick="saveService('${editId} <script id="boekuna-native-email-share">
(function(){
  'use strict';

  var prepared=null,preparingInvoiceId=null,shareInFlight=false;

  function cleanHeader(value,max){
    return String(value==null?'':value).replace(/[\r\n]+/g,' ').trim().slice(0,max||240);
  }

  function sanitizeInvoiceShareFilenamePart(value,max){
    return String(value==null?'':value)
      .normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\./g,'')
      .replace(/[^a-zA-Z0-9_-]+/g,'-')
      .replace(/^-+|-+$/g,'')
      .replace(/-+/g,'-')
      .slice(0,max||80);
  }

  function invoiceShareFilename(invoice,customer){
    var label=invoice&&invoice.kind==='credit'?'Creditnota':'Factuur';
    var number=sanitizeInvoiceShareFilenamePart(invoice&&invoice.number,80)||'zonder-nummer';
    var party=sanitizeInvoiceShareFilenamePart(customer&&customer.name,72);
    return [label,number,party].filter(Boolean).join('-')+'.pdf';
  }

  function isInvoiceShareEmail(value){
    var email=String(value==null?'':value).trim();
    return email.length<=240 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && !/[\r\n]/.test(email);
  }

  function invoiceShareSubject(invoice,customer){
    return cleanHeader(invoiceMailSubject(invoice,customer),240);
  }

  function invoiceShareBody(invoice,customer){
    return String(defaultInvoiceEmailMessage(invoice,customer)||'').replace(/\r\n?/g,'\n').trim().slice(0,12000);
  }

  function buildInvoiceMailto(to,subject,body){
    if(!isInvoiceShareEmail(to))throw new Error('Ongeldig e-mailadres.');
    return 'mailto:'+encodeURIComponent(String(to).trim())+
      '?subject='+encodeURIComponent(cleanHeader(subject,240))+
      '&body='+encodeURIComponent(String(body||'').replace(/\r\n?/g,'\n'));
  }

  function canNativeShareInvoiceFile(file){
    try{
      return !!(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]}));
    }catch(_err){
      return false;
    }
  }

  function invoiceShareLog(invoice,channel,confirmed){
    logEvent(
      confirmed?'Factuur verzending bevestigd':'Factuur deelactie gestart',
      String(invoice.number||'')+' · '+channel,
      'invoice',
      invoice.id
    );
    save();
  }

  async function fetchInvoiceSharePdf(invoice,customer){
    var response=await fetch(EDGE_BASE+'/send-invoice',{
      method:'POST',
      headers:await apiAuthHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({action:'render_pdf',company:state.company,customer:customer,invoice:invoice})
    });
    if(!response.ok){
      var error=await response.json().catch(function(){return {};});
      if(response.status===401)throw new Error('Je sessie is verlopen. Log opnieuw in en probeer opnieuw.');
      if(response.status===403)throw new Error('Je hebt geen toegang tot deze factuur.');
      if(response.status>=500)throw new Error('De factuur-PDF kon tijdelijk niet worden gemaakt. Probeer opnieuw.');
      throw new Error(error.error||'De definitieve factuur-PDF kon niet worden gemaakt.');
    }
    var buffer=await response.arrayBuffer();
    var bytes=new Uint8Array(buffer);
    if(bytes.length<5 || bytes[0]!==0x25 || bytes[1]!==0x50 || bytes[2]!==0x44 || bytes[3]!==0x46){
      throw new Error('De gegenereerde factuur is geen geldige PDF.');
    }
    return new File([buffer],invoiceShareFilename(invoice,customer),{type:'application/pdf'});
  }

  function downloadInvoiceShareFile(file){
    if(!file)return false;
    var url=URL.createObjectURL(file);
    try{
      var anchor=document.createElement('a');
      anchor.href=url;
      anchor.download=file.name;
      anchor.rel='noopener';
      anchor.style.display='none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      return true;
    }finally{
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
    }
  }

  async function copyInvoiceShareValue(kind){
    if(!prepared)return;
    var value=kind==='subject'?prepared.subject:prepared.body;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(value);
      }else{
        var area=document.createElement('textarea');
        area.value=value;
        area.setAttribute('readonly','');
        area.style.position='fixed';
        area.style.opacity='0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      toast(kind==='subject'?'Onderwerp gekopieerd':'Bericht gekopieerd');
    }catch(_err){
      toast('Kopiëren lukte niet. Selecteer de tekst handmatig in je e-mailapp.');
    }
  }

  function showInvoiceShareConfirmation(id,channel){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    modal(
      'Heb je de factuur verzonden?',
      '<div class="notice info"><strong>Boekuna kan niet zien of je in je e-mailapp op Verzenden hebt gedrukt.</strong><br>Bevestig dit alleen als je de factuur echt hebt verstuurd.</div>',
      '<button class="btn" onclick="invoiceShareNotSent()">Nee, nog niet</button>'+
      '<button class="btn primary" onclick="confirmInvoiceShareSent(\''+id+'\',\''+channel+'\')">Ja, markeer als verzonden</button>'
    );
  }

  function invoiceShareNotSent(){
    closeModal();
    toast('Factuur niet als verzonden gemarkeerd');
  }

  function confirmInvoiceShareSent(id,channel){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    var customer=getContact(invoice.customerId);
    var at=new Date().toISOString();
    var subject=prepared&&prepared.id===id?prepared.subject:invoiceShareSubject(invoice,customer);
    invoice.lastSentAt=at;
    invoice.lastSentTo=prepared&&prepared.id===id?prepared.to:String(customer.email||'').trim();
    invoice.lastShareChannel=channel;
    invoice.sendHistory=(invoice.sendHistory||[]).concat([{
      sentAt:at,
      to:invoice.lastSentTo,
      subject:subject,
      provider:'manual-email-app',
      channel:channel,
      confirmedByUser:true
    }]);
    invoiceShareLog(invoice,channel,true);
    closeModal();
    toast('Factuur gemarkeerd als verzonden.');
    render();
  }

  function showPreparedNativeShareModal(){
    if(!prepared)return;
    modal(
      'Factuur klaar om te delen',
      '<div class="notice info"><strong>'+esc(prepared.file.name)+'</strong><br>Kies je e-mailapp in het deelmenu. Boekuna krijgt geen toegang tot je mailbox.</div>'+
      '<div class="help" style="margin-top:12px">Je bepaalt zelf in je e-mailapp of en wanneer je de e-mail verzendt.</div>',
      '<button class="btn" onclick="closeModal()">Annuleren</button>'+
      '<button class="btn primary" onclick="sharePreparedInvoice(true)">Kies je e-mailapp</button>'
    );
  }

  function showInvoiceShareFallback(autoDownload){
    if(!prepared)return;
    var downloaded=autoDownload?downloadInvoiceShareFile(prepared.file):false;
    modal(
      'Factuur klaar om te versturen',
      '<div class="notice info"><strong>'+esc(prepared.file.name)+(downloaded?' is gedownload.':' is klaar om te downloaden.')+'</strong><br>'+
      'Open daarna je e-mailapp. Voeg de PDF handmatig als bijlage toe voordat je verzendt.</div>'+
      '<div class="help" style="margin-top:12px">Boekuna opent je eigen e-mailapp. Wij krijgen geen toegang tot je mailbox.</div>',
      '<button class="btn" onclick="copyInvoiceShareValue(\'body\')">Bericht kopiëren</button>'+
      '<button class="btn" onclick="copyInvoiceShareValue(\'subject\')">Onderwerp kopiëren</button>'+
      '<button class="btn" onclick="downloadPreparedInvoicePdf()">PDF opnieuw downloaden</button>'+
      '<button class="btn primary" onclick="openPreparedInvoiceMailApp()">Open e-mailapp</button>',
      true
    );
  }

  function downloadPreparedInvoicePdf(){
    if(prepared)downloadInvoiceShareFile(prepared.file);
  }

  function openPreparedInvoiceMailApp(){
    if(!prepared)return;
    invoiceShareLog(prepared.invoice,'mailto',false);
    window.location.href=buildInvoiceMailto(prepared.to,prepared.subject,prepared.body);
    setTimeout(function(){showInvoiceShareConfirmation(prepared.id,'mailto');},350);
  }

  async function sharePreparedInvoice(fromExplicitUserAction){
    if(!prepared||shareInFlight)return;
    if(!canNativeShareInvoiceFile(prepared.file)){
      showInvoiceShareFallback(true);
      return;
    }
    shareInFlight=true;
    try{
      await navigator.share({title:prepared.subject,text:prepared.body,files:[prepared.file]});
      invoiceShareLog(prepared.invoice,'native_share',false);
      showInvoiceShareConfirmation(prepared.id,'native_share');
    }catch(err){
      if(err&&err.name==='AbortError'){
        closeModal();
        toast('Delen geannuleerd');
        return;
      }
      if(err&&err.name==='NotAllowedError'){
        if(fromExplicitUserAction)showInvoiceShareFallback(true);
        else showPreparedNativeShareModal();
        return;
      }
      console.warn('Native invoice share failed',err&&err.name?err.name:'SHARE_FAILED');
      showInvoiceShareFallback(true);
    }finally{
      shareInFlight=false;
    }
  }

  function showInvoiceShareError(id,message){
    modal(
      'Factuur kon niet worden voorbereid',
      '<div class="notice warn"><strong>'+esc(message||'De factuur-PDF kon niet worden gemaakt.')+'</strong><br>Je factuur is niet als verzonden gemarkeerd.</div>',
      '<button class="btn" onclick="closeModal()">Sluiten</button>'+
      '<button class="btn primary" onclick="closeModal();openSendInvoice(\''+id+'\')">Opnieuw proberen</button>'
    );
  }

  async function openInvoiceEmailShare(id){
    if(preparingInvoiceId===id){toast('De factuur wordt al voorbereid…');return;}
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    var customer=getContact(invoice.customerId);

    if(invoice.status==='draft' || (invoice.numberManaged&&!invoice.numberFinalized)){
      modal(
        'Maak de factuur eerst definitief',
        '<div class="notice warn"><strong>Alleen een definitieve factuur kan via je e-mailapp worden verstuurd.</strong><br>Controleer en finaliseer de factuur eerst.</div>',
        '<button class="btn" onclick="closeModal()">Sluiten</button>'
      );
      return;
    }

    var draft=Object.assign({},invoice,{customer:customer,paymentDays:invoice.paymentDays||0});
    var checks=invoiceSendChecks(draft,invoice.id);
    if(checks.errors.length){
      var emailMissing=checks.errors.some(function(item){return item.label==='Klant-e-mail';});
      var list=checks.errors.map(function(item){
        return '<div class="legal-item"><strong>'+esc(item.label)+'</strong><p>'+esc(item.msg)+'</p></div>';
      }).join('');
      var footer='<button class="btn" onclick="closeModal()">Sluiten</button>';
      if(emailMissing&&customer&&customer.id){
        footer+='<button class="btn primary" onclick="closeModal();editContact(\''+customer.id+'\')">Klantgegevens openen</button>';
      }
      modal(
        'Factuur nog niet klaar voor verzending',
        '<div class="notice warn"><strong>Deze factuur mist gegevens die voor verzending nodig zijn.</strong></div>'+
        '<div class="legal-list" style="margin-top:12px">'+list+'</div>',
        footer
      );
      return;
    }

    if(!isInvoiceShareEmail(customer.email)){
      var invalidFooter='<button class="btn" onclick="closeModal()">Sluiten</button>';
      if(customer&&customer.id){
        invalidFooter+='<button class="btn primary" onclick="closeModal();editContact(\''+customer.id+'\')">Klantgegevens openen</button>';
      }
      modal(
        'Controleer het e-mailadres',
        '<div class="notice warn"><strong>'+esc(customer.email||'Geen e-mailadres')+'</strong><br>Vul een geldig klant-e-mailadres in voordat je de e-mailapp opent.</div>',
        invalidFooter
      );
      return;
    }

    var subject=invoiceShareSubject(invoice,customer);
    var body=invoiceShareBody(invoice,customer);

    preparingInvoiceId=id;
    modal(
      'Factuur wordt voorbereid…',
      '<div class="notice info"><strong>We maken de definitieve PDF klaar.</strong><br>Daarna kies je zelf je e-mailapp.</div><div class="help" style="margin-top:12px">Boekuna krijgt geen toegang tot je mailbox.</div>',
      '<button class="btn primary" disabled>Even geduld…</button>'
    );
    try{
      var file=await fetchInvoiceSharePdf(invoice,customer);
      prepared={
        id:invoice.id,
        invoice:invoice,
        customer:customer,
        file:file,
        to:String(customer.email).trim(),
        subject:subject,
        body:body
      };
      if(canNativeShareInvoiceFile(file)&&(!navigator.userActivation||navigator.userActivation.isActive)){
        await sharePreparedInvoice(false);
      }else if(canNativeShareInvoiceFile(file)){
        showPreparedNativeShareModal();
      }else{
        showInvoiceShareFallback(true);
      }
    }catch(err){
      showInvoiceShareError(invoice.id,err&&err.message?err.message:'De factuur-PDF kon niet worden gemaakt.');
    }finally{
      preparingInvoiceId=null;
    }
  }

  window.sanitizeInvoiceShareFilenamePart=sanitizeInvoiceShareFilenamePart;
  window.invoiceShareFilename=invoiceShareFilename;
  window.isInvoiceShareEmail=isInvoiceShareEmail;
  window.buildInvoiceMailto=buildInvoiceMailto;
  window.canNativeShareInvoiceFile=canNativeShareInvoiceFile;
  window.fetchInvoiceSharePdf=fetchInvoiceSharePdf;
  window.downloadInvoiceShareFile=downloadInvoiceShareFile;
  window.copyInvoiceShareValue=copyInvoiceShareValue;
  window.downloadPreparedInvoicePdf=downloadPreparedInvoicePdf;
  window.openPreparedInvoiceMailApp=openPreparedInvoiceMailApp;
  window.sharePreparedInvoice=sharePreparedInvoice;
  window.showInvoiceShareConfirmation=showInvoiceShareConfirmation;
  window.invoiceShareNotSent=invoiceShareNotSent;
  window.confirmInvoiceShareSent=confirmInvoiceShareSent;
  window.openInvoiceEmailShare=openInvoiceEmailShare;
  window.openSendInvoice=openInvoiceEmailShare;
})();
</script>
<script id="boekuna-unified-email-handoff-v2">
(function(){
  'use strict';

  var handoff=null;
  var handoffBusy=false;
  var confirmBusy=false;

  function cleanHeader(value,max){
    return String(value==null?'':value).replace(/[\r\n]+/g,' ').trim().slice(0,max||240);
  }

  function cleanBody(value){
    return String(value==null?'':value).replace(/\r\n?/g,'\n').trim().slice(0,12000);
  }

  function validEmail(value){
    if(typeof window.isInvoiceShareEmail==='function')return window.isInvoiceShareEmail(value);
    var email=String(value==null?'':value).trim();
    return email.length<=240 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && !/[\r\n]/.test(email);
  }

  function likelyMobile(){
    try{
      if(navigator.userAgentData&&typeof navigator.userAgentData.mobile==='boolean')return navigator.userAgentData.mobile;
    }catch(_err){}
    return /Android|iPhone|iPad|iPod|Mobile/i.test(String(navigator.userAgent||''));
  }

  function contactGreeting(customer){
    var name=String(customer&&((customer.contactPerson||customer.name))||'').trim();
    return name?'Goedendag '+name+',':'Goedendag,';
  }
  function companyDisplayName(){return String((state.company&&state.company.tradeName)||(state.company&&state.company.name)||'').trim()}
  function emailSenderName(){return String((state.company&&state.company.contactName)||companyDisplayName()).trim()}
  function emailDate(value){var raw=String(value||'').trim();if(!raw)return '';var date=new Date(raw+'T12:00:00');if(Number.isNaN(date.getTime()))return dateNL(raw);try{return new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'long',year:'numeric'}).format(date)}catch(_err){return dateNL(raw)}}
  function joinEmailSections(sections){return cleanBody((sections||[]).map(function(section){if(Array.isArray(section))section=section.filter(Boolean).join('\n');return String(section==null?'':section).trim()}).filter(Boolean).join('\n\n'))}
  function emailSignatureBlock(){var lines=[],sender=emailSenderName();if(sender)lines.push(sender);if(state.company&&state.company.email)lines.push(String(state.company.email).trim());if(state.company&&state.company.phone)lines.push(String(state.company.phone).trim());return lines.filter(Boolean).join('\n')}
  function configuredInvoiceBody(invoice,customer){
    var configured=state.company&&state.company.emailTemplate&&state.company.emailTemplate.bodyInvoice;
    if(configured&&configured!==DEFAULT_EMAIL_TEMPLATE.bodyInvoice)return cleanBody(defaultInvoiceEmailMessage(invoice,customer));
    var summary=['Factuurdatum: '+emailDate(invoice.issueDate),'Vervaldatum: '+emailDate(invoice.dueDate),'Bedrag: '+money(invoiceGross(invoice))],payment='';
    if(state.company&&state.company.iban){payment='U kunt het bedrag overmaken naar '+String(state.company.iban).trim();if(invoice.paymentReference||invoice.number)payment+=' onder vermelding van '+String(invoice.paymentReference||invoice.number);payment+='.'}
    return joinEmailSections([contactGreeting(customer),'Hierbij ontvangt u factuur '+String(invoice.number||'')+' voor '+money(invoiceGross(invoice))+'.',summary,payment,'De factuur vindt u als PDF in de bijlage.','Heeft u vragen over de factuur? Neem dan gerust contact met ons op.',['Met vriendelijke groet,',emailSignatureBlock()]])
  }
  function invoiceSubject(invoice,customer){
    var template={...DEFAULT_EMAIL_TEMPLATE,...(state.company&&state.company.emailTemplate||{})};
    var raw=String(invoice&&invoice.kind==='credit'?template.subjectCredit:template.subjectInvoice||'').trim();
    var legacy=invoice&&invoice.kind==='credit'?'Creditfactuur {{factuurnummer}} van {{bedrijfsnaam}}':'Factuur {{factuurnummer}} van {{bedrijfsnaam}}';
    var currentDefault=invoice&&invoice.kind==='credit'?DEFAULT_EMAIL_TEMPLATE.subjectCredit:DEFAULT_EMAIL_TEMPLATE.subjectInvoice;
    if(raw&&raw!==legacy&&raw!==currentDefault)return cleanHeader(applyTemplate(raw,invoice,customer),240);
    var label=invoice&&invoice.kind==='credit'?'Creditfactuur':'Factuur',company=companyDisplayName()||String(state.company&&state.company.name||'').trim();
    return cleanHeader(label+' '+String(invoice&&invoice.number||'')+(company?' · '+company:''),240)
  }
  function invoiceBody(invoice,customer){if(invoice&&invoice.kind==='credit')return cleanBody(defaultInvoiceEmailMessage(invoice,customer));return configuredInvoiceBody(invoice,customer)}
  function reminderSubject(invoice){var second=Number(invoice.reminderCount||0)>=1,company=companyDisplayName()||String(state.company&&state.company.name||'').trim();return cleanHeader((second?'Tweede herinnering factuur ':'Herinnering factuur ')+String(invoice.number||'')+(company?' · '+company:''),240)}
  function reminderBody(invoice,customer){
    var second=Number(invoice.reminderCount||0)>=1,open=money(invoiceOutstanding(invoice));
    var intro=second?'Volgens onze administratie staat factuur '+String(invoice.number||'')+' nog steeds open. Het openstaande bedrag is '+open+'.':'Volgens onze administratie staat factuur '+String(invoice.number||'')+' van '+open+' nog open.';
    var due=second?'De vervaldatum was '+emailDate(invoice.dueDate)+'. Wilt u controleren of de betaling inmiddels is verwerkt?':'De vervaldatum was '+emailDate(invoice.dueDate)+'.';
    var crossed=second?'':'Het kan natuurlijk zijn dat uw betaling en deze herinnering elkaar hebben gekruist. Als u inmiddels heeft betaald, kunt u deze e-mail als niet verzonden beschouwen.',payment='';
    if(state.company&&state.company.iban){payment='U kunt het openstaande bedrag overmaken naar '+String(state.company.iban).trim();if(invoice.paymentReference||invoice.number)payment+=' onder vermelding van '+String(invoice.paymentReference||invoice.number);payment+='.'}
    return joinEmailSections([contactGreeting(customer),intro,due,crossed,payment,'De factuur is voor het gemak opnieuw toegevoegd.',['Met vriendelijke groet,',emailSignatureBlock()]])
  }
  function followUpSubject(invoice){var company=companyDisplayName()||String(state.company&&state.company.name||'').trim();return cleanHeader('Follow-up factuur '+String(invoice.number||'')+(company?' · '+company:''),240)}
  function followUpBody(invoice,customer){return joinEmailSections([contactGreeting(customer),'Ik stuur u hierbij een korte follow-up over factuur '+String(invoice.number||'')+' voor '+money(invoiceOutstanding(invoice)||invoiceGross(invoice))+'.','De vervaldatum is '+emailDate(invoice.dueDate)+'. Als u vragen heeft over de factuur, laat het gerust weten.',['Met vriendelijke groet,',emailSignatureBlock()]])}
  function buildGmailComposeUrl(to,subject,body){if(!validEmail(to))throw new Error('Ongeldig e-mailadres.');var safeSubject=cleanHeader(subject,240),safeBody=cleanBody(body);if(!safeSubject||!safeBody)throw new Error('Onderwerp en bericht zijn verplicht.');return 'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(String(to).trim())+'&su='+encodeURIComponent(safeSubject)+'&body='+encodeURIComponent(safeBody)}
  function handoffTitle(mode){
    if(mode==='payment_reminder')return 'Betalingsherinnering';
    if(mode==='follow_up')return 'Follow-up sturen';
    return 'Factuur versturen';
  }

  function showValidationErrors(title,errors,customer){
    var rows=(errors||[]).map(function(item){
      return '<div class="legal-item"><strong>'+esc(item.label||'Controle')+'</strong><p>'+esc(item.msg||'Controleer dit veld.')+'</p></div>';
    }).join('');
    var footer='<button class="btn" onclick="closeModal()">Sluiten</button>';
    if(customer&&customer.id)footer+='<button class="btn primary" onclick="closeModal();editContact(\''+customer.id+'\')">Klantgegevens openen</button>';
    modal(title,'<div class="notice warn"><strong>Controleer eerst de ontbrekende gegevens.</strong></div><div class="legal-list" style="margin-top:12px">'+rows+'</div>',footer,true);
  }

  function openComposer(options){
    handoff={
      mode:options.mode,
      invoiceId:options.invoice.id,
      customerId:options.customer.id,
      to:String(options.to||options.customer.email||'').trim(),
      subject:cleanHeader(options.subject,240),
      body:cleanBody(options.body),
      attachPdf:options.attachPdf!==false,
      file:options.file||null,
      fileDownloaded:!!options.fileDownloaded,
      confirmed:false
    };
    var attachControl='';
    if(options.mode!=='invoice'){
      attachControl='<label style="display:flex;gap:9px;align-items:flex-start"><input type="checkbox" name="attachPdf" '+(handoff.attachPdf?'checked':'')+' style="margin-top:3px"><span><strong>Factuur als PDF toevoegen</strong><span class="help" style="display:block">Op mobiel kan de PDF direct worden gedeeld. Op desktop wordt hij klaargezet om handmatig toe te voegen.</span></span></label>';
    }
    modal(
      handoffTitle(options.mode),
      '<form id="emailHandoffForm" class="form-grid">'+
        '<div class="field full"><label>Aan</label><input name="to" type="email" value="'+esc(handoff.to)+'" required maxlength="240"></div>'+
        '<div class="field full"><label>Onderwerp</label><input name="subject" value="'+esc(handoff.subject)+'" required maxlength="240"></div>'+
        '<div class="field full"><label>Bericht</label><textarea name="message" style="min-height:260px" maxlength="12000" required>'+esc(handoff.body)+'</textarea></div>'+
        (options.mode==='invoice'?'<div class="notice info full"><strong>De definitieve factuur-PDF wordt klaargezet.</strong><br>Boekuna krijgt geen toegang tot uw mailbox.</div>':'<div class="field full">'+attachControl+'</div>')+
      '</form>',
      '<button class="btn" onclick="closeModal()">Annuleren</button><button class="btn primary" onclick="prepareEmailHandoffFromComposer()">Verder naar e-mailapp</button>',
      true
    );
  }

  function readComposer(){
    var form=document.getElementById('emailHandoffForm');
    if(!form||!form.reportValidity())return null;
    var fd=new FormData(form);
    var to=String(fd.get('to')||'').trim();
    var subject=cleanHeader(fd.get('subject'),240);
    var body=cleanBody(fd.get('message'));
    if(!validEmail(to)){toast('Vul een geldig e-mailadres in.');return null;}
    if(!subject||!body){toast('Onderwerp en bericht zijn verplicht.');return null;}
    return {
      to:to,
      subject:subject,
      body:body,
      attachPdf:handoff&&handoff.mode==='invoice'?true:!!(form.elements.attachPdf&&form.elements.attachPdf.checked)
    };
  }

  async function prepareEmailHandoffFromComposer(){
    if(!handoff||handoffBusy)return;
    var values=readComposer();
    if(!values)return;
    handoff.to=values.to;
    handoff.subject=values.subject;
    handoff.body=values.body;
    handoff.attachPdf=values.attachPdf;
    handoffBusy=true;
    modal(
      'E-mail voorbereiden…',
      '<div aria-busy="true"><div class="notice info"><strong>Factuur controleren en e-mail voorbereiden…</strong><br>'+(handoff.attachPdf?'De definitieve PDF wordt nu klaargezet.':'Daarna kiest u zelf de e-mailapp.')+'</div><div class="processing-progress" style="margin-top:15px"><div class="processing-indeterminate" role="progressbar" aria-label="E-mail wordt voorbereid"></div></div></div>',
      '<button class="btn primary" disabled>Even geduld…</button>'
    );
    try{
      var invoice=state.invoices.find(function(item){return item.id===handoff.invoiceId;});
      var customer=getContact(handoff.customerId);
      if(!invoice||invoice.status==='draft'||(invoice.numberManaged&&!invoice.numberFinalized))throw new Error('De factuur is nog niet definitief.');
      if(handoff.attachPdf&&!handoff.file)handoff.file=await window.fetchInvoiceSharePdf(invoice,customer);
      showDeliveryOptions();
    }catch(err){
      modal(
        'E-mail kon niet worden voorbereid',
        '<div class="notice warn"><strong>'+esc(err&&err.message?err.message:'De e-mail kon niet worden voorbereid.')+'</strong><br>Er is niets als verzonden gemarkeerd.</div>',
        '<button class="btn" onclick="reopenEmailHandoffComposer()">Terug</button><button class="btn primary" onclick="prepareEmailHandoffFromComposer()">Opnieuw proberen</button>'
      );
    }finally{
      handoffBusy=false;
    }
  }

  function deliverySummary(){
    var attachment=handoff&&handoff.file?'<div class="help" style="margin-top:8px"><strong>PDF:</strong> '+esc(handoff.file.name)+'</div>':'';
    return '<div class="review-card"><div class="eyebrow">Aan</div><strong>'+esc(handoff.to)+'</strong><div class="eyebrow" style="margin-top:12px">Onderwerp</div><strong>'+esc(handoff.subject)+'</strong><div class="eyebrow" style="margin-top:12px">Bericht</div><div class="help" style="white-space:pre-wrap;max-height:210px;overflow:auto">'+esc(handoff.body)+'</div>'+attachment+'</div>';
  }

  function showDeliveryOptions(){
    if(!handoff)return;
    var nativePossible=!!(handoff.file&&typeof window.canNativeShareInvoiceFile==='function'&&window.canNativeShareInvoiceFile(handoff.file)),mobile=likelyMobile();
    var buttons='<button class="btn" onclick="reopenEmailHandoffComposer()">Terug aanpassen</button>';
    if(mobile){buttons+='<button class="btn" onclick="openEmailHandoffMailApp()">Andere e-mailapp openen</button>';if(nativePossible)buttons+='<button class="btn" onclick="shareEmailHandoffPdf()">PDF delen als bijlage</button>';buttons+='<button class="btn primary" onclick="openEmailHandoffGmail()">Gmail openen</button>'}
    else{buttons+='<button class="btn" onclick="openEmailHandoffGmail()">Gmail in browser</button>';if(nativePossible)buttons+='<button class="btn" onclick="shareEmailHandoffPdf()">PDF delen als bijlage</button>';buttons+='<button class="btn primary" onclick="openEmailHandoffMailApp()">Open e-mailapp</button>'}
    var note=mobile
      ?'<div class="notice info" style="margin-bottom:12px"><strong>Hoe wilt u de e-mail versturen?</strong><br>Gmail openen vult Aan, Onderwerp en Bericht in; voeg daarna de klaargezette PDF toe. '+(nativePossible?'Met “PDF delen als bijlage” gaat de PDF direct mee, maar de ontvangende app bepaalt zelf Aan en Onderwerp.':'')+'</div>'
      :'<div class="notice info" style="margin-bottom:12px"><strong>De PDF is klaar.</strong><br>Open e-mailapp en Gmail vullen ontvanger, onderwerp en bericht in. Voeg daarna de klaargezette PDF als bijlage toe. '+(nativePossible?'“PDF delen als bijlage” kan de PDF direct meenemen, maar de ontvangende app bepaalt zelf Aan en Onderwerp.':'')+'</div>';
    modal('Hoe wilt u versturen?',note+deliverySummary()+'<div class="help" style="margin-top:12px">Boekuna krijgt geen toegang tot Gmail, Outlook of uw inbox.</div>',buttons,true)
  }
  function reopenEmailHandoffComposer(){
    if(!handoff)return;var previous=handoff,invoice=state.invoices.find(function(item){return item.id===previous.invoiceId;}),customer=getContact(previous.customerId);if(!invoice||!customer)return;
    openComposer({mode:previous.mode,invoice:invoice,customer:customer,to:previous.to,subject:previous.subject,body:previous.body,attachPdf:previous.attachPdf,file:previous.file,fileDownloaded:previous.fileDownloaded})
  }
  function ensureEmailHandoffPdfDownloaded(){if(!handoff||!handoff.file||handoff.fileDownloaded)return false;var downloaded=window.downloadInvoiceShareFile(handoff.file);if(downloaded)handoff.fileDownloaded=true;return downloaded}
  function emailHandoffMailtoUrl(){
    if(!handoff)throw new Error('Geen e-mail voorbereid.');
    return window.buildInvoiceMailto(handoff.to,handoff.subject,handoff.body);
  }

  function recordStart(channel){
    if(!handoff)return;
    var invoice=state.invoices.find(function(item){return item.id===handoff.invoiceId;});
    if(!invoice)return;
    logEvent('E-mailhandoff gestart',String(invoice.number||'')+' · '+handoff.mode+' · '+channel,'invoice',invoice.id);
    save();
  }

  function openEmailHandoffMailApp(){
    if(!handoff||handoffBusy)return;handoffBusy=true;
    try{if(handoff.file)ensureEmailHandoffPdfDownloaded();var uri=emailHandoffMailtoUrl();window.__boekunaLastMailto=uri;recordStart('mailto');window.location.href=uri;setTimeout(function(){showEmailHandoffConfirmation('mailto');handoffBusy=false;},450)}
    catch(err){handoffBusy=false;toast(err&&err.message?err.message:'De e-mailapp kon niet worden geopend.')}
  }
  function openEmailHandoffGmail(){
    if(!handoff||handoffBusy)return;if(!validEmail(handoff.to)){toast('Vul een geldig e-mailadres in.');return}if(!cleanHeader(handoff.subject,240)||!cleanBody(handoff.body)){toast('Onderwerp en bericht zijn verplicht.');return}handoffBusy=true;
    try{var downloaded=handoff.file?ensureEmailHandoffPdfDownloaded():false;if(handoff.file)toast(downloaded?'PDF staat klaar. Voeg hem in Gmail via de paperclip toe.':'PDF staat klaar om in Gmail toe te voegen.');var url=buildGmailComposeUrl(handoff.to,handoff.subject,handoff.body);window.__boekunaLastGmailUrl=url;recordStart('gmail_web');var popup=window.open(url,'_blank','noopener,noreferrer');if(!popup){toast('Gmail kon niet openen. De standaard e-mailapp wordt gebruikt.');window.location.href=emailHandoffMailtoUrl();setTimeout(function(){showEmailHandoffConfirmation('mailto');handoffBusy=false;},450);return}setTimeout(function(){showEmailHandoffConfirmation('gmail_web');handoffBusy=false;},450)}
    catch(err){handoffBusy=false;toast(err&&err.message?err.message:'Gmail kon niet worden geopend.')}
  }
  async function shareEmailHandoffPdf(){
    if(!handoff||handoffBusy||!handoff.file)return;
    if(!window.canNativeShareInvoiceFile(handoff.file)){
      toast('Deze browser kan de PDF niet direct delen. Gebruik Gmail openen of een andere e-mailapp.');
      return;
    }
    handoffBusy=true;
    try{
      await navigator.share({title:handoff.subject,text:handoff.body,files:[handoff.file]});
      recordStart('native_share');
      showEmailHandoffConfirmation('native_share');
    }catch(err){
      if(err&&err.name==='AbortError'){
        toast('Delen geannuleerd');
        showDeliveryOptions();
      }else{
        console.warn('Email handoff share failed',err&&err.name?err.name:'SHARE_FAILED');
        toast('Delen lukte niet. Gebruik Gmail openen of een andere e-mailapp.');
        showDeliveryOptions();
      }
    }finally{
      handoffBusy=false;
    }
  }

  function showEmailHandoffConfirmation(channel){
    if(!handoff)return;
    var noun=handoff.mode==='payment_reminder'?'herinnering':handoff.mode==='follow_up'?'follow-up':'factuur';
    modal(
      'Hebt u de e-mail verzonden?',
      '<div class="notice info"><strong>Boekuna kan niet zien of u in uw e-mailapp op Verzenden hebt gedrukt.</strong><br>Bevestig dit alleen als de '+noun+' echt is verstuurd.</div>',
      '<button class="btn" onclick="emailHandoffNotSent()">Nee, nog niet</button><button class="btn primary" onclick="confirmEmailHandoff(\''+channel+'\')">Ja, markeer als verzonden</button>'
    );
  }

  function emailHandoffNotSent(){
    closeModal();
    toast('E-mail niet als verzonden gemarkeerd');
  }

  function confirmEmailHandoff(channel){
    if(!handoff||confirmBusy||handoff.confirmed)return;
    confirmBusy=true;
    try{
      var invoice=state.invoices.find(function(item){return item.id===handoff.invoiceId;});
      if(!invoice)return;
      var at=new Date().toISOString();
      var entry={sentAt:at,to:handoff.to,subject:handoff.subject,provider:'manual-email-app',channel:channel,confirmedByUser:true};
      if(handoff.mode==='payment_reminder'){
        invoice.lastReminderAt=at;
        invoice.lastReminderTo=handoff.to;
        invoice.reminderCount=Number(invoice.reminderCount||0)+1;
        invoice.reminderHistory=(invoice.reminderHistory||[]).concat([entry]);
        logEvent('Betalingsherinnering verzending bevestigd',String(invoice.number||'')+' · '+channel,'invoice',invoice.id);
      }else if(handoff.mode==='follow_up'){
        invoice.lastFollowUpAt=at;
        invoice.followUpHistory=(invoice.followUpHistory||[]).concat([entry]);
        logEvent('Factuur follow-up verzending bevestigd',String(invoice.number||'')+' · '+channel,'invoice',invoice.id);
      }else{
        invoice.lastSentAt=at;
        invoice.lastSentTo=handoff.to;
        invoice.lastShareChannel=channel;
        invoice.sendHistory=(invoice.sendHistory||[]).concat([entry]);
        logEvent('Factuur verzending bevestigd',String(invoice.number||'')+' · '+channel,'invoice',invoice.id);
      }
      handoff.confirmed=true;
      save();
      closeModal();
      render();
      toast('Verzending bevestigd.');
    }finally{
      confirmBusy=false;
    }
  }

  async function copyEmailHandoffValue(kind){
    if(!handoff)return;
    var value=kind==='to'?handoff.to:kind==='subject'?handoff.subject:handoff.body;
    try{
      await navigator.clipboard.writeText(value);
      toast(kind==='to'?'E-mailadres gekopieerd':kind==='subject'?'Onderwerp gekopieerd':'Bericht gekopieerd');
    }catch(_err){
      toast('Kopiëren lukte niet.');
    }
  }

  function finalInvoiceSendChecks(invoice,customer){
    var draft=Object.assign({},invoice,{customer:customer,paymentDays:invoice.paymentDays||0});
    return invoiceSendChecks(draft,invoice.id);
  }

  function openInvoiceComposer(id){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    var customer=getContact(invoice.customerId);
    if(invoice.status==='draft'||(invoice.numberManaged&&!invoice.numberFinalized)){
      showDraftSendPrompt(id);
      return;
    }
    var checks=finalInvoiceSendChecks(invoice,customer);
    if(checks.errors.length){showValidationErrors('Factuur nog niet klaar voor verzending',checks.errors,customer);return;}
    if(!validEmail(customer.email)){
      showValidationErrors('Controleer het e-mailadres',[{label:'Klant-e-mail',msg:'Vul een geldig klant-e-mailadres in voordat u de e-mailapp opent.'}],customer);
      return;
    }
    openComposer({mode:'invoice',invoice:invoice,customer:customer,to:customer.email,subject:invoiceSubject(invoice,customer),body:invoiceBody(invoice,customer),attachPdf:true});
  }

  function showDraftSendPrompt(id){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    if(invoice.kind==='credit'){
      modal('Maak de creditfactuur eerst definitief','<div class="notice warn"><strong>Deze creditfactuur is nog een concept.</strong><br>Maak de creditfactuur eerst definitief voordat u haar deelt.</div>','<button class="btn" onclick="closeModal()">Sluiten</button>');
      return;
    }
    modal(
      'Deze factuur is nog een concept',
      '<div class="notice info"><strong>Om deze factuur te versturen maken we hem eerst definitief.</strong><br>Boekuna kent het definitieve factuurnummer toe, slaat de factuur veilig op en maakt daarna de PDF.</div><div class="help" style="margin-top:10px">Als u daarna de e-mailapp sluit zonder te verzenden, blijft de factuur definitief maar wordt hij niet als verzonden gemarkeerd.</div>',
      '<button class="btn" onclick="closeModal()">Annuleren</button><button class="btn primary" onclick="finalizeDraftAndSend(\''+id+'\')">Definitief maken en versturen</button>'
    );
  }

  async function finalizeDraftAndSend(id){
    if(handoffBusy)return;
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice||invoice.status!=='draft')return openInvoiceComposer(id);
    var customer=getContact(invoice.customerId);
    var draft=Object.assign({},structuredClone(invoice),{customer:customer,paymentDays:invoice.paymentDays||0,status:'sent'});
    var checks=invoiceSendChecks(draft,id);
    var missing=requirementsFor('invoice-finalize',draft);
    if(missing.length){
      showValidationErrors('Uw factuur is bijna klaar',missing.map(function(item){return {label:item.label||'Bedrijfsgegevens',msg:item.msg||'Vul de ontbrekende bedrijfsgegevens aan.'};}),customer);
      return;
    }
    if(checks.errors.length){showValidationErrors('Factuur nog niet klaar voor verzending',checks.errors,customer);return;}
    handoffBusy=true;
    modal('Factuur definitief maken…','<div aria-busy="true"><div class="notice info"><strong>Factuur controleren en definitief opslaan…</strong><br>Daarna wordt de e-mailcomposer geopend.</div><div class="processing-progress" style="margin-top:15px"><div class="processing-indeterminate" role="progressbar" aria-label="Factuur wordt definitief gemaakt"></div></div></div>','<button class="btn primary" disabled>Even geduld…</button>');
    try{
      editingInvoiceId=id;
      pendingInvoiceDraft=draft;
      await finalSaveInvoice();
      var finalized=state.invoices.find(function(item){return item.id===id;});
      if(!finalized||finalized.status==='draft'||(finalized.numberManaged&&!finalized.numberFinalized)){
        throw new Error('De factuur kon niet veilig definitief worden opgeslagen.');
      }
      openInvoiceComposer(id);
    }catch(err){
      modal('Factuur kon niet definitief worden gemaakt','<div class="notice warn"><strong>'+esc(err&&err.message?err.message:'De factuur kon niet worden opgeslagen.')+'</strong><br>Er is geen e-mail als verzonden gemarkeerd.</div>','<button class="btn" onclick="closeModal()">Sluiten</button><button class="btn primary" onclick="finalizeDraftAndSend(\''+id+'\')">Opnieuw proberen</button>');
    }finally{
      handoffBusy=false;
    }
  }

  function openReminder(id){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    if(invoice.kind==='credit'){toast('Voor een creditfactuur stuurt u geen betalingsherinnering.');return;}
    if(invoice.status==='draft'){toast('Maak de factuur eerst definitief voordat u een herinnering stuurt.');return;}
    if(invoice.status==='cancelled'){toast('Voor een geannuleerde factuur stuurt u geen betalingsherinnering.');return;}
    if(invoiceEffectiveStatus(invoice)==='paid'||toCents(invoiceOutstanding(invoice))<=0){toast('Deze factuur is volledig betaald.');return;}
    var customer=getContact(invoice.customerId);
    if(invoice.dueDate&&invoice.dueDate>=today()){
      modal(
        'Factuur is nog niet vervallen',
        '<div class="notice info"><strong>De vervaldatum is '+esc(dateNL(invoice.dueDate))+'.</strong><br>Wilt u toch contact opnemen, maak dan een gewone follow-up in plaats van een betalingsherinnering.</div>',
        '<button class="btn" onclick="closeModal()">Annuleren</button><button class="btn primary" onclick="openFollowUp(\''+id+'\')">Follow-up maken</button>'
      );
      return;
    }
    if(!validEmail(customer.email)){showValidationErrors('Controleer het e-mailadres',[{label:'Klant-e-mail',msg:'Vul een geldig klant-e-mailadres in.'}],customer);return;}
    openComposer({mode:'payment_reminder',invoice:invoice,customer:customer,to:customer.email,subject:reminderSubject(invoice),body:reminderBody(invoice,customer),attachPdf:true});
  }

  function openFollowUp(id){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice||invoice.status==='draft'||invoice.kind==='credit')return toast('Maak de factuur eerst definitief voordat u een follow-up stuurt.');
    var customer=getContact(invoice.customerId);
    if(!validEmail(customer.email)){showValidationErrors('Controleer het e-mailadres',[{label:'Klant-e-mail',msg:'Vul een geldig klant-e-mailadres in.'}],customer);return;}
    openComposer({mode:'follow_up',invoice:invoice,customer:customer,to:customer.email,subject:followUpSubject(invoice),body:followUpBody(invoice,customer),attachPdf:true});
  }

  async function prepareReminderHandoffFromForm(id){
    if(document.getElementById('emailHandoffForm'))return prepareEmailHandoffFromComposer();
    return openReminder(id);
  }

  function invoiceActions(id){
    var invoice=state.invoices.find(function(item){return item.id===id;});
    if(!invoice)return;
    var customer=getContact(invoice.customerId);
    var final=invoice.status!=='draft';
    var paid=invoiceEffectiveStatus(invoice)==='paid';
    var delivery=invoice.lastSentAt
      ?'<div class="notice good"><strong>Verzonden bevestigd</strong><br>'+esc(dateNL(String(invoice.lastSentAt).slice(0,10)))+(invoice.lastReminderAt?' · herinnering bevestigd '+esc(dateNL(String(invoice.lastReminderAt).slice(0,10))):'')+'</div>'
      :(final?'<div class="notice warn"><strong>Nog niet als verzonden bevestigd.</strong><br>De factuur is definitief, maar er is nog geen bevestigde e-mailverzending vastgelegd.</div>':'');
    var rows='';
    if(invoice.status==='draft'){
      rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="closeModal();editInvoice(\''+id+'\')"><div class="action-text"><strong>Concept bewerken</strong><span>Pas klant, datums, diensten, prijzen, btw en notities aan</span></div></button>';
    }else{
      rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="duplicateInvoiceAsDraft(\''+id+'\')"><div class="action-text"><strong>Nieuwe versie als concept</strong><span>Gebruik deze factuur als basis zonder de originele administratie te overschrijven</span></div></button>';
    }
    rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="closeModal();viewInvoice(\''+id+'\')"><div class="action-text"><strong>Bekijken / PDF</strong><span>Controleer de factuur of sla hem als PDF op</span></div></button>';
    if(invoice.status==='draft'&&invoice.kind!=='credit'){
      rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="closeModal();openSendInvoice(\''+id+'\')"><div class="action-text"><strong>Definitief maken en versturen</strong><span>'+(customer.email?'Naar '+esc(customer.email):'Voeg het e-mailadres van de klant toe')+'</span></div></button>';
    }else if(final){
      rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="closeModal();openSendInvoice(\''+id+'\')"><div class="action-text"><strong>'+(invoice.lastSentAt?'Opnieuw versturen':'Versturen via e-mail')+'</strong><span>'+(customer.email?'Naar '+esc(customer.email):'Voeg het e-mailadres van de klant toe')+'</span></div></button>';
    }
    if(final&&invoice.kind!=='credit'){
      if(!paid)rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="closeModal();openReminder(\''+id+'\')"><div class="action-text"><strong>Betalingsherinnering</strong><span>Maak een nette opvolgmail en voeg de factuur opnieuw toe</span></div></button>';
      rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="closeModal();openFollowUp(\''+id+'\')"><div class="action-text"><strong>Follow-up sturen</strong><span>Stuur een vrij aanpasbare opvolgmail</span></div></button>';
      if(!paid)rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="closeModal();registerPayment(\''+id+'\')"><div class="action-text"><strong>Betaling registreren</strong><span>'+esc(money(invoiceOutstanding(invoice)))+' staat nog open; deelbetaling mogelijk</span></div></button>';
      rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="createCreditNote(\''+id+'\')"><div class="action-text"><strong>Creditfactuur maken</strong><span>Corrigeer een definitieve factuur zonder de historie te overschrijven</span></div></button>';
    }
    if(invoice.status==='draft')rows+='<button class="action-row" style="background:#fff;text-align:left" onclick="deleteInvoice(\''+id+'\')"><div class="action-text"><strong style="color:var(--bad)">Concept verwijderen</strong><span>Alleen conceptfacturen kunnen hard worden verwijderd</span></div></button>';
    modal(esc(invoice.number),delivery+'<div class="action-list" style="margin-top:12px">'+rows+'</div>');
  }

  window.buildGmailComposeUrl=buildGmailComposeUrl;
  window.prepareEmailHandoffFromComposer=prepareEmailHandoffFromComposer;
  window.reopenEmailHandoffComposer=reopenEmailHandoffComposer;
  window.emailHandoffMailtoUrl=emailHandoffMailtoUrl;
  window.openEmailHandoffMailApp=openEmailHandoffMailApp;
  window.openEmailHandoffGmail=openEmailHandoffGmail;
  window.shareEmailHandoffPdf=shareEmailHandoffPdf;
  window.showEmailHandoffConfirmation=showEmailHandoffConfirmation;
  window.emailHandoffNotSent=emailHandoffNotSent;
  window.confirmEmailHandoff=confirmEmailHandoff;
  window.copyEmailHandoffValue=copyEmailHandoffValue;
  window.finalizeDraftAndSend=finalizeDraftAndSend;
  window.prepareReminderHandoffFromForm=prepareReminderHandoffFromForm;
  window.openFollowUp=openFollowUp;
  window.openReminder=openReminder;
  window.sendReminder=prepareReminderHandoffFromForm;
  window.invoiceActions=invoiceActions;
  window.openInvoiceEmailShare=openInvoiceComposer;
  window.openSendInvoice=openInvoiceComposer;
  window.__boekunaEmailHandoffTestState=function(){
    if(!TEST_MODE_NO_AUTH||!handoff)return null;
    return {
      mode:handoff.mode,to:handoff.to,subject:handoff.subject,body:handoff.body,attachPdf:handoff.attachPdf,
      file:handoff.file?{name:handoff.file.name,type:handoff.file.type,size:handoff.file.size}:null,
      fileDownloaded:!!handoff.fileDownloaded,
      confirmed:handoff.confirmed
    };
  };
})();
</script>
<script id="boekuna-upload-bootstrap">
(function(){
 const configs=[
  ['invoicePdfFile','auto'],
  ['receiptPhotoFile','purchase'],
  ['receiptCameraFile','purchase']
 ];
 for(const [id,kind] of configs){
  const input=document.getElementById(id);
  if(!input)continue;
  input.onchange=function(){
   try{
    if(typeof window.startSelectedDocumentUpload!=='function')throw new Error('De documentscanner kon niet worden gestart. Vernieuw Boekuna en probeer opnieuw.');
    void window.startSelectedDocumentUpload(input,kind);
   }catch(err){
    console.error('Upload bootstrap failed',err);
    if(typeof window.toast==='function')window.toast(err?.message||'Upload kon niet starten');
    else window.alert(err?.message||'Upload kon niet starten');
   }
  };
  input.dataset.uploadBound='true';
 }
})();
</script>
